tableTools.addEventListener("pointermove",e=>{
  const gesture=tableGesture;
  if(!gesture||(!gesture.active&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<5))return;
  if(!gesture.active){gesture.active=true;hideMenus()}
  const {kind,table,row,column}=gesture;
  const bounds=table.getBoundingClientRect();
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
  const rect=table.rows[row].cells[column].getBoundingClientRect();
  if(kind==="corner"){
    const {rows,columns}=tableGrid(table);
    gesture.rows=Math.max(1,rows.length+Math.round(dy/Math.max(34,rect.height)));
    gesture.columns=Math.max(1,columns+Math.round(dx/Math.max(76,rect.width)));
    tableDimension.textContent=`${gesture.rows} × ${gesture.columns}`;
    tableDimension.style.left=Math.max(4,Math.min(e.clientX+8,innerWidth-76))+"px";
    tableDimension.style.top=Math.max(4,Math.min(e.clientY+8,innerHeight-28))+"px";
    tableDimension.hidden=false;
    return;
  }
  if(kind==="width"){
    gesture.width=Math.max(76,Math.round(rect.width+dx));
    Object.assign(tableGuide.style,{left:(rect.left+gesture.width)+"px",top:bounds.top+"px",width:"2px",height:bounds.height+"px"});
  }else{
    const entries=kind==="row"?Array.from(table.rows):Array.from(table.rows[0].cells);
    const origin=kind==="row"?row:column;
    const position=kind==="row"?e.clientY:e.clientX;
    const edge=end=>kind==="row"?(end?"bottom":"top"):(end?"right":"left");
    const index=entries.findIndex(entry=>position<entry.getBoundingClientRect()[edge(true)]);
    gesture.target=index<0?entries.length-1:index;
    const line=entries[gesture.target].getBoundingClientRect()[edge(gesture.target>origin)];
    Object.assign(tableGuide.style,kind==="row"?
      {left:bounds.left+"px",top:line+"px",width:bounds.width+"px",height:"2px"}:
      {left:line+"px",top:bounds.top+"px",width:"2px",height:bounds.height+"px"});
  }
  tableGuide.hidden=false;
});
function finishTableGesture(commit){
  const gesture=tableGesture;tableGesture=null;
  tableGuide.hidden=true;tableDimension.hidden=true;
  if(!gesture?.active)return;
  skipTableClick=true;
  const {kind,table,row,column,target}=gesture;
  if(!commit||!table.isConnected)return;
  if(kind==="row"||kind==="column"){
    const origin=kind==="row"?row:column;
    if(target!==origin)tableAction(table.rows[row].cells[column],kind,"move",target-origin);
    return;
  }
  if(kind==="width"){
    const widths=Array.from(table.rows[0].cells,cell=>Math.round(cell.getBoundingClientRect().width));
    widths[column]=gesture.width;
    editTable(table,()=>setTableWidths(table,widths),row,column);
    return;
  }
  const grid=tableGrid(table);
  if(grid.rows.length===gesture.rows&&grid.columns===gesture.columns)return;
  editTable(table,()=>{
    while(table.rows.length<gesture.rows)mutateTableAxis(table,"row","insert",table.rows.length);
    while(table.rows.length>gesture.rows)mutateTableAxis(table,"row","remove",table.rows.length-1);
    for(let c=grid.columns;c<gesture.columns;c++)mutateTableAxis(table,"column","insert",c);
    for(let c=grid.columns;c>gesture.columns;c--)mutateTableAxis(table,"column","remove",c-1);
  },row,column);
}
tableTools.addEventListener("pointerup",()=>finishTableGesture(true));
tableTools.addEventListener("pointercancel",()=>finishTableGesture(false));

function tableCellBoundary(cell,forward){
  const selection=getSelection();
  if(!selection?.isCollapsed||!cell.contains(selection.anchorNode))return false;
  const rest=intervaloDoBloco(cell);
  if(forward)rest.setStart(selection.anchorNode,selection.anchorOffset);
  else rest.setEnd(selection.anchorNode,selection.anchorOffset);
  return !rest.toString()&&!rest.cloneContents().querySelector("img,video,iframe");
}
function handleTableKey(e,cell){
  const table=cell.closest("table");
  if(e.key==="ContextMenu"||(e.key==="F10"&&e.shiftKey)){
    e.preventDefault();
    const rect=cell.getBoundingClientRect();
    openTableMenu(cell,"cell",rect.left,rect.bottom,tableButtons.get("row"));
    return true;
  }
  if(e.key==="Tab"&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const cells=Array.from(table.rows).flatMap(row=>Array.from(row.cells));
    const next=cells[cells.indexOf(cell)+(e.shiftKey?-1:1)];
    if(!next&&e.shiftKey)return false;
    e.preventDefault();
    if(next)focusTableCell(next);
    else if(tableGrid(table).simple){
      tableAction(cell,"row","append");
      focusTableCell(table.rows[table.rows.length-1].cells[0]);
    }
    return true;
  }
  if(e.key==="Enter"&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    e.preventDefault();apagarSelecaoTexto();insertNewlineAtCaret();touchNote();return true;
  }
  if((e.key==="Backspace"||e.key==="Delete")&&tableCellBoundary(cell,e.key==="Delete")){
    e.preventDefault();return true;
  }
  return false;
}

/* Video: arquivo pequeno vira data URL; link vira player embutido.
   O limite existe porque tudo mora no localStorage do navegador. */
const LIMITE_VIDEO=2*1024*1024;
/* Midia entra como bloco proprio (como divisor/tabela): ganha alcinha de
   arrastar, se apaga sozinha e nao fica presa dentro de um paragrafo. */
function insertMediaBlock(html){
  if(!selectedNote())return;
  let row=currentRow()||$$(".block-row",blockEditor).at(-1);
  if(!row){
    blockEditor.insertAdjacentHTML("beforeend",blockHTML(blankBlock("p","")));
    row=$$(".block-row",blockEditor).at(-1);
  }
  histPush(true);
  const c=$(".block-content",row);
  const vazio=c&&!(c.textContent||"").trim()&&!c.querySelector("img,video,iframe");
  let alvo;
  if(vazio&&["p","media"].includes(row.dataset.type)){
    row.dataset.type="media";
    c.dataset.placeholder="";
    c.innerHTML=html;
    alvo=row;
  }else{
    alvo=insertAfter(row,"media",html,Number(row.dataset.indent)||0);
  }
  /* sempre deixa um paragrafo depois, para continuar escrevendo */
  if(!alvo.nextElementSibling)insertAfter(alvo,"p","");
  renumberLists();touchNote();
  requestAnimationFrame(()=>{
    const seguinte=alvo.nextElementSibling;
    if(seguinte)focusBlock(seguinte,true);
  });
  return alvo;
}
/* Fonte unica da marcacao de video, usada na insercao e na importacao. */
function videoHTML(src,largura){
  const w=largura?` style="width:${largura}"`:"";
  const yt=String(src).match(/youtube\.com\/embed\/([\w-]+)/);
  const vm=String(src).match(/player\.vimeo\.com\/video\/(\d+)/);
  if(yt){
    const capa=`https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg`;
    return `<span class="video-card" contenteditable="false" data-label="YouTube"`+
      ` data-embed="${esc(src)}" data-watch="https://youtu.be/${yt[1]}"${w}>`+
      `<img src="${capa}" alt="Capa do vídeo" draggable="false"><span class="video-play"></span></span>`;
  }
  if(vm){
    return `<span class="video-card" contenteditable="false" data-label="Vimeo"`+
      ` data-embed="${esc(src)}" data-watch="https://vimeo.com/${vm[1]}"${w}></span>`;
  }
  return `<iframe class="embed" src="${esc(src)}" allowfullscreen loading="lazy" contenteditable="false"${w}></iframe>`;
}
function embedVideo(url){
  const u=String(url||"").trim();
  if(!u)return;
  const yt=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  const vm=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  let html="";
  if(yt)html=videoHTML(`https://www.youtube.com/embed/${yt[1]}`);
  else if(vm)html=videoHTML(`https://player.vimeo.com/video/${vm[1]}`);
  else if(/^https?:\/\//i.test(u))html=`<video src="${esc(u)}" controls preload="metadata"></video>`;
  else{toast("Link de vídeo inválido");return}
  insertMediaBlock(html);
}

/* Busca na nota: usa Range + selecao nativa, sem mexer no conteudo do bloco. */
function findCollect(){
  /* percorre so o texto dos blocos: controles auxiliares (icone do destaque,
     seta da sanfona) nao podem entrar no indice nem deslocar os offsets */
  const nodes=[];let texto="";
  $$(".block-content",blockEditor).forEach(c=>{
    const walker=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);
    let n;
    while((n=walker.nextNode())){nodes.push({node:n,start:texto.length});texto+=n.nodeValue||""}
    texto+=String.fromCharCode(10);
  });
  return {nodes,texto};
}
function findLocate(off){
  for(let k=find.nodes.length-1;k>=0;k--){
    const it=find.nodes[k];
    if(off>=it.start)return{node:it.node,offset:off-it.start};
  }
  return null;
}
function findUpdateCount(){
  if(!findCount)return;
  findCount.textContent=!find.termo?"":find.hits.length?`${find.i+1} de ${find.hits.length}`:"nenhum";
}
function findGo(i){
  if(!find.hits.length)return findUpdateCount();
  find.i=(i+find.hits.length)%find.hits.length;
  const hit=find.hits[find.i];
  const a=findLocate(hit.start), b=findLocate(hit.end-1);
  if(!a||!b)return findUpdateCount();
  try{
    const r=document.createRange();
    r.setStart(a.node,Math.min(a.offset,(a.node.nodeValue||"").length));
    r.setEnd(b.node,Math.min(b.offset+1,(b.node.nodeValue||"").length));
    const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
    (a.node.parentElement||blockEditor).scrollIntoView({block:"center",behavior:"smooth"});
  }catch{}
  findUpdateCount();
}
function findRun(termo){
  find.termo=termo||"";
  find.hits=[];find.i=-1;
  if(!find.termo){findUpdateCount();return}
  const {nodes,texto}=findCollect();
  find.nodes=nodes;
  const alvo=texto.toLowerCase(), agulha=find.termo.toLowerCase();
  let pos=alvo.indexOf(agulha);
  while(pos>=0&&find.hits.length<2000){
    find.hits.push({start:pos,end:pos+agulha.length});
    pos=alvo.indexOf(agulha,pos+agulha.length);
  }
  if(find.hits.length)findGo(0);else findUpdateCount();
}
function findOpen(){
  if(!selectedNote())return;
  findBar.classList.remove("hidden");
  const sel=getSelection();
  const marcado=sel&&!sel.isCollapsed&&blockEditor.contains(sel.anchorNode?.parentElement||sel.anchorNode)
    ? String(sel).trim() : "";
  if(marcado&&marcado.length<80)findInput.value=marcado;
  findInput.focus();findInput.select();
  if(findInput.value)findRun(findInput.value);
}
function findClose(restoreFocus=true){
  findBar.classList.add("hidden");
  find.termo="";find.hits=[];find.nodes=[];find.i=-1;
  findUpdateCount();
  const row=restoreFocus?currentRow():null;if(row)focusBlock(row,true);
}

/* Colar: mantem o basico e descarta estilos de fora (Word, web, etc). */
const TAGS_COLAR=new Set(["B","STRONG","I","EM","U","S","STRIKE","DEL","CODE","A","MARK","BR","IMG"]);
function cleanPastedHTML(html=""){
  const d=document.createElement("div");
  d.innerHTML=html;
  d.querySelectorAll("*").forEach(el=>{
    if(!TAGS_COLAR.has(el.tagName)){el.replaceWith(...el.childNodes);return}
    const href=el.tagName==="A"?el.getAttribute("href"):null;
    const est=el.tagName==="MARK"?el.getAttribute("data-hl-style"):null;
    const imgSrc=el.tagName==="IMG"?el.getAttribute("src"):null;
    const imgAlt=el.tagName==="IMG"?el.getAttribute("alt"):null;
    Array.from(el.attributes).forEach(a=>el.removeAttribute(a.name));
    if(el.tagName==="A"){
      if(href&&/^(https?:|mailto:|#|\/)/i.test(href))el.setAttribute("href",href);
      else el.replaceWith(...el.childNodes);
    }
    if(el.tagName==="MARK")el.setAttribute("data-hl-style",est||"regular");
    if(el.tagName==="IMG"){
      if(imgSrc&&/^(https?:|data:image\/)/i.test(imgSrc)){
        el.setAttribute("src",imgSrc);
        el.setAttribute("alt",imgAlt||"imagem");
      }else el.remove();
    }
  });
  return d.innerHTML;
}

function saveSelection(){
  const s=getSelection();if(!s?.rangeCount)return;
  const r=s.getRangeAt(0);
  if(selecaoEntreBlocos(r)){savedRange=null;return}
  const n=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;
  if(n&&blockEditor.contains(n))savedRange=r.cloneRange();
}
function restoreSelection(){
  if(!savedRange)return false;
  try{const s=getSelection();s.removeAllRanges();s.addRange(savedRange);return true}catch{return false}
}
const FORMATO_SEMANTICO=["bold","italic","underline","strikeThrough"];
const BLOCK_ALIGNMENTS={justifyLeft:"left",justifyCenter:"center",justifyRight:"right"};
function validBlockAlignment(value){
  return Object.values(BLOCK_ALIGNMENTS).includes(value)?value:undefined;
}
function alignBlocks(alignment){
  const selection=selecaoEntreBlocos();
  const rows=selection?partesDaSelecao(selection).map(({row})=>row):[currentRow()];
  const contents=rows.filter(Boolean).map(row=>$(".block-content[contenteditable=true]",row)).filter(Boolean);
  if(!contents.length)return;
  histPush(true);
  for(const content of contents){
    content.style.textAlign=alignment;
    /* Remove o alinhamento interno gerado pelo editor antigo. */
    $$("div[style], p[style], div[align], p[align]",content).forEach(el=>{
      if(el.closest("table"))return;
      el.style.removeProperty("text-align");
      if(!el.style.length)el.removeAttribute("style");
      el.removeAttribute("align");
    });
  }
  touchNote();
}
function execFormat(action,value=null){
  const alignment=BLOCK_ALIGNMENTS[action];
  if(alignment){alignBlocks(alignment);return}
  if(selecaoEntreBlocos()){toast("A formatação é aplicada em um bloco por vez.");return}
  restoreSelection();
  /* tags de verdade (<b>,<i>,<u>,<strike>) para o Markdown conseguir exportar */
  document.execCommand("styleWithCSS",false,!FORMATO_SEMANTICO.includes(action));
  document.execCommand(action,false,value);
  saveSelection();touchNote();
}
async function createLinkFlow(){

}

const HL_SENTINEL="rgb(1,2,3)";
const hlProbe=document.createElement("span");
hlProbe.style.backgroundColor=HL_SENTINEL;
const HL_SENTINEL_RGB=hlProbe.style.backgroundColor;

function unwrap(el){el.replaceWith(...el.childNodes)}
function cleanupMarks(){
  $$("mark",blockEditor).forEach(m=>{
    if(!m.isConnected)return;
    if(!m.textContent&&!m.querySelector("img")){m.remove();return}
    if(m.parentElement?.closest("mark"))unwrap(m);
  });
}
function selectAcross(nodes){
  if(!nodes.length)return;
  const r=document.createRange();
  r.setStartBefore(nodes[0]);r.setEndAfter(nodes.at(-1));
  const s=getSelection();s.removeAllRanges();s.addRange(r);savedRange=r.cloneRange();
}
function marksInRange(range){
  return $$("mark",blockEditor).filter(m=>{try{return range.intersectsNode(m)}catch{return false}});
}
function setHighlightStyle(id){
  hlStyle=id;
  $$(".hl-style",highlightMenu).forEach(b=>b.classList.toggle("active",b.dataset.hlStyle===id));

function applyHighlight(estilo=hlStyle){
  restoreSelection();
  const sel=getSelection();
  if(!sel?.rangeCount||sel.isCollapsed){toast("Selecione um trecho para marcar");return}
  document.execCommand("styleWithCSS",false,true);
  document.execCommand("hiliteColor",false,HL_SENTINEL);
  const tagged=$$("*",blockEditor).filter(el=>el.style?.backgroundColor===HL_SENTINEL_RGB);
  if(!tagged.length){toast("Não foi possível marcar aqui");return}
  /* tira marcacoes antigas que cruzam a selecao, para nao empilhar cores.
     A propria marca alvo fica de fora: ela e reaproveitada logo abaixo. */
  $$("mark",blockEditor).forEach(m=>{
    if(tagged.includes(m))return;
    if(tagged.some(el=>el.contains(m)||m.contains(el)))unwrap(m);
  });
  const created=tagged.map(el=>{
    el.style.backgroundColor="";
    if(!el.getAttribute("style"))el.removeAttribute("style");
    /* selecao que cobre exatamente uma marca: o navegador estiliza a propria
       <mark>, entao so trocamos o estilo em vez de recriar o elemento */
    if(el.tagName==="MARK"){el.dataset.hlStyle=estilo;return el}
    const m=document.createElement("mark");
    m.dataset.hlStyle=estilo;
    while(el.firstChild)m.appendChild(el.firstChild);
    if(el.tagName==="SPAN"&&!el.getAttribute("style")&&!el.className)el.replaceWith(m);
    else el.appendChild(m);
    return m;
  });
  cleanupMarks();
  selectAcross(created.filter(m=>m.isConnected));
  touchNote();
}
function clearHighlight(){
  restoreSelection();
  const sel=getSelection();if(!sel?.rangeCount)return;
  const hit=marksInRange(sel.getRangeAt(0));
  if(!hit.length){toast("Nenhuma marcação na seleção");return}
  hit.forEach(m=>unwrap(m));
  saveSelection();touchNote();
}
function toggleHighlight(){
  restoreSelection();
  const sel=getSelection();
  if(!sel?.rangeCount||sel.isCollapsed){toast("Selecione um trecho para marcar");return}
  const n=sel.getRangeAt(0).commonAncestorContainer;
  const el=n.nodeType===1?n:n.parentElement;
  const inside=el?.closest?.("mark");
  const mesmoEstilo=(inside?.dataset.hlStyle||"regular")===hlStyle;
  if(inside&&blockEditor.contains(inside)&&mesmoEstilo){unwrap(inside);saveSelection();touchNote();return}
  applyHighlight(hlStyle);
}

function tableToMarkdown(table){
  const rows=Array.from(table.rows,row=>Array.from(row.cells,cell=>
    inlineToMarkdown(cell.innerHTML).trim().replace(/\|/g,"\\|").replace(/\r?\n/g,"<br>")));
  if(!rows.length)return"";
  const cols=Math.max(...rows.map(r=>r.length));
  const nr=rows.map(r=>[...r,...Array(Math.max(0,cols-r.length)).fill("")]);
  const head=nr[0],body=nr.slice(1);
  return [`| ${head.join(" | ")} |`,`| ${head.map(()=> "---").join(" | ")} |`,...body.map(r=>`| ${r.join(" | ")} |`)].join("\n");
}
function inlineToMarkdown(html=""){
  const root=document.createElement("div");root.innerHTML=html;
  const walk=node=>{
    if(node.nodeType===Node.TEXT_NODE)return node.nodeValue||"";
    if(node.nodeType!==Node.ELEMENT_NODE)return"";
    const tag=node.tagName.toLowerCase();
    const child=Array.from(node.childNodes).map(walk).join("");
    if(tag==="strong"||tag==="b")return`**${child}**`;
    if(tag==="em"||tag==="i")return`*${child}*`;
    if(tag==="s"||tag==="strike"||tag==="del")return`~~${child}~~`;
    if(tag==="mark"){
      const est=node.dataset.hlStyle||"regular";
      return est==="regular"?`==${child}==`:`<mark class="hls-${est}">${child}</mark>`;
    }
    if(tag==="u")return`<u>${child}</u>`;
    if(tag==="code")return`\`${child}\``;
    if(tag==="a")return`[${child}](${node.getAttribute("href")||""})`;
    if(node.classList&&node.classList.contains("video-card")){
      const w=parseInt(node.style.width,10);
      return`<iframe src="${node.dataset.embed||""}"${Number.isFinite(w)?` width="${w}"`:""}></iframe>`;
    }
    if(tag==="img"||tag==="video"||tag==="iframe"){
      const src=node.getAttribute("src")||"";
      const w=parseInt(node.style.width,10);
      const larg=Number.isFinite(w)?` width="${w}"`:"";
      if(tag==="img"){
        const alt=node.getAttribute("alt")||"imagem";
        /* sem largura customizada fica no Markdown limpo */
        return larg?`<img src="${src}" alt="${alt}"${larg}>`:`![${alt}](${src})`;
      }
      if(tag==="video")return`<video src="${src}"${larg} controls></video>`;
      return`<iframe src="${src}"${larg}></iframe>`;
    }
    if(tag==="br")return"\n";
    if(tag==="span"||tag==="font"){
      /* compatibilidade com o formato antigo, que marcava estilo no proprio span */
      const st=node.style||{};
      const peso=parseInt(st.fontWeight,10);
      const deco=`${st.textDecorationLine||""} ${st.textDecoration||""}`;
      let r=child;
      if(!r.trim())return r;
      if(st.fontWeight==="bold"||peso>=600)r=`**${r}**`;
      if(st.fontStyle==="italic")r=`*${r}*`;
      if(/line-through/.test(deco))r=`~~${r}~~`;
      else if(/underline/.test(deco))r=`<u>${r}</u>`;
      return r;
    }
    if(tag==="table")return tableToMarkdown(node);
    return child;
  };
  return Array.from(root.childNodes).map(walk).join("").trimEnd();
}
const isListType=t=>["bullet","numbered","todo"].includes(t);
/* o conteudo de um bloco de codigo precisa manter as quebras de linha */
function codeToPlain(html=""){
  const d=document.createElement("div");
  d.innerHTML=String(html).replace(/<br\s*\/?>/gi,"\n").replace(/<\/(div|p)>/gi,"\n").replace(/<(div|p)[^>]*>/gi,"");
  return (d.textContent||"").replace(/\n$/,"");
}
function noteToMarkdown(note){
  const blocks=note.blocks||[];
  const out=[`# ${note.title||"Sem título"}`,""];
  const sanfonas=[];   /* indentacoes de toggles abertos, para fechar o <details> */
  const fecharAte=ind=>{
    while(sanfonas.length&&ind<=sanfonas[sanfonas.length-1]){sanfonas.pop();out.push("</details>","")}
  };
  blocks.forEach((b,i)=>{
    const md=inlineToMarkdown(b.html||"");
    const nivel=Math.max(0,Math.min(6,Number(b.indent)||0));
    fecharAte(nivel);
    if(b.type==="toggle"){
      out.push(`<details><summary>${md}</summary>`);
      sanfonas.push(nivel);
      return;
    }
    const pad="  ".repeat(nivel);
    /* itens de lista seguidos ficam colados: linha em branco quebraria o aninhamento */
    const gap=(isListType(b.type)&&isListType(blocks[i+1]?.type))?[]:[""];
    if(b.type==="h1")out.push(`# ${md}`,"");
    else if(b.type==="h2")out.push(`## ${md}`,"");
    else if(b.type==="h3")out.push(`### ${md}`,"");
    else if(b.type==="bullet")out.push(`${pad}- ${md}`,...gap);
    else if(b.type==="numbered")out.push(`${pad}1. ${md}`,...gap);
    else if(b.type==="todo")out.push(`${pad}- [${b.checked?"x":" "}] ${md}`,...gap);
    else if(b.type==="quote")out.push(`> ${md}`,"");
    else if(b.type==="callout")out.push(`> ${b.icon||"💡"} ${md}`,"");
    else if(b.type==="code")out.push("```",codeToPlain(b.html||""),"```","");
    else if(b.type==="divider")out.push("---","");
    else if(b.type==="media")out.push(md,"");
    else if(b.type==="table"){
      const d=document.createElement("div");d.innerHTML=b.html||"";
      out.push(d.querySelector("table")?tableToMarkdown(d.querySelector("table")):md,"");
    }else out.push(md,"");
  });
  fecharAte(-1);
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}
function download(name,text,type="text/plain"){
  const blob=new Blob([text],{type}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

}
/* HTML autossuficiente: estilo embutido, abre em qualquer navegador */
/* O card de video vira link com capa: iframe do YouTube nao toca em arquivo
   local (erro 153), e o link funciona onde quer que a pagina seja aberta. */
function htmlParaExport(html=""){
  const d=document.createElement("div");
  d.innerHTML=html;
  d.querySelectorAll(".video-card").forEach(card=>{
    const a=document.createElement("a");
    a.href=card.dataset.watch||card.dataset.embed||"#";
    a.target="_blank";a.rel="noopener";a.className="video-link";
    if(card.style.width)a.style.width=card.style.width;
    const cap=card.querySelector("img");
    if(cap){const im=document.createElement("img");im.src=cap.src;im.alt="Capa do video";a.appendChild(im)}
    const rot=document.createElement("span");
    rot.textContent=`▶ Assistir no ${card.dataset.label||"site"}`;
    a.appendChild(rot);
    card.replaceWith(a);
  });
  return d.innerHTML;
}
/* As tags de fechamento deste documento vao escapadas: <\/body> em vez da forma
   crua. Servidor com live-reload (Live Server, browser-sync) injeta o proprio
   script antes da primeira tag de fechamento de body do arquivo; sem o escape
   ele cai aqui dentro, fecha o script do app no meio da string e nada roda.
   Pelo mesmo motivo este comentario nao escreve nenhuma delas por extenso. */
function noteToHTML(note){
  const corpo=(note.blocks||[]).map(b=>{
    const h=htmlParaExport(b.html||"");
    const indent=Math.max(0,Math.min(6,Number(b.indent)||0));
    const align=validBlockAlignment(b.align);
    const style=[indent?`margin-left:${indent*26}px`:"",align?`text-align:${align}`:""].filter(Boolean).join(";");
    const cls=style?` style="${style}"`:"";
    switch(b.type){
      case "h1":return `<h1${cls}>${h}</h1>`;
      case "h2":return `<h2${cls}>${h}</h2>`;
      case "h3":return `<h3${cls}>${h}</h3>`;
      case "quote":return `<blockquote${cls}>${h}</blockquote>`;
      case "code":return `<pre${cls}><code>${esc(codeToPlain(h))}</code></pre>`;
      case "bullet":return `<ul${cls}><li>${h}</li></ul>`;
      case "numbered":return `<ol${cls}><li>${h}</li></ol>`;
      case "todo":return `<p${cls}><input type="checkbox" disabled ${b.checked?"checked":""}> ${h}</p>`;
      case "divider":return "<hr>";
      case "table":case "media":return `<div${cls}>${h}</div>`;
      default:return h.trim()?`<p${cls}>${h}</p>`:"";
    }
  }).filter(Boolean).join("\n");

  return `<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(note.title||"Sem título")}</title>
<style>
  :root{color-scheme:light dark}
  body{max-width:820px;margin:40px auto;padding:0 20px;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#1d1d1f;background:#fff}
  @media (prefers-color-scheme:dark){body{color:#f5f5f7;background:#111113}}
  h1,h2,h3{line-height:1.25;letter-spacing:-.02em}
  img,video,iframe{max-width:100%;border-radius:9px;display:block;margin:10px 0;border:0}
  iframe{width:100%;aspect-ratio:16/9;height:auto}
  pre{background:#f5f5f7;padding:12px 14px;border-radius:9px;overflow:auto}
  @media (prefers-color-scheme:dark){pre{background:#1d1d20}}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
  blockquote{margin:6px 0;padding-left:14px;border-left:3px solid rgba(128,128,128,.4);font-style:italic}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid rgba(128,128,128,.35);padding:8px 9px;text-align:left}
  .video-link{position:relative;display:block;max-width:100%;border-radius:9px;overflow:hidden;
    background:#000;text-decoration:none;margin:10px 0}
  .video-link img{display:block;width:100%;margin:0;border-radius:0}
  .video-link span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:13px}
  .video-link:hover span{background:#ff0000}
  mark{border-radius:3px;padding:.08em .18em;background:${acentoRGBA(.45)};color:inherit}
  hr{border:0;border-top:1px solid rgba(128,128,128,.3);margin:18px 0}
<\/style><\/head>
<body>
<h1>${esc(note.title||"Sem título")}</h1>
${corpo}
<\/body><\/html>`;
}

function uniqueArchiveName(title,extension,used){
  let base=Array.from(sanitizeName(title).normalize("NFC")).slice(0,60).join("")
    .replace(/[\u0000-\u001f]/g,"-").replace(/[.\s]+$/u,"")||"Sem título";
  if(/^(?:CON|PRN|AUX|NUL|COM[1-9¹²³]|LPT[1-9¹²³])(?:\.|$)/i.test(base))base="_"+base;
  let name=base+extension;
  for(let number=2;used.has(name.toLowerCase());number++)name=`${base} (${number})${extension}`;
  used.add(name.toLowerCase());
  return name;
}

/* ZIP sem compressão, com nomes UTF-8 e diretórios explícitos. */
function zipFolder(entries){
  if(entries.length>=0xffff)throw new RangeError("Muitas entradas");
  const encoder=new TextEncoder();
  const crcTable=new Uint32Array(256);
  for(let byte=0;byte<crcTable.length;byte++){
    let crc=byte;
    for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);
    crcTable[byte]=crc;
  }
  const files=[],directory=[];
  let offset=0,directorySize=0;
  for(const entry of entries){
    const name=encoder.encode(entry.path);
    const content=encoder.encode(entry.text||"");
    if(name.length>0xffff||offset+30+name.length+content.length>=0xffffffff)throw new RangeError("ZIP muito grande");
    let crc=0xffffffff;
    for(const byte of content)crc=(crc>>>8)^crcTable[(crc^byte)&0xff];
    crc=(crc^0xffffffff)>>>0;
    let date=new Date(entry.modifiedAt);
    const year=date.getFullYear();
    if(!Number.isFinite(year)||year<1980||year>2107)date=new Date();
    const dosDate=((date.getFullYear()-1980)<<9)|((date.getMonth()+1)<<5)|date.getDate();
    const dosTime=(date.getHours()<<11)|(date.getMinutes()<<5)|(date.getSeconds()>>1);
    const timestamp=(dosDate<<16)|dosTime;

    const localBytes=new Uint8Array(30+name.length);
    const local=new DataView(localBytes.buffer);
    local.setUint32(0,0x04034b50,true);
    local.setUint16(4,20,true);
    local.setUint16(6,0x0800,true);
    local.setUint32(10,timestamp,true);
    local.setUint32(14,crc,true);
    local.setUint32(18,content.length,true);
    local.setUint32(22,content.length,true);
    local.setUint16(26,name.length,true);
    localBytes.set(name,30);

    const centralBytes=new Uint8Array(46+name.length);
    const central=new DataView(centralBytes.buffer);
    central.setUint32(0,0x02014b50,true);
    central.setUint16(4,20,true);
    central.setUint16(6,20,true);
    central.setUint16(8,0x0800,true);
    central.setUint32(12,timestamp,true);
    central.setUint32(16,crc,true);
    central.setUint32(20,content.length,true);
    central.setUint32(24,content.length,true);
    central.setUint16(28,name.length,true);
    central.setUint32(38,entry.path.endsWith("/")?0x10:0x20,true);
    central.setUint32(42,offset,true);
    centralBytes.set(name,46);

    files.push(localBytes,content);
    directory.push(centralBytes);
    offset+=localBytes.length+content.length;
    directorySize+=centralBytes.length;
  }
  if(offset+directorySize+22>=0xffffffff)throw new RangeError("ZIP muito grande");
  const footerBytes=new Uint8Array(22);
  const footer=new DataView(footerBytes.buffer);
  footer.setUint32(0,0x06054b50,true);
  footer.setUint16(8,entries.length,true);
  footer.setUint16(10,entries.length,true);
  footer.setUint32(12,directorySize,true);
  footer.setUint32(16,offset,true);
  return new Blob([...files,...directory,footerBytes],{type:"application/zip"});
}

function exportFolder(id){
  const root=state.folders.find(folder=>folder.id===id);
  if(!root)return;
  saveState(true);
  const rootName=uniqueArchiveName(root.name,"",new Set());
  const entries=[];
  let count=0;
  function visit(folder,path){
    entries.push({path:path+"/",modifiedAt:folder.createdAt});
    const names=new Set();
    for(const child of childrenOf(folder.id)){
      visit(child,`${path}/${uniqueArchiveName(child.name,"",names)}`);
    }
    for(const note of state.notes.filter(note=>note.folderId===folder.id)){
      const name=uniqueArchiveName(note.title,".md",names);
      entries.push({path:`${path}/${name}`,text:noteToMarkdown(note),modifiedAt:note.updatedAt});
      count++;
    }
  }
  try{
    visit(root,rootName);
    download(rootName+".zip",zipFolder(entries),"application/zip");
    toast(`Pasta exportada · ${noteCount(count)}`);
  }catch(error){
    console.error(error);
    toast("Não foi possível exportar a pasta");
  }
}

async function readMarkdownBatch(files){
  const list=Array.from(files).filter(f=>/\.(md|markdown|txt)$/i.test(f.name));
  if(!list.length){toast("Nenhum Markdown encontrado");return []}
  try{
    return await Promise.all(list.map(async f=>({
      path:f.webkitRelativePath||f.name,
      ...markdownToNote(await f.text(),f.name.replace(/\.(md|markdown|txt)$/i,""))
    })));
  }catch{toast("Não foi possível ler os arquivos selecionados.");return []}
}

async function importMarkdownFiles(files,folderId=null){
  const destination=folderId||state.selectedFolderId;
  const list=await readMarkdownBatch(files);if(!list.length)return;
  const target=targetFolder(destination);
  for(const {title,blocks} of list)state.notes.push({id:uid(),folderId:target,title,createdAt:now(),updatedAt:now(),pinned:false,blocks});
  showImportedNotes(target);
  toast(`${noteCount(list.length)} ${list.length===1?"importada":"importadas"}`);
}
async function importFolder(files){
  const list=await readMarkdownBatch(files);if(!list.length)return;
  const cache=new Map();
  const rootName=list[0].path.includes("/")?list[0].path.split("/")[0]:"Projeto importado";
  const rootId=uid();state.folders.push({id:rootId,name:rootName,parentId:null,createdAt:now()});cache.set(rootName,rootId);
  const ensure=parts=>{
    let pid=rootId,path=rootName;
    for(const p of parts.slice(1)){path+="/"+p;if(!cache.has(path)){const id=uid();state.folders.push({id,name:p,parentId:pid,createdAt:now()});cache.set(path,id)}pid=cache.get(path)}
    return pid;
  };
  for(const {path,title,blocks} of list){
    const pid=ensure(path.split("/").slice(0,-1));
    state.notes.push({id:uid(),folderId:pid,title,createdAt:now(),updatedAt:now(),pinned:false,blocks});
  }
  state.openFolders.push(rootId);state.sidebarCollapsed=false;
  showImportedNotes(rootId);toast(`Pasta importada com ${noteCount(list.length)}`);
}

function parseProject(data){
  if(!Array.isArray(data?.notes)||!Array.isArray(data.folders))throw new Error("Estrutura inválida");
  const folders=new Map();
  for(const folder of data.folders){
    if(typeof folder?.id!=="string"||!folder.id||folder.id==="all"||folders.has(folder.id)||typeof folder.name!=="string")throw new Error("Pasta inválida");
    folder.parentId ||= null;
    folders.set(folder.id,folder);
  }
  for(const folder of folders.values()){
    const ancestors=new Set([folder.id]);
    let parentId=folder.parentId;
    while(parentId!==null){
      if(ancestors.has(parentId)||!folders.has(parentId))throw new Error("Hierarquia inválida");
      ancestors.add(parentId);parentId=folders.get(parentId).parentId;
    }
  }
  const noteIds=new Set();
  for(const note of data.notes){
    if(!note||typeof note!=="object")throw new Error("Nota inválida");
    if(typeof note.content==="string"&&!Array.isArray(note.blocks)){
      Object.assign(note,markdownToNote(note.content,"Nova nota"));
      note.id ||= uid();
      delete note.content;
    }
    if(typeof note.id!=="string"||!note.id||noteIds.has(note.id)||typeof note.title!=="string"||!Array.isArray(note.blocks))throw new Error("Nota inválida");
    if(!folders.has(note.folderId)){
      if(!folders.size){
        const folder={id:uid(),name:"Notas",parentId:null,createdAt:now()};
        data.folders.push(folder);folders.set(folder.id,folder);
      }
      note.folderId=folders.keys().next().value;
    }
    noteIds.add(note.id);
    note.createdAt=typeof note.createdAt==="string"?note.createdAt:now();
    note.updatedAt=typeof note.updatedAt==="string"?note.updatedAt:note.createdAt;
    for(const block of note.blocks){
      if(typeof block?.type!=="string"||(block.html!=null&&typeof block.html!=="string"))throw new Error("Bloco inválido");
      block.id=typeof block.id==="string"&&block.id?block.id:uid();
      if(typeof block.icon!=="string")delete block.icon;
    }
  }
  data.sidebarCollapsed=data.sidebarCollapsed===true;
  data.openFolders=Array.isArray(data.openFolders)?data.openFolders.filter(id=>folders.has(id)):[];
  if(!["updated","created","title"].includes(data.sort))data.sort="updated";
  if(!folders.has(data.selectedFolderId))data.selectedFolderId="all";
  return data;
}

async function importProject(file){
  let replacement;
  try{
    const parsed=JSON.parse(await file.text());
    replacement=parseProject(parsed?.data||parsed);
  }catch{toast("Arquivo de projeto inválido");return}
  const ok=await confirmDialog("Substituir projeto atual?","A importação vai substituir as notas e pastas atuais.","Importar");
  if(!ok)return;
  clearTimeout(saveTimer);previewDirty=false;domNoteId=null;
  state=replacement;searchInput.value="";
  const visible=visibleNotes();
  if(!visible.some(n=>n.id===state.selectedNoteId))state.selectedNoteId=visible[0]?.id??null;
  setFocus(false);setDrawer(false);setMobileEditor(false);
  renderAll();histReset();saveState(true);toast("Projeto importado");
}

function positionMenu(menu,x,y,right=false,above=false){
  menu.classList.add("show");
  const r=menu.getBoundingClientRect();
  let left=right?x-r.width:x,top=above?y-r.height:y;
  left=Math.max(8,Math.min(innerWidth-r.width-8,left));
  top=Math.max(8,Math.min(innerHeight-r.height-8,top));
  menu.style.left=`${left}px`;menu.style.top=`${top}px`;
}
function positionAnchoredMenu(menu,anchor,gap,alignRight=true){
  const r=anchor.getBoundingClientRect();
  const above=!!anchor.closest(".immersive .quick-actions");
  positionMenu(menu,alignRight?r.right:r.left,above?r.top-gap:r.bottom+gap,alignRight,above);
}
function toggleMenu(event,name,alignRight=true){
  event.stopPropagation();
  const menu=popovers[name];
  const anchor=event.currentTarget;
  if(menu.classList.contains("show")){hideMenus();return}
  hideMenus(name);
  popoverAnchor=anchor;
  if(anchor.getAttribute("aria-controls")===menu.id)anchor.setAttribute("aria-expanded","true");
  positionAnchoredMenu(menu,anchor,7,alignRight);
  if(event.detail===0)$("button",menu)?.focus();
}

function temaAtual(){
  const t=storageGet(THEME_KEY);
  return TEMAS[t]?t:"dark";
}
/* O marca-texto e o acento do tema. A cor solida sai daqui porque dois lugares
   precisam dela em CSS cru: o traco do estilo sketch (cor embutida no SVG) e a
   pagina .html exportada, que nao carrega os tokens do app. */
function acentoRGBA(alfa){
  const bruto=(getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"").replace("#","");
  const hex=bruto.length===3?bruto.split("").map(c=>c+c).join(""):bruto;
  const [r,g,b]=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));
  return [r,g,b].every(Number.isFinite)?`rgba(${r},${g},${b},${alfa})`:`rgba(255,204,0,${alfa})`;
}
function tracoSketch(cor){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44" preserveAspectRatio="none"><path d="M7 11c24-7 68-8 106-4 6 1 8 6 6 14-2 9-7 15-14 16-31 4-71 4-95 1-6-1-9-6-8-14 1-7 3-11 5-13z" fill="none" stroke="${cor}" stroke-width="3.2" stroke-linecap="round" stroke-opacity=".9"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function applyTheme(id){
  const alvo=TEMAS[id]?id:"dark";
  document.documentElement.dataset.theme=alvo;
  document.documentElement.style.setProperty("--hl-sk",tracoSketch(acentoRGBA(1)));
  storageSet(THEME_KEY,alvo);
  if(!TEMAS[alvo].claro)storageSet(LAST_DARK_KEY,alvo);
  $$(".theme-card",themeGrid).forEach(c=>c.classList.toggle("active",c.dataset.tema===alvo));
}
let themeSwitch=null;
function changeTheme(id,anchor){
  const current=temaAtual();
  if(id===(themeSwitch?.id??current))return;

  const root=document.documentElement;
  themeSwitch?.view.skipTransition();
  themeSwitch=null;
  delete root.dataset.themeTransition;
  if(id===current)return;
  if(!document.startViewTransition||matchMedia("(prefers-reduced-motion: reduce)").matches){
    applyTheme(id);
    return;
  }

  const {left,top,width,height}=anchor.getBoundingClientRect();
  const x=left+width/2,y=top+height/2;
  const radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  root.style.setProperty("--theme-origin",`${x}px ${y}px`);
  root.style.setProperty("--theme-radius",`${radius}px`);
  root.dataset.themeTransition=!TEMAS[current].claro&&TEMAS[id].claro?"contract":"expand";

  const change={id,view:document.startViewTransition(()=>{
    if(themeSwitch===change)applyTheme(id);
  })};
  themeSwitch=change;
  change.view.ready.catch(()=>{}); // A nova seleção pode interromper este efeito.
  function finish(){
    if(themeSwitch!==change)return;
    themeSwitch=null;
    delete root.dataset.themeTransition;
  }
  change.view.finished.then(finish,finish);
}

  const atual=themeSwitch?.id??temaAtual();

}

blockEditor.addEventListener("keydown",e=>{
  const c=e.target.closest(".block-content"),row=e.target.closest(".block-row");if(!c||!row)return;
  if(e.isComposing)return;
  if((e.key==="Delete"||e.key==="Backspace")&&apagarSelecaoTexto()){
    e.preventDefault();return;
  }
  const inTable=row.dataset.type==="table";
  const cell=inTable?selectedTableCell():null;
  if(cell&&handleTableKey(e,cell))return;

  if(slash.open){
    if(e.key==="ArrowDown"){e.preventDefault();slash.index=Math.min(slash.items.length-1,slash.index+1);markSlashSelection();return}
    if(e.key==="ArrowUp"){e.preventDefault();slash.index=Math.max(0,slash.index-1);markSlashSelection();return}
    if(e.key==="Home"){e.preventDefault();slash.index=0;markSlashSelection();return}
    if(e.key==="End"){e.preventDefault();slash.index=slash.items.length-1;markSlashSelection();return}
    if(e.key==="Enter"&&!e.shiftKey){
      const cmd=slash.items[slash.index];
      if(cmd){e.preventDefault();runSlash(cmd);return}
      closeSlash();
    }
    if(e.key==="Escape"){e.preventDefault();closeSlash();return}
  }

  if(e.key==="Tab"&&!["table","divider"].includes(row.dataset.type)){
    e.preventDefault();
    if(row.dataset.type==="code"){document.execCommand("insertText",false,"  ");touchNote();return}
    setIndent(row,e.shiftKey?-1:1);return;
  }
  if(!inTable&&(e.key==="ArrowUp"||e.key==="ArrowDown")&&!e.shiftKey&&!e.altKey&&!e.metaKey&&!e.ctrlKey){
    if(moverEntreBlocos(row,c,e.key==="ArrowUp"?-1:1)){e.preventDefault();return}
  }
  if(e.key==="Enter"&&!e.shiftKey&&row.dataset.type!=="table"){
    e.preventDefault();
    const target=apagarSelecaoEntreBlocos()||row;
    handleEditorEnter(target,$(".block-content",target));
    return;
  }
  if(!inTable&&e.key==="Backspace"&&!(c.textContent||"").length){
    const prev=row.previousElementSibling;
    if((Number(row.dataset.indent)||0)>0){e.preventDefault();setIndent(row,-1);return}
    if(row.dataset.type!=="p"){e.preventDefault();setBlockType(row,"p",true);return}
    if(prev){e.preventDefault();histPush(true);row.remove();renumberLists();applyToggles();focusBlock(prev,true);touchNote();return}
  }
  if((e.key==="Delete"||e.key==="Backspace")&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey){
    if(juntarBlocosNoLimite(row,c,e.key==="Delete")){e.preventDefault();return}
  }
  const mod=e.metaKey||e.ctrlKey;
  /* como no Notion: o primeiro Ctrl+A pega o texto do bloco, o segundo pega todos */
  if(mod&&e.key.toLowerCase()==="a"&&!e.shiftKey&&selecaoCobreBloco(c)){
    e.preventDefault();
    const linhas=linhasDoEditor();
    if(linhas.length){selecionarBlocos(linhas[0],linhas[linhas.length-1]);ancoraSel=linhas[0]}
    return;
  }
  if(mod&&e.key.toLowerCase()==="z"){e.preventDefault();histApply(e.shiftKey?1:-1);return}
  if(mod&&e.key.toLowerCase()==="y"){e.preventDefault();histApply(1);return}
  if(mod&&e.key.toLowerCase()==="b"){e.preventDefault();execFormat("bold")}
  if(mod&&e.key.toLowerCase()==="e"){e.preventDefault();toggleInlineCode()}
  if(e.metaKey&&!e.ctrlKey&&e.key.toLowerCase()==="i"){e.preventDefault();execFormat("italic")}
  if(mod&&e.key.toLowerCase()==="u"){e.preventDefault();execFormat("underline")}
  if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();createLinkFlow()}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="h"){e.preventDefault();toggleHighlight()}
});

  if(!e.clipboardData)return;
  const row=apagarSelecaoEntreBlocos()||e.target.closest?.(".block-row");
  const c=row&&$(".block-content",row);
  if(!c||c.contentEditable==="false")return;
  const plain=e.clipboardData.getData("text/plain")||"";
  const html=e.clipboardData.getData("text/html")||"";
  e.preventDefault();
  if(row.dataset.type==="table"){
    apagarSelecaoTexto();
    if(selectedTableCell())document.execCommand("insertText",false,plain);
    touchNote();return;
  }
  if(row.dataset.type==="code"){document.execCommand("insertText",false,plain);touchNote();return}
  /* varias linhas: interpreta como Markdown e vira blocos de verdade */
  if(/\n/.test(plain.trim())){
    histPush(true);
    const parsed=markdownToNote(plain,"");
    const blocos=parsed.blocks.filter(b=>b.type!=="p"||htmlToPlain(b.html).trim());
    if(!blocos.length)return;
    const vazio=!(c.textContent||"").trim();
    let ref=row;
    blocos.forEach((b,i)=>{
      if(i===0&&vazio){
        row.dataset.type=b.type;row.dataset.indent=b.indent||0;
        row.style.setProperty("--indent",b.indent||0);
        c.innerHTML=b.html||"";
        c.dataset.placeholder=placeholder(b.type);
        if(b.type==="todo")$(".todo-box",row).checked=!!b.checked;
        row.classList.toggle("checked",!!b.checked);
        ref=row;return;
      }
      ref.insertAdjacentHTML("afterend",blockHTML(b));
      ref=ref.nextElementSibling;
    });
    renumberLists();touchNote();
    requestAnimationFrame(()=>focusBlock(ref,true));
    return;
  }
  const limpo=html?cleanPastedHTML(html):esc(plain);
  document.execCommand("insertHTML",false,limpo||esc(plain));
  touchNote();
});

/* O arrasto estende a seleção nativa além do campo de origem.
   As alças continuam selecionando blocos inteiros. */
let arrastoSel=null,ancoraSel=null,editorPointerType="mouse";
const linhasDoEditor=()=>$$(".block-row",blockEditor);
const blocosSelecionados=()=>$$(".block-row.block-selected",blockEditor);

function conteudoDoNo(node){
  const element=node?.nodeType===Node.ELEMENT_NODE?node:node?.parentElement;
  const content=element?.closest(".block-content");
  return content&&blockEditor.contains(content)?content:null;
}

function selecaoEntreBlocos(range=null){
  const selection=getSelection();
  range ||= selection?.rangeCount?selection.getRangeAt(0):null;
  if(!range||range.collapsed)return null;
  const inicio=conteudoDoNo(range.startContainer),fim=conteudoDoNo(range.endContainer);
  return inicio&&fim&&inicio!==fim?{range,inicio,fim}:null;
}

function intervaloDoBloco(content){
  const range=document.createRange();range.selectNodeContents(content);return range;
}

function partesDaSelecao({range,inicio,fim}){
  const parts=[];
  const last=fim.closest(".block-row");
  for(let row=inicio.closest(".block-row");row;row=row.nextElementSibling){
    const content=$(".block-content",row);
    if(!row.classList.contains("oculto")&&content){
      const part=intervaloDoBloco(content);
      if(content===inicio)part.setStart(range.startContainer,range.startOffset);
      if(content===fim)part.setEnd(range.endContainer,range.endOffset);
      parts.push({row,part});
    }
    if(row===last)break;
  }
  return parts;
}

function pintarSelecaoEntreBlocos(){
  const selection=selecaoEntreBlocos();
  const parts=selection?partesDaSelecao(selection):[];
  blockEditor.classList.toggle("text-selection",!!selection);
  if(globalThis.CSS?.highlights&&typeof Highlight==="function"){
    if(selection)CSS.highlights.set("editor-selection",new Highlight(...parts.map(({part})=>part)));
    else CSS.highlights.delete("editor-selection");
    return;
  }
  const active=new Set(parts.map(({row})=>row));
  linhasDoEditor().forEach(row=>row.classList.toggle("text-selected",active.has(row)));
}

function restaurarCaret(content,range){
  content.focus({preventScroll:true});
  const selection=getSelection();selection.removeAllRanges();selection.addRange(range);
  savedRange=range.cloneRange();
}

const blocosAtomicos=new Set(["table","media","divider","toggle","code"]);
function blocosPodemJuntar(first,last){
  return !blocosAtomicos.has(first.dataset.type)&&!blocosAtomicos.has(last.dataset.type)
    &&!first.querySelector(MEDIA_SEL)&&!last.querySelector(MEDIA_SEL);
}

function deleteEditableRange(content,range){
  const table=content.closest('.block-row[data-type="table"]')&&$("table",content);
  if(!table){range.deleteContents();return range}
  /* Delete o texto das células selecionadas sem desmontar a estrutura da tabela. */
  const parts=Array.from(table.rows).flatMap(row=>Array.from(row.cells))
    .filter(cell=>range.intersectsNode(cell)).map(cell=>{
      const part=intervaloDoBloco(cell);
      if(cell.contains(range.startContainer))part.setStart(range.startContainer,range.startOffset);
      if(cell.contains(range.endContainer))part.setEnd(range.endContainer,range.endOffset);
      return part;
    });
  parts.forEach(part=>part.deleteContents());
  return parts[0]||range;
}

function apagarSelecaoEntreBlocos(){
  const selection=selecaoEntreBlocos();if(!selection)return null;
  const {range,inicio,fim}=selection;
  const primeiro=inicio.closest(".block-row"),ultimo=fim.closest(".block-row");
  const corteInicio=intervaloDoBloco(inicio),corteFim=intervaloDoBloco(fim);
  corteInicio.setStart(range.startContainer,range.startOffset);
  corteFim.setEnd(range.endContainer,range.endOffset);
  histPush(true);
  const caret=deleteEditableRange(inicio,corteInicio);
  deleteEditableRange(fim,corteFim);
  for(let row=primeiro.nextElementSibling;row&&row!==ultimo;){
    const next=row.nextElementSibling;row.remove();row=next;
  }
  if(blocosPodemJuntar(primeiro,ultimo)){
    inicio.append(...fim.childNodes);ultimo.remove();
  }
  caret.collapse(true);
  renumberLists();applyToggles();restaurarCaret(inicio,caret);touchNote();
  return primeiro;
}

function apagarSelecaoTexto(){
  const selection=getSelection();
  if(!selection?.rangeCount||selection.isCollapsed)return null;
  const cross=apagarSelecaoEntreBlocos();
  if(cross)return cross;
  const range=selection.getRangeAt(0);
  const content=conteudoDoNo(range.startContainer);
  if(!content?.isContentEditable||!content.contains(range.endContainer))return null;
  histPush(true);
  const caret=deleteEditableRange(content,range);
  caret.collapse(true);restaurarCaret(content,caret);
  touchNote();
  return content.closest(".block-row");
}

function juntarBlocosNoLimite(row,content,frente){
  const sel=getSelection();
  if(!sel?.rangeCount||!sel.isCollapsed||!content.contains(sel.anchorNode))return false;
  const vizinho=frente?row.nextElementSibling:row.previousElementSibling;
  if(!vizinho||vizinho.classList.contains("oculto")||!blocosPodemJuntar(row,vizinho))return false;
  const restante=intervaloDoBloco(content);
  if(frente)restante.setStart(sel.anchorNode,sel.anchorOffset);
  else restante.setEnd(sel.anchorNode,sel.anchorOffset);
  if(restante.toString()||restante.cloneContents().querySelector("br"))return false;
  const primeiro=frente?row:vizinho,ultimo=frente?vizinho:row;
  const destino=$(".block-content",primeiro);
  const caret=intervaloDoBloco(destino);caret.collapse(false);
  histPush(true);
  destino.append(...$(".block-content",ultimo).childNodes);ultimo.remove();
  renumberLists();applyToggles();restaurarCaret(destino,caret);touchNote();
  return true;
}

function limparSelecaoBlocos(){
  blocosSelecionados().forEach(r=>r.classList.remove("block-selected"));
  ancoraSel=null;
}
/* tira o cursor do texto: com bloco selecionado quem responde e o teclado global */
function soltarCursor(){
  const a=document.activeElement;
  if(a&&a.classList&&a.classList.contains("block-content"))a.blur();
  getSelection()?.removeAllRanges();
  hideBubble();
}
function selecionarBlocos(de,ate=de){
  const linhas=linhasDoEditor();
  const i=linhas.indexOf(de),j=linhas.indexOf(ate);
  if(i<0||j<0)return;
  soltarCursor();
  const ini=Math.min(i,j),fim=Math.max(i,j);
  linhas.forEach((r,k)=>r.classList.toggle("block-selected",k>=ini&&k<=fim));
}
/* o Ctrl+A do navegador ja pegou o bloco inteiro? entao a proxima vez sobe um nivel */
function selecaoCobreBloco(c){
  if(!(c.textContent||"").length)return true;
  const s=getSelection();
  if(!s||!s.rangeCount||s.isCollapsed)return false;
  return s.getRangeAt(0).toString().length>=(c.textContent||"").length;
}
function apagarBlocosSelecionados(){
  const alvos=blocosSelecionados();
  if(!alvos.length)return false;
  histPush(true);
  const vizinho=alvos[alvos.length-1].nextElementSibling||alvos[0].previousElementSibling;
  alvos.forEach(r=>r.remove());
  ancoraSel=null;
  let foco=vizinho;
  /* nota nunca fica sem bloco nenhum, senao nao ha onde voltar a escrever */
  if(!linhasDoEditor().length){
    blockEditor.insertAdjacentHTML("beforeend",blockHTML(blankBlock("p","")));
    foco=$(".block-row",blockEditor);
  }
  renumberLists();applyToggles();touchNote();
  toast(alvos.length===1?"Bloco excluído":`${alvos.length} blocos excluídos`);
  if(foco)requestAnimationFrame(()=>focusBlock(foco,true));
  return true;
}
/* linha sob o ponteiro, inclusive quando o mouse passa da primeira ou da ultima */
function linhaNoPonto(y){
  let melhor=null,dist=Infinity;
  for(const r of linhasDoEditor()){
    if(r.classList.contains("oculto")||r.dataset.type==="divider")continue;
    const b=r.getBoundingClientRect();
    if(y>=b.top&&y<=b.bottom)return r;
    const d=y<b.top?b.top-y:y-b.bottom;
    if(d<dist){dist=d;melhor=r}
  }
  return melhor;
}

function caretNoConteudo(content,x,y){
  const rect=content.getBoundingClientRect();
  const px=Math.min(Math.max(x,rect.left+1),rect.right-1);
  const range=y>=rect.top&&y<rect.bottom?pontoParaRange(px,y):null;
  if(range&&content.contains(range.startContainer))return range;
  const edge=intervaloDoBloco(content);
  edge.collapse(y<rect.top||(y<rect.bottom&&x<rect.left+rect.width/2));
  return edge;
}

function atualizarArrastoSelecao(e){
  if(!arrastoSel.ativo&&Math.hypot(e.clientX-arrastoSel.x,e.clientY-arrastoSel.y)<3)return;
  const row=linhaNoPonto(e.clientY);
  if(!row)return;
  arrastoSel.ativo=true;
  e.preventDefault();
  const anchor=arrastoSel.anchor;
  const end=caretNoConteudo($(".block-content",row),e.clientX,e.clientY);
  getSelection().setBaseAndExtent(anchor.startContainer,anchor.startOffset,end.startContainer,end.startOffset);
}

function copiarSelecaoEntreBlocos(e){
  const selection=selecaoEntreBlocos();
  if(!e.clipboardData||!selection)return;
  const parts=partesDaSelecao(selection);
  const html=document.createElement("div");
  for(const {part} of parts){
    const paragraph=document.createElement("div");
    paragraph.append(part.cloneContents());html.append(paragraph);
  }
  e.preventDefault();
  e.clipboardData.setData("text/plain",parts.map(({part})=>part.toString()).join("\n"));
  e.clipboardData.setData("text/html",html.innerHTML);
  if(e.type==="cut")apagarSelecaoEntreBlocos();
}

/* drag blocks */
function blockDropTarget(event){
  let row=event.target.closest(".block-row");
  if(!row){
    const visible=linhasDoEditor().filter(line=>!line.classList.contains("oculto"));
    row=visible.find(line=>event.clientY<line.getBoundingClientRect().bottom)||visible.at(-1);
  }
  if(!row||blockDrag.rows.includes(row))return null;
  const bounds=row.getBoundingClientRect();
  return {row,after:event.clientY>bounds.top+bounds.height/2};
}
function clearBlockDropMarker(){
  blockDrag?.marker?.classList.remove("drop-before","drop-after");
  if(blockDrag)blockDrag.marker=null;
}
function finishBlockDrag(){
  if(!blockDrag)return;
  clearBlockDropMarker();
  blockDrag.rows.forEach(row=>row.classList.remove("dragging"));
  blockDrag=null;
}
blockEditor.addEventListener("dragstart",e=>{
  /* com texto ja selecionado o navegador tenta arrastar o proprio texto: o alvo
     vem como no de texto (sem closest) e o gesto de selecionar varios blocos
     morria ali. So a alca arrasta; qualquer outro arrasto e cancelado. */
  const alvo=e.target.nodeType===1?e.target:e.target.parentElement;
  const h=alvo&&alvo.closest?alvo.closest(".block-handle"):null;
  if(!h){e.preventDefault();return}
  const row=h.closest(".block-row");
  if(!row.classList.contains("block-selected"))limparSelecaoBlocos();
  const rows=row.classList.contains("block-selected")?blocosSelecionados():[row];
  blockDrag={rows,marker:null};
  rows.forEach(line=>line.classList.add("dragging"));
  e.dataTransfer.setData("application/x-live-notes-blocks","move");
  e.dataTransfer.effectAllowed="move";
});
blockEditor.addEventListener("dragover",e=>{
  if(!blockDrag)return;
  clearBlockDropMarker();
  const target=blockDropTarget(e);
  if(!target)return;
  e.preventDefault();
  e.dataTransfer.dropEffect="move";
  target.row.classList.add(target.after?"drop-after":"drop-before");
  blockDrag.marker=target.row;
});
blockEditor.addEventListener("dragleave",e=>{
  if(!blockEditor.contains(e.relatedTarget))clearBlockDropMarker();
});
blockEditor.addEventListener("drop",e=>{
  if(!blockDrag)return;
  e.preventDefault();
  const target=blockDropTarget(e),moving=blockDrag.rows;
  finishBlockDrag();
  if(!target)return;
  const current=linhasDoEditor();
  const remaining=current.filter(row=>!moving.includes(row));
  const index=remaining.indexOf(target.row)+(target.after?1:0);
  const reordered=remaining.slice();
  reordered.splice(index,0,...moving);
  if(reordered.every((row,i)=>row===current[i]))return;
  histPush(true);
  const fragment=document.createDocumentFragment();
  fragment.append(...moving);
  blockEditor.insertBefore(fragment,remaining[index]??null);
  renumberLists();applyToggles();touchNote();
});
blockEditor.addEventListener("dragend",finishBlockDrag);

document.addEventListener("click",e=>{
  if(!e.target.closest(".popover"))hideMenus();
  if(!e.target.closest(".bubble-bar")&&!e.target.closest(".popover"))scheduleBubble();
  if(!e.target.closest(".slash-menu")&&!e.target.closest(".block-content"))closeSlash()
});
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(modalBackdrop.classList.contains("show")){
    if(e.key==="Escape")modalCancel.click();
    return;
  }
  if(settingsBackdrop.classList.contains("show")){
    if(e.key==="Escape")closeSettings();
    return;
  }
  if(e.key.toLowerCase()==="i"&&e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey&&!e.isComposing&&!e.defaultPrevented){
    e.preventDefault();
    if(!e.repeat)setImmersive(!app.classList.contains("immersive"));
    return;
  }
  const emCampo=/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"")
    ||!!document.activeElement?.classList?.contains("block-content");
  if(!e.defaultPrevented&&(e.key==="Backspace"||e.key==="Delete")&&!emCampo){
    const editorAtivo=document.activeElement===document.body||blockEditor.contains(document.activeElement);
    if(editorAtivo&&(apagarSelecaoTexto()||apagarBlocosSelecionados())){
      e.preventDefault();return;
    }
  }
  if(e.key==="Escape"){
    if(Object.values(popovers).some(menu=>menu.classList.contains("show"))){
      const anchor=popoverAnchor;hideMenus();anchor?.focus({preventScroll:true});return;
    }
    if(slash.open){closeSlash();return}
    if(bubbleBar.classList.contains("show")){hideBubble();return}
    if(!findBar.classList.contains("hidden")){findClose();return}
    if(blocosSelecionados().length){limparSelecaoBlocos();return}
    if(app.classList.contains("drawer-open")){setDrawer(false);$("#collapseBtn").focus();return}
    if(app.classList.contains("immersive")){setImmersive(false);return}
    if(focusMode)setFocus(false,true);
  }
  /* desfazer tambem fora do texto (ex.: logo apos redimensionar uma midia).
     Se o bloco ja tratou, e.defaultPrevented evita o desfazer duplo. */
  if(mod&&e.key.toLowerCase()==="z"&&!e.defaultPrevented&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"")){
    e.preventDefault();histApply(e.shiftKey?1:-1);return;
  }
  if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();saveState(true,true)}
  if(mod&&e.key.toLowerCase()==="n"){e.preventDefault();if(e.shiftKey)createFolder();else createNote();return}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="f"){
    e.preventDefault();setFocus(false);setMobileEditor(false);setDrawer(false);searchInput.focus();searchInput.select();return;
  }
  if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();findOpen();return}
  if(mod&&e.key.toLowerCase()==="d"){e.preventDefault();duplicateNote();return}
  if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();exportNotePDF();return}
  if(e.altKey&&e.key==="ArrowDown"){e.preventDefault();stepNote(1);return}
  if(e.altKey&&e.key==="ArrowUp"){e.preventDefault();stepNote(-1);return}
});
window.addEventListener("beforeunload",()=>saveState(true));
window.addEventListener("resize",()=>{closeSlash();hideMenus();hideBubble();hideResizer()});

/* tooltips */
let tipTimer=null;
document.addEventListener("pointerover",e=>{
  const el=e.target.closest("[data-tip]");if(!el)return;clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>{
    const r=el.getBoundingClientRect();tooltip.textContent=el.dataset.tip;
    tooltip.style.left=`${Math.max(8,Math.min(innerWidth-160,r.left+r.width/2-45))}px`;
    tooltip.style.top=`${Math.min(innerHeight-30,r.bottom+6)}px`;
    tooltip.classList.add("show")
  },380)
});
document.addEventListener("pointerout",e=>{if(e.target.closest("[data-tip]")){clearTimeout(tipTimer);tooltip.classList.remove("show")}});

/* bootstrap */
$$('button[data-tip],select[data-tip]').forEach(control=>{
  if(!control.hasAttribute("aria-label"))control.setAttribute("aria-label",control.dataset.tip);
});
if(!state.folders.some(f=>f.id===state.selectedFolderId))state.selectedFolderId="all";
const initialNotes=visibleNotes();
if(!initialNotes.some(n=>n.id===state.selectedNoteId))state.selectedNoteId=initialNotes[0]?.id??null;
applyTheme(temaAtual());
applyInset(insetAtual(),false);
applyPaper(storageGet(PAPER_KEY),false);
setHighlightStyle(hlStyle);
setFocus(state.focusMode!==false);
renderAll();
persistState();
})();
</script>
