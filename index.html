<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20x='5'%20y='7'%20width='22'%20height='21'%20rx='4.5'%20fill='%23FFCC00'/%3E%3Cpath%20d='M11%2015h10M11%2020h7'%20stroke='%231d1d1f'%20stroke-width='2.4'%20stroke-linecap='round'/%3E%3Cpath%20d='M12%203.5v5M20%203.5v5'%20stroke='%236e6e73'%20stroke-width='2.6'%20stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f7;
  --sidebar:#eeeef1;
  --sidebar2:#e7e7ea;
  --notes:#fafafa;
  --editor:#fff;
  --toolbar:rgba(255,255,255,.94);
  --text:#1d1d1f;
  --text2:#6e6e73;
  --text3:#9a9aa0;
  --line:rgba(60,60,67,.12);
  --line2:rgba(60,60,67,.2);
  --hover:rgba(0,0,0,.045);
  --selected:rgba(255,214,10,.22);
  --accent:#ffcc00;
  --accentText:#9a7300;
  --danger:#ff453a;
  --code:#f5f5f7;
  /* marca-texto: uma cor so, derivada do acento do tema */
  --hl:color-mix(in srgb,var(--accent) 45%,transparent);
  --hl-sk:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20120%2044'%20preserveAspectRatio='none'%3E%3Cpath%20d='M7%2011c24-7%2068-8%20106-4%206%201%208%206%206%2014-2%209-7%2015-14%2016-31%204-71%204-95%201-6-1-9-6-8-14%201-7%203-11%205-13z'%20fill='none'%20stroke='%23e0b400'%20stroke-width='3.2'%20stroke-linecap='round'%20stroke-opacity='.9'/%3E%3C/svg%3E");
  --shadow:0 18px 55px rgba(0,0,0,.15);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --sidebar-w:244px;
  --sidebar-collapsed:58px;
  --notes-w:310px;
  --toolbar-h:54px;
  /* distancia da borda do editor ate a primeira letra (ajustavel nas configuracoes) */
  --text-inset:32px;
  --content-pad:6px;                                                   /* respiro interno do bloco */
  --handle-w:min(24px,max(0px,calc(var(--text-inset) - var(--content-pad))));  /* alcinha de arrastar */
  --doc-pad:max(0px,calc(var(--text-inset) - var(--handle-w) - var(--content-pad)));
  --ease:cubic-bezier(.22,.8,.22,1);
  --ease-panel:cubic-bezier(.32,.72,0,1);
  --dur-panel:.38s;
  --dur-fade:.18s;
}
/* --- temas escuros compartilham marca-texto, sombra e linhas --- */

  --shadow:0 22px 70px rgba(0,0,0,.42);
}

  --toolbar:rgba(251,241,199,.94);
  --text:#3c3836;--text2:#665c54;--text3:#928374;
  --line:rgba(60,56,54,.13);--line2:rgba(60,56,54,.22);--hover:rgba(60,56,54,.05);

html[data-theme="dark"]{
  --bg:#111113;
  --sidebar:#1c1c1e;
  --sidebar2:#252527;
  --notes:#18181a;
  --editor:#111113;
  --toolbar:rgba(17,17,19,.94);
  --text:#f5f5f7;
  --text2:#a1a1a6;
  --text3:#707076;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --hover:rgba(255,255,255,.06);
  --selected:rgba(255,214,10,.15);
  --accent:#ffd60a;
  --accentText:#ffd60a;
  --code:#1d1d20;
  --hl:color-mix(in srgb,var(--accent) 32%,transparent);
  --shadow:0 22px 70px rgba(0,0,0,.42);

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select{font:inherit}
button{color:inherit}
::selection{background:rgba(255,214,10,.32)}

.app{
  width:100vw;height:100vh;
  display:grid;
  grid-template-columns:var(--sidebar-w) var(--notes-w) minmax(0,1fr);
  transition:grid-template-columns var(--dur-panel) var(--ease-panel);
}
.app.sidebar-collapsed{
  grid-template-columns:var(--sidebar-collapsed) var(--notes-w) minmax(0,1fr);
}
.app.focus{
  grid-template-columns:0 0 minmax(0,1fr);
}
.app.focus .sidebar,.app.focus .notes-pane{border-right-color:transparent}
/* conteudo fixo na largura final: nada reflui durante a animacao */
.notes-head,.notes-list{min-width:var(--notes-w)}
/* voltando: o conteudo aparece depois que o painel ja abriu */
.sidebar-inner,.notes-head,.notes-list{
  transition:opacity var(--dur-fade) ease var(--dur-fade),
             transform var(--dur-panel) var(--ease-panel);
}
/* saindo: some junto com o painel, sem espera */
.app.focus .sidebar-inner,
.app.focus .notes-head,
.app.focus .notes-list{
  opacity:0;transform:translateX(-16px);
  transition:opacity var(--dur-fade) ease,
             transform var(--dur-panel) var(--ease-panel);
}
.sidebar,.notes-pane{transition:border-right-color var(--dur-fade) ease}

/* LEFT */
.sidebar{
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--sidebar);
  border-right:1px solid var(--line);
}
.sidebar-inner{
  width:var(--sidebar-w);
  height:100%;
  display:flex;
  flex-direction:column;
}
.sidebar-top{
  height:58px;
  display:flex;
  align-items:center;
  padding:8px 10px;
  gap:8px;
  flex:0 0 auto;
}
.icon-btn{
  width:34px;height:34px;
  border:0;border-radius:8px;
  display:grid;place-items:center;
  background:transparent;
  cursor:pointer;
  transition:background .14s ease,transform .14s ease;
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor}
.collapse-btn{width:38px;height:38px}

.nav-stack{padding:1px 8px 6px}
.nav-row{
  width:100%;
  min-height:38px;
  display:flex;align-items:center;gap:9px;
  padding:0 9px;
  border:0;border-radius:8px;
  background:transparent;
  cursor:pointer;text-align:left;
}
.nav-row:hover{background:var(--hover)}
.nav-row.active{background:var(--selected)}
.nav-icon{width:20px;height:20px;display:grid;place-items:center;flex:0 0 auto;color:var(--accentText)}
.nav-icon svg{width:17px;height:17px}
.nav-label{white-space:nowrap}
.nav-count{margin-left:auto;color:var(--text3);font-size:11px}
.nav-label,.nav-count,.folder-label,.folder-actions,.folder-tree{
  transition:opacity var(--dur-fade) ease var(--dur-fade);
}
.sidebar-collapsed .nav-label,.sidebar-collapsed .nav-count,
.sidebar-collapsed .folder-label,.sidebar-collapsed .folder-actions,
.sidebar-collapsed .folder-tree{
  transition:opacity var(--dur-fade) ease;
}
.sidebar-collapsed .nav-label,.sidebar-collapsed .nav-count{opacity:0;pointer-events:none}

.sidebar-divider{height:1px;background:var(--line);margin:4px 10px 8px}
.folder-head{
  height:34px;
  padding:0 10px 0 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.folder-label{
  font-size:11px;font-weight:650;color:var(--text2);
  text-transform:uppercase;letter-spacing:.05em;
}
.folder-actions{display:flex}
.folder-actions .icon-btn{width:28px;height:28px}
.folder-actions svg{width:15px;height:15px}
.sidebar-collapsed .folder-label,.sidebar-collapsed .folder-actions{opacity:0;pointer-events:none}

.folder-tree{
  flex:1;min-height:0;overflow:auto;
  padding:0 8px 14px;
}
.sidebar-collapsed .folder-tree{opacity:0;pointer-events:none}
.folder-row{
  height:36px;
  display:flex;align-items:center;gap:7px;
  padding-right:7px;
  border-radius:8px;
  cursor:pointer;
  user-select:none;
}
.folder-row:hover{background:var(--hover)}
.folder-row.active{background:var(--selected)}
.twisty{
  width:15px;height:15px;border:0;padding:0;background:transparent;
  color:var(--text3);display:grid;place-items:center;cursor:pointer;
}
.twisty svg{width:11px;height:11px;transition:transform .16s}
.folder-row.open .twisty svg{transform:rotate(90deg)}
.folder-icon{color:var(--accentText);display:grid;place-items:center}
.folder-icon svg{width:17px;height:17px;fill:currentColor;stroke:currentColor}
.folder-name{font-size:13px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-count{font-size:11px;color:var(--text3)}

.sidebar-bottom{
  min-height:52px;
  border-top:1px solid var(--line);
  display:flex;align-items:center;flex-wrap:wrap;
  width:var(--sidebar-w);
  padding:8px;
  gap:2px;
  overflow:hidden;
  transition:width var(--dur-panel) var(--ease-panel);
}
.sidebar-collapsed .sidebar-bottom{width:var(--sidebar-collapsed)}

/* NOTES */
.notes-pane{
  min-width:0;min-height:0;
  overflow:hidden;
  background:var(--notes);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.notes-head{
  padding:12px 13px 10px;
  border-bottom:1px solid var(--line);
}
.notes-title-row{
  display:flex;align-items:center;
  height:35px;gap:8px;
}
.notes-title{
  font-size:20px;font-weight:720;letter-spacing:-.04em;
  min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.new-note-btn{color:var(--accentText)}
.search-wrap{
  margin-top:8px;height:34px;border-radius:9px;
  background:var(--sidebar2);
  display:flex;align-items:center;gap:7px;
  padding:0 10px;color:var(--text3);
}
.search-wrap svg{width:15px;height:15px;flex:0 0 auto}
.search-wrap input{
  width:100%;border:0;outline:0;background:transparent;color:var(--text);
  font-size:12.5px;
}
.search-wrap input::placeholder{color:var(--text3)}
.notes-list{flex:1;min-height:0;overflow:auto;padding:7px}
.note-card{
  position:relative;
  min-height:72px;
  border-radius:9px;
  padding:10px 12px;
  cursor:pointer;
}
.note-card:hover{background:var(--hover)}
.note-card.active{background:var(--selected)}
.note-card + .note-card::before{
  content:"";position:absolute;left:12px;right:12px;top:-3.5px;height:1px;background:var(--line)
}
.note-card.active + .note-card::before,.note-card.active::before{opacity:0}
.note-card-title{
  font-size:13.5px;font-weight:650;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.note-meta{
  margin-top:5px;display:flex;gap:6px;
  color:var(--text2);font-size:11.5px;min-width:0;
}
.note-date{flex:0 0 auto;color:var(--text3)}
.note-preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-list{
  padding:48px 24px;text-align:center;color:var(--text3);
  font-size:12.5px;line-height:1.5;
}

/* WORKSPACE */
.workspace{
  min-width:0;min-height:0;
  display:flex;flex-direction:column;
  background:var(--editor);
  position:relative;
}
.formatbar{
  height:var(--toolbar-h);
  flex:0 0 var(--toolbar-h);
  display:flex;align-items:center;gap:2px;
  padding:7px 8px;
  border-bottom:1px solid var(--line);
  background:var(--toolbar);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  position:sticky;top:0;z-index:80;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
}
.formatbar::-webkit-scrollbar{display:none}
.tool-group{display:flex;align-items:center;gap:1px;flex:0 0 auto}
.tool-sep{width:1px;height:28px;background:var(--line);margin:0 2px;flex:0 0 auto}
.tool-btn{
  min-width:32px;height:34px;
  border:0;border-radius:7px;
  padding:0 7px;
  background:transparent;
  display:flex;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;flex:0 0 auto;
}
.tool-btn:hover{background:var(--hover)}
.tool-btn[disabled]{opacity:.3;pointer-events:none}
.tool-btn svg{width:18px;height:18px}
.tool-btn.bold{font-weight:800;font-size:17px}
.tool-btn.italic{font-family:Georgia,serif;font-size:18px;font-style:italic;font-weight:700}
.tool-btn.underline{text-decoration:underline;font-size:16px;font-weight:650}
.tool-btn.strike{text-decoration:line-through;font-size:16px;font-weight:650}
.tool-select{
  height:34px;border:0;outline:0;border-radius:7px;
  background:transparent;color:var(--text);
  padding:0 25px 0 9px;
  cursor:pointer;
}
.tool-select:hover{background-color:var(--hover)}
#blockStyle{width:98px}
.toolbar-spacer{flex:1 0 24px}
.tool-wide{gap:5px;padding:0 10px}
.tool-text{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.tool-caret{width:12px!important;height:12px!important;opacity:.6}
.save-state{
  /* largura fixa: sem isso a troca Salvo <-> Salvando empurra a barra a cada tecla */
  flex:0 0 auto;min-width:74px;text-align:right;
  font-size:10.5px;font-weight:650;letter-spacing:.04em;
  color:var(--text3);
  padding:0 9px;
  white-space:nowrap;
  transition:color .2s ease,opacity .2s ease;
}
.save-state[data-state="saving"]{opacity:.55}
.save-state[data-state="error"]{color:var(--danger)}
.format-menu{min-width:236px;padding:8px}
.format-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:34px;padding:0 4px;font-size:12.5px;
}
.format-row .tool-select{width:126px;background:var(--bg);border:1px solid var(--line)}
.format-row input[type=color]{
  width:44px;height:26px;padding:0;cursor:pointer;
  border:1px solid var(--line2);border-radius:7px;background:transparent;
}

.color-wrap{position:relative;width:34px;height:34px;flex:0 0 auto}
.color-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer}
.color-icon{font-size:17px;font-weight:750;position:relative}
.color-icon::after{
  content:"";position:absolute;left:-2px;right:-2px;bottom:-5px;height:3px;border-radius:2px;background:var(--accent)
}
.hl-btn{position:relative}
.hl-btn::after{
  content:"";position:absolute;left:7px;right:7px;bottom:5px;height:3px;border-radius:2px;background:var(--hl)
}
.hl-caret{min-width:17px;padding:0;color:var(--text3)}
.hl-caret svg{width:11px;height:11px}
.hl-menu{min-width:186px}
.hl-section{
  padding:2px 6px 5px;font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.05em;
}
.hl-styles{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 4px 4px}
.hl-style{
  display:flex;align-items:center;gap:7px;
  border:1px solid transparent;border-radius:8px;
  padding:5px 7px;background:transparent;cursor:pointer;text-align:left;
  font-size:11.5px;color:var(--text);
}
.hl-style:hover{background:var(--hover)}
.hl-style.active{border-color:var(--accentText)}
.hl-demo{
  flex:0 0 auto;font-size:11px;font-weight:650;line-height:1.1;
  color:var(--text);pointer-events:none;
}

.find-bar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;
  border-bottom:1px solid var(--line);
  background:var(--toolbar);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
}
.find-bar svg{width:15px;height:15px;flex:0 0 auto;color:var(--text3)}
.find-bar input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13px;
}
.find-bar input::placeholder{color:var(--text3)}
.find-count{
  flex:0 0 auto;font-size:11px;color:var(--text3);
  font-variant-numeric:tabular-nums;padding:0 4px;white-space:nowrap;
}
.find-bar .icon-btn{width:28px;height:28px}
.find-bar .icon-btn svg{width:14px;height:14px}
.editor-scroll{flex:1;min-height:0;overflow:auto}
.document{
  width:min(920px,calc(100% - 24px));
  margin:0;                 /* ancorado a esquerda, nao centralizado */
  padding:44px 0 150px;
}
.doc-head{padding:0 calc(var(--doc-pad) + var(--handle-w) + var(--content-pad)) 25px}
.doc-title{
  width:100%;border:0;outline:0;background:transparent;color:var(--text);
  font-size:clamp(30px,3vw,42px);
  line-height:1.13;font-weight:740;letter-spacing:-.045em;
  padding:0;
}
.doc-title::placeholder{color:color-mix(in srgb,var(--text3) 60%,transparent)}
.block-editor{padding:0 var(--doc-pad);min-height:420px}
.block-row{
  position:relative;
  display:grid;
  grid-template-columns:var(--handle-w) minmax(0,1fr);
  min-height:32px;
  border-radius:6px;
  margin-left:calc(var(--indent,0) * 26px);
  transition:margin-left .16s var(--ease);
}
.block-handle{
  width:calc(var(--handle-w) - 2px);height:30px;border:0;border-radius:6px;background:transparent;
  display:grid;place-items:center;color:var(--text3);
  opacity:0;cursor:grab;
  transition:opacity .14s,background .14s;
}
.block-row:hover .block-handle{opacity:1}
.block-handle:hover{background:var(--hover)}
.block-handle:active{cursor:grabbing}
.block-handle svg{width:15px;height:15px}
.block-main{min-width:0;position:relative}
.block-content{
  min-height:30px;
  outline:0;
  padding:2px var(--content-pad);
  border-radius:4px;
  font-size:16.5px;
  line-height:1.65;
  letter-spacing:-.008em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.block-content:empty::before{
  content:attr(data-placeholder);
  color:color-mix(in srgb,var(--text3) 58%,transparent);
  pointer-events:none;
}
.block-row[data-type="h1"] .block-content{
  font-size:31px;font-weight:730;letter-spacing:-.035em;line-height:1.24;
  padding-top:10px;padding-bottom:5px;
}
.block-row[data-type="h2"] .block-content{
  font-size:24px;font-weight:710;letter-spacing:-.026em;line-height:1.3;
  padding-top:8px;padding-bottom:4px;
}
.block-row[data-type="h3"] .block-content{
  font-size:19px;font-weight:690;letter-spacing:-.017em;line-height:1.38;
  padding-top:6px;padding-bottom:3px;
}
.block-row[data-type="quote"] .block-main{
  border-left:3px solid var(--line2);margin:4px 0;
}
.block-row[data-type="quote"] .block-content{
  padding-left:14px;font-style:italic;color:color-mix(in srgb,var(--text) 88%,var(--text2))
}
.block-row[data-type="code"] .block-content{
  font-family:var(--mono);font-size:13px;line-height:1.55;
  background:var(--code);border:1px solid var(--line);
  border-radius:9px;padding:12px 14px;margin:5px 0;tab-size:2;
}
.block-row[data-type="bullet"] .block-main,
.block-row[data-type="numbered"] .block-main,
.block-row[data-type="todo"] .block-main{
  display:grid;grid-template-columns:25px minmax(0,1fr);align-items:start;
}
.block-marker{
  display:none;color:var(--text);
  user-select:none;text-align:center;padding-top:7px;font-size:14px;
}
.block-row[data-type="bullet"] .block-marker,
.block-row[data-type="numbered"] .block-marker,
.block-row[data-type="todo"] .block-marker{display:block}
.block-row[data-type="bullet"] .block-marker::before{content:"•";font-size:18px}
.block-row[data-type="numbered"] .block-marker::before{content:attr(data-num) ".";font-size:13px}
.todo-box{
  display:none;width:16px;height:16px;margin:7px 0 0 4px;accent-color:var(--accentText)
}
.block-row[data-type="todo"] .todo-box{display:block}
.block-row[data-type="todo"] .block-marker::before{content:none}
.block-row[data-type="todo"].checked .block-content{text-decoration:line-through;color:var(--text2)}
/* destaque (callout) */
.block-row[data-type="callout"] .block-main{
  display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;
  background:var(--code);border:1px solid var(--line);
  border-radius:10px;padding:5px 10px 5px 3px;margin:5px 0;
}
.callout-icon::before{content:attr(data-icon)}
.callout-icon{
  display:none;width:28px;height:28px;margin-top:3px;
  border:0;border-radius:7px;background:transparent;
  font-size:16px;line-height:1;cursor:pointer;
}
.block-row[data-type="callout"] .callout-icon{display:block}
.callout-icon:hover{background:var(--hover)}

/* sanfona (toggle) */
.block-row[data-type="toggle"] .block-main{
  display:grid;grid-template-columns:22px minmax(0,1fr);align-items:start;
}
.toggle-arrow{
  display:none;width:20px;height:28px;margin-top:2px;padding:0;
  border:0;background:transparent;color:var(--text3);cursor:pointer;
}
.block-row[data-type="toggle"] .toggle-arrow{display:grid;place-items:center}
.toggle-arrow:hover{color:var(--text)}
.toggle-arrow svg{width:11px;height:11px;transition:transform .16s var(--ease)}
.block-row[data-type="toggle"]:not(.collapsed) .toggle-arrow svg{transform:rotate(90deg)}
.block-row[data-type="toggle"] .block-content{font-weight:600}
.block-row.oculto{display:none}

.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:2px}
.icon-grid button{
  width:32px;height:32px;border:0;border-radius:7px;background:transparent;
  font-size:16px;line-height:1;cursor:pointer;
}
.icon-grid button:hover{background:var(--hover)}

.block-row[data-type="divider"]{align-items:center;min-height:30px}
.block-row[data-type="divider"] .block-content{
  min-height:1px;height:1px;padding:0;margin:14px 10px;background:var(--line);pointer-events:none
}
.block-row[data-type="divider"] .block-content::before{content:none}
.block-row.dragging{opacity:.35}
.block-row.drop-before::before{
  content:"";position:absolute;left:var(--handle-w);right:0;top:-2px;height:2px;border-radius:2px;background:var(--accentText)
}
.block-content table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.block-content th,.block-content td{border:1px solid var(--line2);padding:8px 9px;min-width:90px;text-align:left}
.block-content th{background:var(--code);font-weight:650}
.block-content img{max-width:100%;border-radius:9px;display:block;margin:9px 0}
.block-content video,.block-content iframe.embed{
  display:block;width:100%;max-width:100%;
  border:0;border-radius:9px;margin:9px 0;background:#000;
}
.block-content iframe.embed{aspect-ratio:16/9;height:auto}
/* capa clicavel: o YouTube bloqueia embed com origem null (arquivo local),
   entao mostramos a miniatura e so trocamos pelo player quando da. */
.video-card{
  position:relative;display:block;
  width:100%;max-width:100%;aspect-ratio:16/9;
  margin:4px 0;border-radius:9px;overflow:hidden;
  background:#000;cursor:pointer;user-select:none;
}
.video-card img{
  width:100%;height:100%;object-fit:cover;
  display:block;margin:0;border-radius:0;
}
.video-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:44px;border-radius:12px;
  background:rgba(0,0,0,.72);display:grid;place-items:center;
  transition:background .16s ease,transform .16s ease;
}
.video-play::before{
  content:"";border-style:solid;border-width:9px 0 9px 15px;
  border-color:transparent transparent transparent #fff;margin-left:3px;
}
.video-card:hover .video-play{background:#ff0000;transform:translate(-50%,-50%) scale(1.06)}
.video-card::after{
  content:attr(data-label);
  position:absolute;right:8px;bottom:8px;
  padding:2px 7px;border-radius:5px;
  background:rgba(0,0,0,.66);color:#fff;
  font-size:10.5px;letter-spacing:.02em;
}
/* bloco de midia: sem recuo interno, a midia manda no espacamento */
.block-row[data-type="media"] .block-content{padding:2px 0;min-height:24px}
.block-row[data-type="media"] .block-content img,
.block-row[data-type="media"] .block-content video,
.block-row[data-type="media"] .block-content iframe.embed{margin:4px 0}
.block-content img,.block-content video,.block-content iframe.embed{
  -webkit-user-drag:none;user-select:none;
}

/* selecao de blocos: cada bloco e um contenteditable proprio, entao a marcacao
   de varios blocos e feita na mao (ver "selecao de blocos" no JS) */
.block-row.block-selected .block-content{background:var(--selected);border-radius:6px}
.block-row.block-selected .block-handle{opacity:1}
/* enquanto arrasta por varios blocos, o texto para de ser selecionavel para
   nao brigar com a selecao nativa do navegador */
#blockEditor.selecionando-blocos .block-content{user-select:none}

/* moldura de redimensionamento (fora do conteudo editavel, para nao sujar o HTML) */
.media-resizer{
  position:fixed;z-index:1250;display:none;
  border:1.5px solid var(--accentText);border-radius:9px;
  pointer-events:none;
}
.media-resizer.show{display:block}
.mr-handle{
  position:absolute;width:13px;height:13px;
  background:var(--editor);border:1.5px solid var(--accentText);border-radius:4px;
  pointer-events:auto;touch-action:none;
}
.mr-handle:hover{background:var(--accentText)}
.mr-e{right:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
.mr-se{right:-7px;bottom:-7px;cursor:nwse-resize}
.mr-sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.mr-reset{
  position:absolute;right:-9px;top:-9px;
  width:20px;height:20px;padding:0;
  border:1px solid var(--line2);border-radius:6px;
  background:var(--editor);color:var(--text2);
  display:grid;place-items:center;cursor:pointer;pointer-events:auto;
}
.mr-reset:hover{color:var(--text);background:var(--hover)}
.mr-reset svg{width:12px;height:12px}
.mr-size{
  position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);
  padding:2px 8px;border-radius:999px;
  background:var(--text);color:var(--editor);
  font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
  opacity:0;transition:opacity .12s ease;
}
.media-resizer.dragging .mr-size{opacity:1}
.block-content a{color:#007aff;text-decoration:none}
.block-content code{font-family:var(--mono);background:var(--code);border-radius:5px;padding:2px 5px;font-size:.9em}
.block-content mark,.hl-demo{
  --c:var(--hl);
  color:inherit;background:var(--c);
  border-radius:3px;padding:.08em .18em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* traco de marcador: bordas tortas e pontas que desbotam */
.block-content mark[data-hl-style="irregular"],.hl-demo[data-hl-style="irregular"]{
  background:linear-gradient(104deg,transparent .4%,var(--c) 2.6%,var(--c) 96%,transparent 98.5%);
  border-radius:.5em .18em .45em .14em;
  padding:.12em .3em;
}
/* rabiscado: tracos por cima de uma lavagem leve */
.block-content mark[data-hl-style="scribble"],.hl-demo[data-hl-style="scribble"]{
  background-image:
    repeating-linear-gradient(112deg,var(--c) 0 4px,transparent 4px 11px),
    repeating-linear-gradient(64deg,color-mix(in srgb,var(--c) 70%,transparent) 0 3px,transparent 3px 12px),
    linear-gradient(color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 16%,transparent));
  border-radius:.28em;
  padding:.1em .26em;
}
/* sketch: contorno desenhado a mao ao redor do texto. A cor vai embutida no
   SVG (mask-image mascararia o texto junto), entao quem repinta e o applyTheme. */
.block-content mark[data-hl-style="sketch"],.hl-demo[data-hl-style="sketch"]{
  background:var(--hl-sk) no-repeat center/100% 100%;
  border-radius:0;padding:.16em .42em;
}


/* SLASH */
.slash-menu{
  position:fixed;z-index:1100;
  width:304px;max-height:390px;overflow:auto;
  display:none;padding:7px;
  border:1px solid var(--line);
  border-radius:12px;
  background:color-mix(in srgb,var(--editor) 95%,transparent);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:var(--shadow);
}
.slash-menu.show{display:block;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.slash-caption{
  padding:6px 8px;color:var(--text3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em
}
.slash-item{
  width:100%;min-height:49px;border:0;border-radius:8px;background:transparent;
  display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;
  padding:6px 8px;text-align:left;cursor:pointer
}
.slash-item:hover,.slash-item.selected{background:var(--hover)}
.slash-icon{
  width:32px;height:32px;border:1px solid var(--line);border-radius:7px;
  display:grid;place-items:center;background:var(--editor);font-size:13px;font-weight:700
}
.slash-name{font-size:12.5px;font-weight:650}
.slash-desc{font-size:10.5px;color:var(--text3);margin-top:2px}

/* MENUS / MODALS */
.popover{
  position:fixed;z-index:1200;display:none;
  min-width:215px;padding:6px;
  border:1px solid var(--line);border-radius:11px;
  background:color-mix(in srgb,var(--editor) 96%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.popover.show{display:block;animation:pop .13s var(--ease)}
.menu-item{
  width:100%;height:34px;border:0;border-radius:7px;background:transparent;
  display:flex;align-items:center;gap:8px;padding:0 9px;
  cursor:pointer;text-align:left;font-size:12.5px;
}
.menu-item:hover{background:var(--hover)}
.menu-item.danger{color:var(--danger)}
.menu-item svg{width:15px;height:15px}
.menu-sep{height:1px;background:var(--line);margin:5px 3px}

.modal-backdrop{
  position:fixed;inset:0;z-index:1500;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.18);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(390px,calc(100vw - 30px));
  border:1px solid var(--line);border-radius:16px;
  background:var(--editor);box-shadow:var(--shadow);
  padding:18px;
}
.modal h3{margin:0 0 5px;font-size:17px;letter-spacing:-.02em}
.modal p{margin:0 0 14px;font-size:12.5px;line-height:1.45;color:var(--text2)}
.modal input{
  width:100%;height:38px;border:1px solid var(--line2);border-radius:9px;
  padding:0 10px;outline:0;background:var(--bg);color:var(--text)
}
.modal input:focus{border-color:#d4a900;box-shadow:0 0 0 3px rgba(255,204,0,.15)}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}
.btn{
  height:34px;border:1px solid var(--line);border-radius:9px;
  padding:0 13px;background:var(--editor);cursor:pointer
}
.btn.primary{background:var(--accent);border-color:transparent;color:#1d1d1f;font-weight:650}
.btn.danger{background:var(--danger);border-color:transparent;color:white}

.settings-modal{
  width:min(470px,calc(100vw - 30px));padding:16px 18px 14px;
  max-height:calc(100vh - 40px);overflow:auto;   /* 13 temas nao cabem em tela baixa */
}
.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.settings-head h3{margin:0}
.settings-section{
  margin:14px 0 8px;font-size:10.5px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.05em;
}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.theme-card{
  border:1px solid var(--line);border-radius:10px;
  padding:7px 6px 6px;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;align-items:stretch;
  font-size:10.5px;color:var(--text2);
  transition:border-color .14s ease,background .14s ease;
}
.theme-card:hover{background:var(--hover)}
.theme-card.active{border-color:var(--accentText);color:var(--text)}
.theme-swatch{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.theme-swatch i{flex:1}
.theme-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:40px}
.settings-label{display:flex;flex-direction:column;font-size:12.5px;color:var(--text)}
.settings-label em{font-style:normal;font-size:10.5px;color:var(--text3);margin-top:2px}
.settings-control{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.settings-control input[type=range]{width:150px;accent-color:var(--accentText);cursor:pointer}
.settings-value{
  font-size:11.5px;color:var(--text2);min-width:44px;text-align:right;
  font-variant-numeric:tabular-nums;
}
.settings-actions{display:flex;justify-content:flex-end;margin-top:12px}

.toast{
  position:fixed;z-index:2000;left:50%;bottom:22px;
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  padding:9px 13px;border-radius:999px;
  background:var(--text);color:var(--editor);
  box-shadow:var(--shadow);font-size:11.5px;
  transition:opacity .18s,transform .18s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.tooltip{
  position:fixed;z-index:3000;opacity:0;pointer-events:none;
  padding:5px 7px;border-radius:6px;background:var(--text);color:var(--editor);
  font-size:10.5px;transition:opacity .1s;
}
.tooltip.show{opacity:.95}

.bubble-bar{
  position:fixed;z-index:1300;
  display:none;align-items:center;gap:2px;
  padding:4px;
  border:1px solid var(--line);border-radius:11px;
  background:color-mix(in srgb,var(--editor) 96%,transparent);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:var(--shadow);
}
.bubble-bar.show{display:flex;animation:pop .12s var(--ease)}
.bubble-bar .tool-btn{min-width:32px;height:32px;border-radius:8px}
.bubble-sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:0 0 auto}

.hidden{display:none!important}
/* impressao / PDF: so a nota, sem interface */
@media print{
  @page{margin:18mm 16mm}
  html,body{height:auto;overflow:visible;background:#fff}
  .sidebar,.notes-pane,.formatbar,.find-bar,.bubble-bar,.media-resizer,
  .popover,.toast,.tooltip,.modal-backdrop,.slash-menu,.block-handle{display:none!important}
  .app{display:block;width:auto;height:auto}
  .workspace{display:block;background:#fff}
  .editor-scroll{overflow:visible;height:auto}
  .document{width:100%;max-width:100%;margin:0;padding:0}
  .doc-head{padding:0 0 12px}
  .doc-title{font-size:26pt;color:#000}
  .block-editor{padding:0;min-height:0}
  .block-row{grid-template-columns:0 minmax(0,1fr);margin-left:calc(var(--indent,0) * 18px)}
  .block-content{color:#000;font-size:11.5pt;line-height:1.5}
  .block-content a{color:#0645ad;text-decoration:underline}
  .block-row[data-type="code"] .block-content{background:#f4f4f4;border:1px solid #ddd}
  .block-content iframe{display:none}
  .block-row,.block-content{page-break-inside:avoid;break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){
  .app,.sidebar,.notes-pane,.sidebar-inner,.notes-head,.notes-list,.sidebar-bottom,
  .nav-label,.nav-count,.folder-label,.folder-actions,.folder-tree{
    transition-duration:.01ms;
  }
  .app.focus .sidebar-inner,.app.focus .notes-head,.app.focus .notes-list{transform:none}
}
@media(max-width:1050px){
  :root{--notes-w:270px}
  .document{width:min(820px,calc(100% - 16px))}
}
@media(max-width:780px){

   O app continua funcionando com memória temporária e exportação manual. */
const memoryStorage = new Map();
function storageGet(key){
  try { return window.localStorage.getItem(key); }
  catch { return memoryStorage.has(key) ? memoryStorage.get(key) : null; }
}
function storageSet(key,value){
  try { window.localStorage.setItem(key,value); return true; }
  catch { memoryStorage.set(key,value); return false; }
}

function htmlToPlain(html=""){
  const d=document.createElement("div"); d.innerHTML=html; return d.textContent||"";
}

function markdownInlineToHTML(src=""){
  let s=esc(src);
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/~~([^~]+)~~/g,'<s>$1</s>');
  /* a classe hl-<cor> ainda aparece em .md exportado antes de o marca-texto virar cor unica */
  s=s.replace(/&lt;mark class=&quot;(?:hl-\w+\s*)?(?:hls-(\w+))?&quot;&gt;([\s\S]*?)&lt;\/mark&gt;/g,
    (_m,est,txt)=>`<mark data-hl-style="${est||"regular"}">${txt}</mark>`);
  s=s.replace(/&lt;mark&gt;([\s\S]*?)&lt;\/mark&gt;/g,'<mark data-hl-style="regular">$1</mark>');
  s=s.replace(/&lt;video src=&quot;([\s\S]*?)&quot;(?:\s+width=&quot;(\d+)&quot;)?[\s\S]*?&gt;(?:\s*&lt;\/video&gt;)?/g,
    (_m,src,w)=>`<video src="${src}"${w?` style="width:${w}px"`:""} controls preload="metadata"></video>`);
  s=s.replace(/&lt;iframe src=&quot;([\s\S]*?)&quot;(?:\s+width=&quot;(\d+)&quot;)?[\s\S]*?&gt;(?:\s*&lt;\/iframe&gt;)?/g,
    (_m,src,w)=>videoHTML(src,w?`${w}px`:""));
  s=s.replace(/&lt;img src=&quot;([\s\S]*?)&quot;(?:\s+alt=&quot;([\s\S]*?)&quot;)?(?:\s+width=&quot;(\d+)&quot;)?[\s\S]*?&gt;/g,
    (_m,src,alt,w)=>`<img src="${src}" alt="${alt||"imagem"}"${w?` style="width:${w}px"`:""}>`);
  s=s.replace(/==([^=]+)==/g,'<mark data-hl-style="regular">$1</mark>');
  s=s.replace(/(^|[^\*])\*([^*]+)\*/g,'$1<em>$2</em>');
  return s;
}

const indentOf=(espacos="")=>Math.max(0,Math.min(6,Math.floor(espacos.replace(/\t/g,"  ").length/2)));
/* linha que so tem midia vira bloco de midia, nao paragrafo */
function apenasMidia(html=""){
  const d=document.createElement("div");d.innerHTML=html;
  return !(d.textContent||"").trim() && !!d.querySelector("img,video,iframe,.video-card");
}
function embedHTML(url=""){
  const u=String(url).trim();
  const yt=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  const vm=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  const src=yt?`https://www.youtube.com/embed/${yt[1]}`:vm?`https://player.vimeo.com/video/${vm[1]}`:u;
  return videoHTML(src);
}
function markdownToNote(markdown,fileTitle="Nota importada"){
  const lines=markdown.replace(/\r/g,"").split("\n");
  let title=fileTitle, start=0;
  for(let i=0;i<lines.length;i++){
    if(lines[i].trim()){
      const m=lines[i].match(/^#\s+(.+)$/);
      if(m){title=m[1].trim();start=i+1}
      break;
    }
  }
  const blocks=[], code=[];
  let inCode=false, sanfonaNivel=0;
  for(let i=start;i<lines.length;i++){
    const line=lines[i];
    if(/^```/.test(line)){
      if(!inCode){inCode=true;code.length=0}
      else{blocks.push(blankBlock("code",esc(code.join("\n"))));inCode=false}
      continue;
    }
    if(inCode){code.push(line);continue}

    if(/^\|.+\|$/.test(line) && i+1<lines.length && /^\|(?:\s*:?-+:?\s*\|)+$/.test(lines[i+1])){
      const rows=[];
      const parse=v=>v.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      rows.push(parse(line));
      i+=2;
      while(i<lines.length && /^\|.+\|$/.test(lines[i])){rows.push(parse(lines[i]));i++}
      i--;
      const head=rows[0]||[], body=rows.slice(1);
      const table=`<table><thead><tr>${head.map(c=>`<th>${markdownInlineToHTML(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${markdownInlineToHTML(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      blocks.push(blankBlock("table",table));continue;
    }

    let m;
    if(/^\s*&lt;\/details&gt;\s*$/.test(esc(line))||/^\s*<\/details>\s*$/.test(line)){
      if(sanfonaNivel>0)sanfonaNivel--;
      continue;
    }
    if((m=line.match(/^\s*<details><summary>([\s\S]*?)<\/summary>\s*$/))){
      blocks.push(blankBlock("toggle",markdownInlineToHTML(m[1]),sanfonaNivel));
      sanfonaNivel=Math.min(6,sanfonaNivel+1);
      continue;
    }
    if((m=line.match(/^>\s*(\p{Extended_Pictographic}\uFE0F?)\s+(.*)$/u))){
      const bloco=blankBlock("callout",markdownInlineToHTML(m[2]),sanfonaNivel);
      bloco.icon=m[1];
      blocks.push(bloco);
      continue;
    }
    if((m=line.match(/^###\s+(.+)$/))) blocks.push(blankBlock("h3",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^##\s+(.+)$/))) blocks.push(blankBlock("h2",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^#\s+(.+)$/))) blocks.push(blankBlock("h1",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^>\s?(.*)$/))) blocks.push(blankBlock("quote",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^(\s*)[-*]\s+\[([ xX])\]\s?(.*)$/))) blocks.push({...blankBlock("todo",markdownInlineToHTML(m[3]),indentOf(m[1])),checked:m[2].toLowerCase()==="x"});
    else if((m=line.match(/^(\s*)[-*+]\s+(.+)$/))) blocks.push(blankBlock("bullet",markdownInlineToHTML(m[2]),indentOf(m[1])));
    else if((m=line.match(/^(\s*)\d+\.\s+(.+)$/))) blocks.push(blankBlock("numbered",markdownInlineToHTML(m[2]),indentOf(m[1])));
    else if(/^(---|\*\*\*)\s*$/.test(line)) blocks.push(blankBlock("divider",""));
    else if((m=line.match(/^\s*\[V\u00eddeo\]\((\S+)\)\s*$/))) blocks.push(blankBlock("media",embedHTML(m[1])));
    else if(line.trim()===""){
      if(blocks.length && !(blocks.at(-1).type==="p" && !htmlToPlain(blocks.at(-1).html).trim())) blocks.push(blankBlock("p","",sanfonaNivel));
    }else{
      const html=markdownInlineToHTML(line);
      blocks.push(blankBlock(apenasMidia(html)?"media":"p",html,sanfonaNivel));
    }
  }
  if(inCode) blocks.push(blankBlock("code",esc(code.join("\n"))));
  while(blocks.length>1 && blocks.at(-1).type==="p" && !htmlToPlain(blocks.at(-1).html).trim()) blocks.pop();
  return {title,blocks:blocks.length?blocks:[blankBlock()]};
}

function migrateOld(old){
  const migrated={
    version:3,
    selectedFolderId:old.selectedFolderId||"all",
    selectedNoteId:old.selectedNoteId||null,
    sort:old.sort||"updated",
    sidebarCollapsed:true,
    openFolders:[],
    folders:Array.isArray(old.folders)?old.folders:[],
    notes:[]
  };
  migrated.notes=(old.notes||[]).map(n=>{
    const parsed=markdownToNote(n.content||"", "Nova nota");
    return {
      id:n.id||uid(),folderId:n.folderId,title:parsed.title,
      createdAt:n.createdAt||now(),updatedAt:n.updatedAt||now(),pinned:!!n.pinned,
      blocks:parsed.blocks
    };
  });
  return migrated;
}

function loadState(){
  try{
    const current=storageGet(STORAGE_KEY);
    if(current){
      const x=JSON.parse(current);
      if(Array.isArray(x.notes)&&Array.isArray(x.folders)) return x;
    }
    const old=storageGet(OLD_STORAGE_KEY);
    if(old){
      const x=JSON.parse(old);
      if(Array.isArray(x.notes)&&Array.isArray(x.folders)){
        const migrated=migrateOld(x);
        storageSet(STORAGE_KEY,JSON.stringify(migrated));
        return migrated;
      }
    }
  }catch{}
  return demoState();
}

  const out=[id];

  walk(id);return out;
}

function formatDate(iso){
  const d=new Date(iso),t=new Date();
  if(d.toDateString()===t.toDateString())return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});

function visibleNotes(){
  const q=$("#searchInput").value.trim().toLowerCase();
  let list=state.notes.slice();
  if(state.selectedFolderId!=="all"){
    const ids=new Set(descendants(state.selectedFolderId));
    list=list.filter(n=>ids.has(n.folderId));
  }
  if(q) list=list.filter(n=>`${n.title} ${notePlain(n)}`.toLowerCase().includes(q));
  list.sort((a,b)=>{
    if(a.pinned!==b.pinned)return a.pinned?-1:1;
    return new Date(b.updatedAt)-new Date(a.updatedAt);
  });
  return list;
}

let avisouArmazenamento=false;
/* storageSet cai para memoria quando estoura a cota; sem checar o retorno
   o app dizia "Salvo" e o conteudo sumia no recarregamento. */
function persistState(notify=false){
  let ok=false;
  try{ ok=storageSet(STORAGE_KEY,JSON.stringify(state)) }catch{ ok=false }
  if(ok){
    avisouArmazenamento=false;
    setSaveState("saved");
    if(notify)toast("Salvo no navegador");
    return true;
  }
  setSaveState("error");
  if(notify||!avisouArmazenamento){
    avisouArmazenamento=true;
    toast("Sem espaço no navegador — exporte o projeto para não perder");
  }
  return false;
}

}
function saveState(immediate=false,notify=false){

    syncActiveNoteFromDOM();
    persistState(notify);
  };
  clearTimeout(saveTimer);
  if(immediate)commit();
  else{setSaveState("saving");saveTimer=setTimeout(commit,180)}

/* Historico proprio: o execCommand('undo') do navegador tem pilha por bloco
   contenteditable, entao trocar de bloco perdia o desfazer do anterior. */
function histCaret(){
  const rows=$$(".block-row",blockEditor);
  const row=currentRow();
  const i=row?rows.indexOf(row):0;
  return i<0?0:i;
}
function histSnap(note){
  return {
    title:note.title||"",
    blocks:JSON.parse(JSON.stringify(note.blocks||[])),
    caret:histCaret()
  };
}
function histReset(){
  const note=selectedNote();
  clearTimeout(hist.timer);
  hist.id=note?note.id:null;
  hist.stack=note?[histSnap(note)]:[];
  hist.i=note?0:-1;
  histSync();
}
function histSync(){
  const u=$('[data-action="undo"]'), r=$('[data-action="redo"]');
  if(u)u.disabled=hist.i<=0;
  if(r)r.disabled=hist.i<0||hist.i>=hist.stack.length-1;
}
function histPush(immediate=false){
  if(hist.lock)return;
  clearTimeout(hist.timer);
  const run=()=>{
    const note=selectedNote();if(!note)return;
    if(hist.id!==note.id){histReset();return}
    syncActiveNoteFromDOM();
    const snap=histSnap(note);
    const atual=hist.stack[hist.i];
    if(atual&&atual.title===snap.title&&JSON.stringify(atual.blocks)===JSON.stringify(snap.blocks))return;
    hist.stack=hist.stack.slice(0,hist.i+1);
    hist.stack.push(snap);
    if(hist.stack.length>120)hist.stack.shift();
    hist.i=hist.stack.length-1;
    histSync();
  };
  if(immediate)run();else hist.timer=setTimeout(run,600);
}
function histApply(dir){
  const note=selectedNote();if(!note)return;
  if(hist.id!==note.id){histReset();return}
  clearTimeout(hist.timer);
  /* o que esta na tela e mais novo que o topo da pilha: registra antes de voltar */
  if(dir<0)histPush(true);
  const alvo=hist.i+dir;
  if(alvo<0||alvo>=hist.stack.length){histSync();return}
  hist.i=alvo;
  const snap=hist.stack[alvo];
  hist.lock=true;
  note.title=snap.title;
  note.blocks=JSON.parse(JSON.stringify(snap.blocks));
  note.updatedAt=now();

/* numeracao das listas: calculada no JS para respeitar niveis e reinicios */
/* Sanfona: recolhe os blocos seguintes com indentacao maior que a do toggle. */
function applyToggles(){
  let ocultarAcimaDe=null;
  $$(".block-row",blockEditor).forEach(row=>{
    const ind=Number(row.dataset.indent)||0;
    if(ocultarAcimaDe!==null){
      if(ind>ocultarAcimaDe){row.classList.add("oculto");return}
      ocultarAcimaDe=null;
    }
    row.classList.remove("oculto");
    if(row.dataset.type==="toggle"&&row.classList.contains("collapsed"))ocultarAcimaDe=ind;
  });
}
function renumberLists(){
  const counters=[];
  $$(".block-row",blockEditor).forEach(row=>{
    if(row.dataset.type!=="numbered"){counters.length=0;return}
    const lvl=Math.max(0,Math.min(6,Number(row.dataset.indent)||0));
    counters[lvl]=(counters[lvl]||0)+1;
    counters.length=lvl+1;
    $(".block-marker",row)?.setAttribute("data-num",counters[lvl]);
  });
}
function setIndent(row,delta){
  const cur=Number(row.dataset.indent)||0;
  const next=Math.max(0,Math.min(6,cur+delta));
  if(next===cur)return false;
  histPush(true);
  row.dataset.indent=next;
  row.style.setProperty("--indent",next);
  renumberLists();applyToggles();touchNote();
  return true;
}

function currentRow(){

  if(sel?.rangeCount){

/* --- navegacao vertical entre blocos -------------------------------
   Cada bloco e um contenteditable separado, entao a seta do navegador
   parava na borda. Aqui detectamos primeira/ultima linha visual e
   pulamos para o bloco vizinho mantendo a coluna. */
function caretRect(){
  const sel=getSelection();
  if(!sel||!sel.rangeCount)return null;
  const r=sel.getRangeAt(0).cloneRange();
  r.collapse(true);
  let rect=r.getBoundingClientRect();
  if(rect&&(rect.height||rect.width))return rect;
  const no=r.startContainer,off=r.startOffset;
  if(no&&no.nodeType===3){
    if(off>0){
      const q=document.createRange();q.setStart(no,off-1);q.setEnd(no,off);
      const b=q.getBoundingClientRect();if(b.height)return b;
    }
    if(off<no.length){
      const q=document.createRange();q.setStart(no,off);q.setEnd(no,off+1);
      const b=q.getBoundingClientRect();if(b.height)return b;
    }
  }
  return null;
}
function pontoParaRange(x,y){
  if(document.caretRangeFromPoint)return document.caretRangeFromPoint(x,y);
  if(document.caretPositionFromPoint){
    const pos=document.caretPositionFromPoint(x,y);
    if(!pos)return null;
    const r=document.createRange();r.setStart(pos.offsetNode,pos.offset);r.collapse(true);return r;
  }
  return null;
}
function colocarCaretNaLinha(c,onde,x){
  const r=c.getBoundingClientRect();
  const lh=parseFloat(getComputedStyle(c).lineHeight)||22;
  const y=onde==="fim"?r.bottom-Math.min(lh,r.height)/2:r.top+Math.min(lh,r.height)/2;
  const px=Math.min(Math.max(x,r.left+1),Math.max(r.left+1,r.right-1));
  let range=pontoParaRange(px,y);
  if(!range||!c.contains(range.startContainer)){
    range=document.createRange();range.selectNodeContents(c);range.collapse(onde!=="fim");
  }
  c.focus();
  const sel=getSelection();sel.removeAllRanges();sel.addRange(range);
  savedRange=range.cloneRange();
}
function irParaBlocoVizinho(row,dir,x){
  let alvo=dir<0?row.previousElementSibling:row.nextElementSibling;
  while(alvo){
    const c=$(".block-content",alvo);
    if(c&&c.contentEditable!=="false"){
      colocarCaretNaLinha(c,dir<0?"fim":"inicio",x);
      return true;
    }
    alvo=dir<0?alvo.previousElementSibling:alvo.nextElementSibling;
  }
  if(dir<0&&!docTitle.disabled){
    docTitle.focus();
    const n=docTitle.value.length;docTitle.setSelectionRange(n,n);
    return true;
  }
  return false;
}
function moverEntreBlocos(row,c,dir){
  const cr=c.getBoundingClientRect();
  const lh=parseFloat(getComputedStyle(c).lineHeight)||22;
  const rect=caretRect();
  const x=rect?rect.left:cr.left+2;
  const naBorda=!rect
    ? true
    : dir<0 ? (rect.top-cr.top)<lh*0.6 : (cr.bottom-rect.bottom)<lh*0.6;
  if(!naBorda)return false;
  return irParaBlocoVizinho(row,dir,x);
}

function focusBlock(row,end=true){
  if(!row)return;
  const c=$(".block-content",row);if(!c||c.contentEditable==="false")return;
  c.focus();

  const s=getSelection();s.removeAllRanges();s.addRange(r);savedRange=r.cloneRange();
}

}
function insertAfter(row,type="p",html="",indent=0){
  histPush(true);
  const b=blankBlock(type,html,indent);
  row.insertAdjacentHTML("afterend",blockHTML(b));
  const next=row.nextElementSibling;renumberLists();applyToggles();touchNote();
  if(type!=="divider")requestAnimationFrame(()=>focusBlock(next,true));
  return next;
}
/* Video: arquivo pequeno vira data URL; link vira player embutido.
   O limite existe porque tudo mora no localStorage do navegador. */
const LIMITE_VIDEO=2*1024*1024;
/* Midia entra como bloco proprio (como divisor/tabela): ganha alcinha de
   arrastar, se apaga sozinha e nao fica presa dentro de um paragrafo. */
function insertMediaBlock(html){
  let row=currentRow()||$$(".block-row",blockEditor).at(-1);
  if(!row){
    blockEditor.insertAdjacentHTML("beforeend",blockHTML(blankBlock("p","")));
    row=$$(".block-row",blockEditor).at(-1);
  }
  histPush(true);
  const c=$(".block-content",row);
  const vazio=c&&!(c.textContent||"").trim()&&!c.querySelector("img,video,iframe");
  let alvo;
  if(vazio&&["p","media"].includes(row.dataset.type)){
    row.dataset.type="media";
    c.dataset.placeholder="";
    c.innerHTML=html;
    alvo=row;
  }else{
    alvo=insertAfter(row,"media",html,Number(row.dataset.indent)||0);
  }
  /* sempre deixa um paragrafo depois, para continuar escrevendo */
  if(!alvo.nextElementSibling)insertAfter(alvo,"p","");
  renumberLists();touchNote();
  requestAnimationFrame(()=>{
    const seguinte=alvo.nextElementSibling;
    if(seguinte)focusBlock(seguinte,true);
  });
  return alvo;
}
/* Fonte unica da marcacao de video, usada na insercao e na importacao. */
function videoHTML(src,largura){
  const w=largura?` style="width:${largura}"`:"";
  const yt=String(src).match(/youtube\.com\/embed\/([\w-]+)/);
  const vm=String(src).match(/player\.vimeo\.com\/video\/(\d+)/);
  if(yt){
    const capa=`https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg`;
    return `<span class="video-card" contenteditable="false" data-label="YouTube"`+
      ` data-embed="${esc(src)}" data-watch="https://youtu.be/${yt[1]}"${w}>`+
      `<img src="${capa}" alt="Capa do vídeo" draggable="false"><span class="video-play"></span></span>`;
  }
  if(vm){
    return `<span class="video-card" contenteditable="false" data-label="Vimeo"`+
      ` data-embed="${esc(src)}" data-watch="https://vimeo.com/${vm[1]}"${w}></span>`;
  }
  return `<iframe class="embed" src="${esc(src)}" allowfullscreen loading="lazy" contenteditable="false"${w}></iframe>`;
}
function embedVideo(url){
  const u=String(url||"").trim();
  if(!u)return;
  const yt=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  const vm=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  let html="";
  if(yt)html=videoHTML(`https://www.youtube.com/embed/${yt[1]}`);
  else if(vm)html=videoHTML(`https://player.vimeo.com/video/${vm[1]}`);
  else if(/^https?:\/\//i.test(u))html=`<video src="${esc(u)}" controls preload="metadata"></video>`;
  else{toast("Link de vídeo inválido");return}
  insertMediaBlock(html);
}

  saveSelection();
  const url=await ask("Inserir vídeo","Cole o link do YouTube, do Vimeo ou de um arquivo .mp4.","https://","Inserir");
  if(url&&url.trim())embedVideo(url);
}

function markSlashSelection(){

  if(slash.index===0){slashMenu.scrollTop=0;return}
  const topo=el.offsetTop-7, base=el.offsetTop+el.offsetHeight+7;
  if(topo<slashMenu.scrollTop)slashMenu.scrollTop=topo;
  else if(base>slashMenu.scrollTop+slashMenu.clientHeight)slashMenu.scrollTop=base-slashMenu.clientHeight;
}
function closeSlash(){slash.open=false;slash.row=null;slash.items=[];slashMenu.classList.remove("show")}
function runSlash(cmd){

  const c=$(".block-content",row);

/* Busca na nota: usa Range + selecao nativa, sem mexer no conteudo do bloco. */
function findCollect(){
  /* percorre so o texto dos blocos: controles auxiliares (icone do destaque,
     seta da sanfona) nao podem entrar no indice nem deslocar os offsets */
  const nodes=[];let texto="";
  $$(".block-content",blockEditor).forEach(c=>{
    const walker=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);
    let n;
    while((n=walker.nextNode())){nodes.push({node:n,start:texto.length});texto+=n.nodeValue||""}
    texto+=String.fromCharCode(10);
  });
  return {nodes,texto};
}
function findLocate(off){
  for(let k=find.nodes.length-1;k>=0;k--){
    const it=find.nodes[k];
    if(off>=it.start)return{node:it.node,offset:off-it.start};
  }
  return null;
}
function findUpdateCount(){
  if(!findCount)return;
  findCount.textContent=!find.termo?"":find.hits.length?`${find.i+1} de ${find.hits.length}`:"nenhum";
}
function findGo(i){
  if(!find.hits.length)return findUpdateCount();
  find.i=(i+find.hits.length)%find.hits.length;
  const hit=find.hits[find.i];
  const a=findLocate(hit.start), b=findLocate(hit.end-1);
  if(!a||!b)return findUpdateCount();
  try{
    const r=document.createRange();
    r.setStart(a.node,Math.min(a.offset,(a.node.nodeValue||"").length));
    r.setEnd(b.node,Math.min(b.offset+1,(b.node.nodeValue||"").length));
    const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
    (a.node.parentElement||blockEditor).scrollIntoView({block:"center",behavior:"smooth"});
  }catch{}
  findUpdateCount();
}
function findRun(termo){
  find.termo=termo||"";
  find.hits=[];find.i=-1;
  if(!find.termo){findUpdateCount();return}
  const {nodes,texto}=findCollect();
  find.nodes=nodes;
  const alvo=texto.toLowerCase(), agulha=find.termo.toLowerCase();
  let pos=alvo.indexOf(agulha);
  while(pos>=0&&find.hits.length<2000){
    find.hits.push({start:pos,end:pos+agulha.length});
    pos=alvo.indexOf(agulha,pos+agulha.length);
  }
  if(find.hits.length)findGo(0);else findUpdateCount();
}
function findOpen(){
  findBar.classList.remove("hidden");
  const sel=getSelection();
  const marcado=sel&&!sel.isCollapsed&&blockEditor.contains(sel.anchorNode?.parentElement||sel.anchorNode)
    ? String(sel).trim() : "";
  if(marcado&&marcado.length<80)findInput.value=marcado;
  findInput.focus();findInput.select();
  if(findInput.value)findRun(findInput.value);
}
function findClose(){
  findBar.classList.add("hidden");

}

/* Colar: mantem o basico e descarta estilos de fora (Word, web, etc). */
const TAGS_COLAR=new Set(["B","STRONG","I","EM","U","S","STRIKE","DEL","CODE","A","MARK","BR","IMG"]);
function cleanPastedHTML(html=""){
  const d=document.createElement("div");
  d.innerHTML=html;
  d.querySelectorAll("*").forEach(el=>{
    if(!TAGS_COLAR.has(el.tagName)){el.replaceWith(...el.childNodes);return}
    const href=el.tagName==="A"?el.getAttribute("href"):null;
    const est=el.tagName==="MARK"?el.getAttribute("data-hl-style"):null;
    const imgSrc=el.tagName==="IMG"?el.getAttribute("src"):null;
    const imgAlt=el.tagName==="IMG"?el.getAttribute("alt"):null;
    Array.from(el.attributes).forEach(a=>el.removeAttribute(a.name));
    if(el.tagName==="A"){
      if(href&&/^(https?:|mailto:|#|\/)/i.test(href))el.setAttribute("href",href);
      else el.replaceWith(...el.childNodes);
    }
    if(el.tagName==="MARK")el.setAttribute("data-hl-style",est||"regular");
    if(el.tagName==="IMG"){
      if(imgSrc&&/^(https?:|data:image\/)/i.test(imgSrc)){
        el.setAttribute("src",imgSrc);
        el.setAttribute("alt",imgAlt||"imagem");
      }else el.remove();
    }
  });
  return d.innerHTML;
}

function saveSelection(){

}
function restoreSelection(){
  if(!savedRange)return false;
  try{const s=getSelection();s.removeAllRanges();s.addRange(savedRange);return true}catch{return false}
}

const HL_SENTINEL="rgb(1,2,3)";
const hlProbe=document.createElement("span");
hlProbe.style.backgroundColor=HL_SENTINEL;
const HL_SENTINEL_RGB=hlProbe.style.backgroundColor;

function unwrap(el){el.replaceWith(...el.childNodes)}
function cleanupMarks(){
  $$("mark",blockEditor).forEach(m=>{
    if(!m.isConnected)return;
    if(!m.textContent&&!m.querySelector("img")){m.remove();return}
    if(m.parentElement?.closest("mark"))unwrap(m);
  });
}
function selectAcross(nodes){
  if(!nodes.length)return;
  const r=document.createRange();
  r.setStartBefore(nodes[0]);r.setEndAfter(nodes.at(-1));
  const s=getSelection();s.removeAllRanges();s.addRange(r);savedRange=r.cloneRange();
}
function marksInRange(range){
  return $$("mark",blockEditor).filter(m=>{try{return range.intersectsNode(m)}catch{return false}});
}
function setHighlightStyle(id){
  hlStyle=id;
  $$(".hl-style",highlightMenu).forEach(b=>b.classList.toggle("active",b.dataset.hlStyle===id));
}
function applyHighlight(estilo=hlStyle){
  restoreSelection();
  const sel=getSelection();
  if(!sel?.rangeCount||sel.isCollapsed){toast("Selecione um trecho para marcar");return}
  document.execCommand("styleWithCSS",false,true);
  document.execCommand("hiliteColor",false,HL_SENTINEL);
  const tagged=$$("*",blockEditor).filter(el=>el.style?.backgroundColor===HL_SENTINEL_RGB);
  if(!tagged.length){toast("Não foi possível marcar aqui");return}
  /* tira marcacoes antigas que cruzam a selecao, para nao empilhar cores.
     A propria marca alvo fica de fora: ela e reaproveitada logo abaixo. */
  $$("mark",blockEditor).forEach(m=>{
    if(tagged.includes(m))return;
    if(tagged.some(el=>el.contains(m)||m.contains(el)))unwrap(m);
  });
  const created=tagged.map(el=>{
    el.style.backgroundColor="";
    if(!el.getAttribute("style"))el.removeAttribute("style");
    /* selecao que cobre exatamente uma marca: o navegador estiliza a propria
       <mark>, entao so trocamos o estilo em vez de recriar o elemento */
    if(el.tagName==="MARK"){el.dataset.hlStyle=estilo;return el}
    const m=document.createElement("mark");
    m.dataset.hlStyle=estilo;
    while(el.firstChild)m.appendChild(el.firstChild);
    if(el.tagName==="SPAN"&&!el.getAttribute("style")&&!el.className)el.replaceWith(m);
    else el.appendChild(m);
    return m;
  });
  cleanupMarks();
  selectAcross(created.filter(m=>m.isConnected));
  touchNote();
}
function clearHighlight(){
  restoreSelection();
  const sel=getSelection();if(!sel?.rangeCount)return;
  const hit=marksInRange(sel.getRangeAt(0));
  if(!hit.length){toast("Nenhuma marcação na seleção");return}
  hit.forEach(m=>unwrap(m));
  saveSelection();touchNote();
}
function toggleHighlight(){
  restoreSelection();
  const sel=getSelection();
  if(!sel?.rangeCount||sel.isCollapsed){toast("Selecione um trecho para marcar");return}
  const n=sel.getRangeAt(0).commonAncestorContainer;
  const el=n.nodeType===1?n:n.parentElement;
  const inside=el?.closest?.("mark");
  const mesmoEstilo=(inside?.dataset.hlStyle||"regular")===hlStyle;
  if(inside&&blockEditor.contains(inside)&&mesmoEstilo){unwrap(inside);saveSelection();touchNote();return}
  applyHighlight(hlStyle);
}

function tableToMarkdown(table){
  const rows=Array.from(table.querySelectorAll("tr")).map(tr=>Array.from(tr.querySelectorAll("th,td")).map(c=>(c.textContent||"").trim().replace(/\|/g,"\\|")));
  if(!rows.length)return"";
  const cols=Math.max(...rows.map(r=>r.length));
  const nr=rows.map(r=>[...r,...Array(Math.max(0,cols-r.length)).fill("")]);
  const head=nr[0],body=nr.slice(1);
  return [`| ${head.join(" | ")} |`,`| ${head.map(()=> "---").join(" | ")} |`,...body.map(r=>`| ${r.join(" | ")} |`)].join("\n");
}
function inlineToMarkdown(html=""){
  const root=document.createElement("div");root.innerHTML=html;
  const walk=node=>{
    if(node.nodeType===Node.TEXT_NODE)return node.nodeValue||"";
    if(node.nodeType!==Node.ELEMENT_NODE)return"";
    const tag=node.tagName.toLowerCase();
    const child=Array.from(node.childNodes).map(walk).join("");
    if(tag==="strong"||tag==="b")return`**${child}**`;
    if(tag==="em"||tag==="i")return`*${child}*`;
    if(tag==="s"||tag==="strike"||tag==="del")return`~~${child}~~`;
    if(tag==="mark"){
      const est=node.dataset.hlStyle||"regular";
      return est==="regular"?`==${child}==`:`<mark class="hls-${est}">${child}</mark>`;
    }
    if(tag==="u")return`<u>${child}</u>`;
    if(tag==="code")return`\`${child}\``;
    if(tag==="a")return`[${child}](${node.getAttribute("href")||""})`;
    if(node.classList&&node.classList.contains("video-card")){
      const w=parseInt(node.style.width,10);
      return`<iframe src="${node.dataset.embed||""}"${Number.isFinite(w)?` width="${w}"`:""}></iframe>`;
    }
    if(tag==="img"||tag==="video"||tag==="iframe"){
      const src=node.getAttribute("src")||"";
      const w=parseInt(node.style.width,10);
      const larg=Number.isFinite(w)?` width="${w}"`:"";
      if(tag==="img"){
        const alt=node.getAttribute("alt")||"imagem";
        /* sem largura customizada fica no Markdown limpo */
        return larg?`<img src="${src}" alt="${alt}"${larg}>`:`![${alt}](${src})`;
      }
      if(tag==="video")return`<video src="${src}"${larg} controls></video>`;
      return`<iframe src="${src}"${larg}></iframe>`;
    }
    if(tag==="br")return"\n";
    if(tag==="span"||tag==="font"){
      /* compatibilidade com o formato antigo, que marcava estilo no proprio span */
      const st=node.style||{};
      const peso=parseInt(st.fontWeight,10);
      const deco=`${st.textDecorationLine||""} ${st.textDecoration||""}`;
      let r=child;
      if(!r.trim())return r;
      if(st.fontWeight==="bold"||peso>=600)r=`**${r}**`;
      if(st.fontStyle==="italic")r=`*${r}*`;
      if(/line-through/.test(deco))r=`~~${r}~~`;
      else if(/underline/.test(deco))r=`<u>${r}</u>`;
      return r;
    }
    if(tag==="table")return tableToMarkdown(node);
    return child;
  };
  return Array.from(root.childNodes).map(walk).join("").trimEnd();
}
const isListType=t=>["bullet","numbered","todo"].includes(t);
/* o conteudo de um bloco de codigo precisa manter as quebras de linha */
function codeToPlain(html=""){
  const d=document.createElement("div");
  d.innerHTML=String(html).replace(/<br\s*\/?>/gi,"\n").replace(/<\/(div|p)>/gi,"\n").replace(/<(div|p)[^>]*>/gi,"");
  return (d.textContent||"").replace(/\n$/,"");
}
function noteToMarkdown(note){
  const blocks=note.blocks||[];
  const out=[`# ${note.title||"Sem título"}`,""];
  const sanfonas=[];   /* indentacoes de toggles abertos, para fechar o <details> */
  const fecharAte=ind=>{
    while(sanfonas.length&&ind<=sanfonas[sanfonas.length-1]){sanfonas.pop();out.push("</details>","")}
  };
  blocks.forEach((b,i)=>{
    const md=inlineToMarkdown(b.html||"");
    const nivel=Math.max(0,Math.min(6,Number(b.indent)||0));
    fecharAte(nivel);
    if(b.type==="toggle"){
      out.push(`<details><summary>${md}</summary>`);
      sanfonas.push(nivel);
      return;
    }
    const pad="  ".repeat(nivel);
    /* itens de lista seguidos ficam colados: linha em branco quebraria o aninhamento */
    const gap=(isListType(b.type)&&isListType(blocks[i+1]?.type))?[]:[""];
    if(b.type==="h1")out.push(`# ${md}`,"");
    else if(b.type==="h2")out.push(`## ${md}`,"");
    else if(b.type==="h3")out.push(`### ${md}`,"");
    else if(b.type==="bullet")out.push(`${pad}- ${md}`,...gap);
    else if(b.type==="numbered")out.push(`${pad}1. ${md}`,...gap);
    else if(b.type==="todo")out.push(`${pad}- [${b.checked?"x":" "}] ${md}`,...gap);
    else if(b.type==="quote")out.push(`> ${md}`,"");
    else if(b.type==="callout")out.push(`> ${b.icon||"💡"} ${md}`,"");
    else if(b.type==="code")out.push("```",codeToPlain(b.html||""),"```","");
    else if(b.type==="divider")out.push("---","");
    else if(b.type==="media")out.push(md,"");
    else if(b.type==="table"){
      const d=document.createElement("div");d.innerHTML=b.html||"";
      out.push(d.querySelector("table")?tableToMarkdown(d.querySelector("table")):md,"");
    }else out.push(md,"");
  });
  fecharAte(-1);
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}
function download(name,text,type="text/plain"){
  const blob=new Blob([text],{type}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function importMarkdownFiles(files,folderId=null){
  const list=Array.from(files).filter(f=>/\.(md|markdown|txt)$/i.test(f.name));if(!list.length)return toast("Nenhum Markdown encontrado");
  let target=folderId||state.selectedFolderId;
  if(target==="all"||!state.folders.some(f=>f.id===target))target=state.folders[0]?.id;
  if(!target){target=uid();state.folders.push({id:target,name:"Importados",parentId:null,createdAt:now()})}
  for(const f of list){
    const parsed=markdownToNote(await f.text(),f.name.replace(/\.(md|markdown|txt)$/i,""));
    state.notes.push({id:uid(),folderId:target,title:parsed.title,createdAt:now(),updatedAt:now(),pinned:false,blocks:parsed.blocks});
  }
  state.selectedFolderId=target;state.selectedNoteId=state.notes.at(-1).id;setFocus(false);saveState(true);renderAll();toast(`${list.length} arquivo${list.length===1?"":"s"} importado${list.length===1?"":"s"}`)
}
async function importFolder(files){
  const list=Array.from(files).filter(f=>/\.(md|markdown|txt)$/i.test(f.name));if(!list.length)return toast("Nenhum Markdown encontrado");
  const cache=new Map();
  const rootName=list[0].webkitRelativePath?.split("/")[0]||"Projeto importado";
  const rootId=uid();state.folders.push({id:rootId,name:rootName,parentId:null,createdAt:now()});cache.set(rootName,rootId);
  const ensure=parts=>{
    let pid=rootId,path=rootName;
    for(const p of parts.slice(1)){path+="/"+p;if(!cache.has(path)){const id=uid();state.folders.push({id,name:p,parentId:pid,createdAt:now()});cache.set(path,id)}pid=cache.get(path)}
    return pid;
  };
  for(const f of list){
    const parts=(f.webkitRelativePath||f.name).split("/");
    const pid=ensure(parts.slice(0,-1));
    const parsed=markdownToNote(await f.text(),f.name.replace(/\.(md|markdown|txt)$/i,""));
    state.notes.push({id:uid(),folderId:pid,title:parsed.title,createdAt:now(),updatedAt:now(),pinned:false,blocks:parsed.blocks});
  }
  state.selectedFolderId=rootId;state.selectedNoteId=state.notes.at(-1).id;state.openFolders.push(rootId);setFocus(false);
  saveState(true);renderAll();toast(`Pasta importada com ${list.length} notas`)
}
async function importProject(file){
  try{
    const parsed=JSON.parse(await file.text()),data=parsed.data||parsed;
    if(!Array.isArray(data.notes)||!Array.isArray(data.folders))throw new Error();
    const ok=await confirmDialog("Substituir projeto atual?","A importação vai substituir as notas e pastas atuais.","Importar");
    if(!ok)return;
    const needsMigration=data.notes.some(n=>typeof n.content==="string"&&!Array.isArray(n.blocks));
    state=needsMigration?migrateOld(data):data;
    state.sidebarCollapsed=true;state.openFolders||=[];
    if(!state.notes.some(n=>n.id===state.selectedNoteId))state.selectedNoteId=state.notes[0]?.id||null;
    setFocus(false);saveState(true);renderAll();toast("Projeto importado")
  }catch{toast("Arquivo de projeto inválido")}
}

function temaAtual(){
  const t=storageGet(THEME_KEY);
  return TEMAS[t]?t:"light";
}
/* O marca-texto e o acento do tema. A cor solida sai daqui porque dois lugares
   precisam dela em CSS cru: o traco do estilo sketch (cor embutida no SVG) e a
   pagina .html exportada, que nao carrega os tokens do app. */
function acentoRGBA(alfa){
  const bruto=(getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"").replace("#","");
  const hex=bruto.length===3?bruto.split("").map(c=>c+c).join(""):bruto;
  const [r,g,b]=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));
  return [r,g,b].every(Number.isFinite)?`rgba(${r},${g},${b},${alfa})`:`rgba(255,204,0,${alfa})`;
}
function tracoSketch(cor){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44" preserveAspectRatio="none"><path d="M7 11c24-7 68-8 106-4 6 1 8 6 6 14-2 9-7 15-14 16-31 4-71 4-95 1-6-1-9-6-8-14 1-7 3-11 5-13z" fill="none" stroke="${cor}" stroke-width="3.2" stroke-linecap="round" stroke-opacity=".9"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function applyTheme(id){
  const alvo=TEMAS[id]?id:"light";
  document.documentElement.dataset.theme=alvo;
  document.documentElement.style.setProperty("--hl-sk",tracoSketch(acentoRGBA(1)));
  storageSet(THEME_KEY,alvo);
  storageSet(TEMAS[alvo].claro?LAST_LIGHT_KEY:LAST_DARK_KEY,alvo);
  $$(".theme-card",themeGrid).forEach(c=>c.classList.toggle("active",c.dataset.tema===alvo));
}
/* o botao alterna claro/escuro guardando o ultimo tema de cada lado,
   para quem usa Dracula nao cair no escuro padrao ao voltar */
function toggleTheme(){
  const atual=temaAtual();
  const alvo=TEMAS[atual].claro
    ? (TEMAS[storageGet(LAST_DARK_KEY)]?storageGet(LAST_DARK_KEY):"dark")
    : (TEMAS[storageGet(LAST_LIGHT_KEY)]?storageGet(LAST_LIGHT_KEY):"light");
  applyTheme(alvo);
}
function insetAtual(){
  const n=parseInt(storageGet(INSET_KEY),10);
  return Number.isFinite(n)?Math.max(12,Math.min(200,n)):INSET_PADRAO;
}
function applyInset(px,persistir=true){
  const n=Math.max(12,Math.min(200,Math.round(px)));
  document.documentElement.style.setProperty("--text-inset",`${n}px`);
  if(insetRange)insetRange.value=n;
  if(insetValue)insetValue.textContent=`${n} px`;
  if(persistir)storageSet(INSET_KEY,String(n));
}

blockEditor.addEventListener("keydown",e=>{
  const c=e.target.closest(".block-content"),row=e.target.closest(".block-row");if(!c||!row)return;

  if(slash.open){
    if(e.key==="ArrowDown"){e.preventDefault();slash.index=Math.min(slash.items.length-1,slash.index+1);markSlashSelection();return}
    if(e.key==="ArrowUp"){e.preventDefault();slash.index=Math.max(0,slash.index-1);markSlashSelection();return}
    if(e.key==="Home"){e.preventDefault();slash.index=0;markSlashSelection();return}
    if(e.key==="End"){e.preventDefault();slash.index=slash.items.length-1;markSlashSelection();return}
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const cmd=slash.items[slash.index];if(cmd)runSlash(cmd);return}
    if(e.key==="Escape"){e.preventDefault();closeSlash();return}
  }

  const CONTINUA=["bullet","numbered","todo","quote"];
  if(e.key==="Tab"&&!["table","divider"].includes(row.dataset.type)){
    e.preventDefault();
    if(row.dataset.type==="code"){document.execCommand("insertText",false,"  ");touchNote();return}
    setIndent(row,e.shiftKey?-1:1);return;
  }
  if((e.key==="ArrowUp"||e.key==="ArrowDown")&&!e.shiftKey&&!e.altKey&&!e.metaKey&&!e.ctrlKey){
    if(moverEntreBlocos(row,c,e.key==="ArrowUp"?-1:1)){e.preventDefault();return}
  }
  if(e.key==="Enter"&&!e.shiftKey&&row.dataset.type!=="table"){
    e.preventDefault();
    if(row.dataset.type==="code"){insertNewlineAtCaret();touchNote();return}
    const text=(c.textContent||"").trim();
    const nivel=Number(row.dataset.indent)||0;
    if(!text&&CONTINUA.includes(row.dataset.type)){
      /* lista vazia: primeiro volta um nivel, depois vira paragrafo */
      if(nivel>0){setIndent(row,-1);return}
      setBlockType(row,"p",true);return;
    }
    if(row.dataset.type==="toggle"){
      /* como no Notion, Enter no toggle cria um filho dentro dele */
      if(row.classList.contains("collapsed")){row.classList.remove("collapsed");applyToggles()}
      insertAfter(row,"p","",Math.min(6,nivel+1));
      return;
    }
    insertAfter(row,CONTINUA.includes(row.dataset.type)?row.dataset.type:"p","",nivel);
    return;
  }
  if(e.key==="Backspace"&&!(c.textContent||"").length){
    const prev=row.previousElementSibling;
    if((Number(row.dataset.indent)||0)>0){e.preventDefault();setIndent(row,-1);return}
    if(row.dataset.type!=="p"){e.preventDefault();setBlockType(row,"p",true);return}
    if(prev){e.preventDefault();histPush(true);row.remove();renumberLists();focusBlock(prev,true);touchNote()}
  }
  const mod=e.metaKey||e.ctrlKey;
  /* como no Notion: o primeiro Ctrl+A pega o texto do bloco, o segundo pega todos */
  if(mod&&e.key.toLowerCase()==="a"&&!e.shiftKey&&selecaoCobreBloco(c)){
    e.preventDefault();
    const linhas=linhasDoEditor();
    if(linhas.length){selecionarBlocos(linhas[0],linhas[linhas.length-1]);ancoraSel=linhas[0]}
    return;
  }
  if(mod&&e.key.toLowerCase()==="z"){e.preventDefault();histApply(e.shiftKey?1:-1);return}
  if(mod&&e.key.toLowerCase()==="y"){e.preventDefault();histApply(1);return}
  if(mod&&e.key.toLowerCase()==="b"){e.preventDefault();execFormat("bold")}
  if(mod&&e.key.toLowerCase()==="e"){e.preventDefault();toggleInlineCode()}
  if(mod&&e.key.toLowerCase()==="i"){e.preventDefault();execFormat("italic")}
  if(mod&&e.key.toLowerCase()==="u"){e.preventDefault();execFormat("underline")}
  if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();createLinkFlow()}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="h"){e.preventDefault();toggleHighlight()}
});
blockEditor.addEventListener("paste",e=>{
  const c=e.target.closest?.(".block-content");
  const row=e.target.closest?.(".block-row");
  if(!c||!row||!e.clipboardData)return;
  const plain=e.clipboardData.getData("text/plain")||"";
  const html=e.clipboardData.getData("text/html")||"";
  e.preventDefault();
  if(row.dataset.type==="code"){document.execCommand("insertText",false,plain);touchNote();return}
  /* varias linhas: interpreta como Markdown e vira blocos de verdade */
  if(/\n/.test(plain.trim())){
    histPush(true);
    const parsed=markdownToNote(plain,"");
    const blocos=parsed.blocks.filter(b=>b.type!=="p"||htmlToPlain(b.html).trim());
    if(!blocos.length)return;
    const vazio=!(c.textContent||"").trim();
    let ref=row;
    blocos.forEach((b,i)=>{
      if(i===0&&vazio){
        row.dataset.type=b.type;row.dataset.indent=b.indent||0;
        row.style.setProperty("--indent",b.indent||0);
        c.innerHTML=b.html||"";
        c.dataset.placeholder=placeholder(b.type);
        if(b.type==="todo")$(".todo-box",row).checked=!!b.checked;
        row.classList.toggle("checked",!!b.checked);
        ref=row;return;
      }
      ref.insertAdjacentHTML("afterend",blockHTML(b));
      ref=ref.nextElementSibling;
    });
    renumberLists();touchNote();
    requestAnimationFrame(()=>focusBlock(ref,true));
    return;
  }
  const limpo=html?cleanPastedHTML(html):esc(plain);
  document.execCommand("insertHTML",false,limpo||esc(plain));
  touchNote();
});

/* ---- selecao de blocos ----
   Cada bloco e um contenteditable separado, entao a selecao nativa do navegador
   nunca atravessa dois blocos: sem isto nao havia como pegar varios e apagar de
   uma vez, so esvaziar o texto e ir de Backspace. Aqui o arrasto que sai do
   bloco de origem vira selecao de blocos, e a alca seleciona no clique. */
let arrastoSel=null,ancoraSel=null;
const linhasDoEditor=()=>$$(".block-row",blockEditor);
const blocosSelecionados=()=>$$(".block-row.block-selected",blockEditor);

function limparSelecaoBlocos(){
  blocosSelecionados().forEach(r=>r.classList.remove("block-selected"));
  ancoraSel=null;
}
/* tira o cursor do texto: com bloco selecionado quem responde e o teclado global */
function soltarCursor(){
  const a=document.activeElement;
  if(a&&a.classList&&a.classList.contains("block-content"))a.blur();
  getSelection()?.removeAllRanges();
  hideBubble();
}
function selecionarBlocos(de,ate=de){
  const linhas=linhasDoEditor();
  const i=linhas.indexOf(de),j=linhas.indexOf(ate);
  if(i<0||j<0)return;
  soltarCursor();
  const ini=Math.min(i,j),fim=Math.max(i,j);
  linhas.forEach((r,k)=>r.classList.toggle("block-selected",k>=ini&&k<=fim));
}
/* o Ctrl+A do navegador ja pegou o bloco inteiro? entao a proxima vez sobe um nivel */
function selecaoCobreBloco(c){
  if(!(c.textContent||"").length)return true;
  const s=getSelection();
  if(!s||!s.rangeCount||s.isCollapsed)return false;
  return s.getRangeAt(0).toString().length>=(c.textContent||"").length;
}
function apagarBlocosSelecionados(){
  const alvos=blocosSelecionados();
  if(!alvos.length)return false;
  histPush(true);
  const vizinho=alvos[alvos.length-1].nextElementSibling||alvos[0].previousElementSibling;
  alvos.forEach(r=>r.remove());
  ancoraSel=null;
  let foco=vizinho;
  /* nota nunca fica sem bloco nenhum, senao nao ha onde voltar a escrever */
  if(!linhasDoEditor().length){
    blockEditor.insertAdjacentHTML("beforeend",blockHTML(blankBlock("p","")));
    foco=$(".block-row",blockEditor);
  }
  renumberLists();applyToggles();touchNote();
  toast(alvos.length===1?"Bloco excluído":`${alvos.length} blocos excluídos`);
  if(foco)requestAnimationFrame(()=>focusBlock(foco,true));
  return true;
}
/* linha sob o ponteiro, inclusive quando o mouse passa da primeira ou da ultima */
function linhaNoPonto(y){
  let melhor=null,dist=Infinity;
  for(const r of linhasDoEditor()){
    const b=r.getBoundingClientRect();
    if(y>=b.top&&y<=b.bottom)return r;
    const d=y<b.top?b.top-y:y-b.bottom;
    if(d<dist){dist=d;melhor=r}
  }
  return melhor;
}
blockEditor.addEventListener("mousedown",e=>{
  if(e.button!==0||e.target.closest(".block-handle"))return;
  if(!e.shiftKey&&!e.metaKey&&!e.ctrlKey)limparSelecaoBlocos();
  const row=e.target.closest(".block-row");
  arrastoSel=row&&e.target.closest(".block-content")?{inicio:row,ativo:false}:null;
});
document.addEventListener("mousemove",e=>{
  if(!arrastoSel||!(e.buttons&1))return;
  const row=linhaNoPonto(e.clientY);
  /* enquanto o arrasto nao sai do bloco de origem, quem seleciona e o navegador */
  if(!row||(!arrastoSel.ativo&&row===arrastoSel.inicio))return;
  if(!arrastoSel.ativo){arrastoSel.ativo=true;blockEditor.classList.add("selecionando-blocos")}
  selecionarBlocos(arrastoSel.inicio,row);
});
document.addEventListener("mouseup",()=>{

});

/* drag blocks */
blockEditor.addEventListener("dragstart",e=>{
  /* com texto ja selecionado o navegador tenta arrastar o proprio texto: o alvo
     vem como no de texto (sem closest) e o gesto de selecionar varios blocos
     morria ali. So a alca arrasta; qualquer outro arrasto e cancelado. */
  const alvo=e.target.nodeType===1?e.target:e.target.parentElement;
  const h=alvo&&alvo.closest?alvo.closest(".block-handle"):null;
  if(!h){e.preventDefault();return}
  draggedBlock=h.closest(".block-row");draggedBlock.classList.add("dragging");e.dataTransfer.effectAllowed="move"
});

});
blockEditor.addEventListener("drop",e=>{
  if(!draggedBlock)return;const row=e.target.closest(".block-row");if(row&&row!==draggedBlock){e.preventDefault();histPush(true);row.before(draggedBlock);renumberLists();touchNote()}
});
blockEditor.addEventListener("dragend",()=>{

});

function toolClick(e){
  const dentroDePopover=!!e.target.closest(".popover");

  if(a){
    const action=a.dataset.action;
    if(dentroDePopover)hideMenus();

  }
  const b=e.target.closest("[data-block]");
  if(b){if(dentroDePopover)hideMenus();setBlockType(currentRow(),b.dataset.block,false);return}
  const i=e.target.closest("[data-insert]");

}

/* global */
document.addEventListener("selectionchange",()=>{
  scheduleBubble();
  const s=getSelection();if(!s?.rangeCount)return;
  const n=s.anchorNode?.nodeType===1?s.anchorNode:s.anchorNode?.parentElement;
  if(n&&blockEditor.contains(n)){saveSelection();updateBlockStyle()}
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".popover")&&!e.target.closest("#moreBtn"))hideMenus();
  if(!e.target.closest(".bubble-bar")&&!e.target.closest(".popover"))scheduleBubble();
  if(!e.target.closest(".slash-menu")&&!e.target.closest(".block-content"))closeSlash()
});
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey;
  const emCampo=/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"")
    ||!!document.activeElement?.classList?.contains("block-content");
  if((e.key==="Backspace"||e.key==="Delete")&&!emCampo&&blocosSelecionados().length){
    e.preventDefault();apagarBlocosSelecionados();return;
  }
  if(e.key==="Escape"&&settingsBackdrop.classList.contains("show")){closeSettings();return}
  if(e.key==="Escape"&&bubbleBar.classList.contains("show")){hideBubble();return}
  if(e.key==="Escape"&&!findBar.classList.contains("hidden")){findClose();return}
  if(e.key==="Escape"&&blocosSelecionados().length){limparSelecaoBlocos();return}
  if(e.key==="Escape"){
    const hadMenu=slash.open||moreMenu.classList.contains("show")||folderMenu.classList.contains("show")||highlightMenu.classList.contains("show")||insertMenu.classList.contains("show")||formatMenu.classList.contains("show");
    hideMenus();closeSlash();
    if(modalBackdrop.classList.contains("show")){modalCancel.click();return}
    if(!hadMenu&&focusMode)setFocus(false);
  }
  /* desfazer tambem fora do texto (ex.: logo apos redimensionar uma midia).
     Se o bloco ja tratou, e.defaultPrevented evita o desfazer duplo. */
  if(mod&&e.key.toLowerCase()==="z"&&!e.defaultPrevented&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"")){
    e.preventDefault();histApply(e.shiftKey?1:-1);return;
  }
  if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();saveState(true,true)}
  if(mod&&e.key.toLowerCase()==="n"){e.preventDefault();createNote()}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="n"){e.preventDefault();createFolder()}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="f"){e.preventDefault();setFocus(false);$("#searchInput").focus();$("#searchInput").select();return}
  if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();findOpen();return}
  if(mod&&e.key.toLowerCase()==="d"){e.preventDefault();duplicateNote();return}
  if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();exportNotePDF();return}
  if(e.altKey&&e.key==="ArrowDown"){e.preventDefault();stepNote(1);return}
  if(e.altKey&&e.key==="ArrowUp"){e.preventDefault();stepNote(-1);return}
});
window.addEventListener("beforeunload",()=>saveState(true));
window.addEventListener("resize",()=>{closeSlash();hideMenus();hideBubble();hideResizer()});
