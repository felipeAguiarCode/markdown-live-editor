<style>
:root{
  color-scheme:light;
  --bg:#f7f7f5;
  --sidebar:#f7f7f5;
  --sidebar2:#efeeeb;
  --notes:#fbfbfa;
  --editor:#ffffff;
  --toolbar:#ffffff;
  --raised:var(--editor);
  --link:#0b6e99;
  --text:#37352f;
  --heading-text:var(--text);
  --text2:#64615b;
  --text3:#76736c;
  --line:rgba(55,53,47,.12);
  --line2:rgba(55,53,47,.22);
  --hover:rgba(55,53,47,.065);
  --selected:#eeedea;
  --accent:#a7d4e9;
  --accentText:#0b6e99;
  --danger:#a63332;
  --code:#f4f3f0;
  --scroll-thumb:color-mix(in srgb,var(--accentText) 42%,var(--sidebar2));
  --scroll-track:color-mix(in srgb,var(--sidebar2) 42%,transparent);
  /* marca-texto: uma cor so, derivada do acento do tema */
  --hl:color-mix(in srgb,var(--accent) 45%,transparent);
  --text-selection:var(--hl);
  --hl-sk:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20120%2044'%20preserveAspectRatio='none'%3E%3Cpath%20d='M7%2011c24-7%2068-8%20106-4%206%201%208%206%206%2014-2%209-7%2015-14%2016-31%204-71%204-95%201-6-1-9-6-8-14%201-7%203-11%205-13z'%20fill='none'%20stroke='%23e0b400'%20stroke-width='3.2'%20stroke-linecap='round'%20stroke-opacity='.9'/%3E%3C/svg%3E");
  --shadow:0 18px 55px rgba(0,0,0,.15);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --sidebar-w:224px;
  --sidebar-collapsed:56px;
  --notes-w:308px;
  --quick-actions-w:170px;
  --toolbar-h:34px;

  --text-inset:32px;

  --ease:cubic-bezier(.22,.8,.22,1);
  --ease-panel:cubic-bezier(.32,.72,0,1);
  --dur-panel:.38s;
  --dur-fade:.18s;
}

*{box-sizing:border-box}
html{scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
:where(.editor-scroll,.notes-list,.folder-tree,.formatbar,.block-content,.popover,.slash-menu,.settings-modal){
  scrollbar-width:thin;
}
@supports not (scrollbar-color:auto){
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--scroll-track)}
  ::-webkit-scrollbar-thumb{
    background:var(--scroll-thumb);border-radius:8px;border:2px solid transparent;background-clip:padding-box;
  }
}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select{font:inherit}
button{color:inherit;-webkit-tap-highlight-color:var(--hover)}
::selection{background:var(--text-selection)}
:focus-visible{outline:2px solid var(--accentText);outline-offset:2px}
svg{stroke-linecap:round;stroke-linejoin:round}

html[data-theme-transition]::view-transition{pointer-events:none}
html[data-theme-transition]::view-transition-group(root),
html[data-theme-transition]::view-transition-old(root),
html[data-theme-transition]::view-transition-new(root){animation:none;mix-blend-mode:normal}
html[data-theme-transition="expand"]::view-transition-new(root){
  animation:theme-reveal .62s ease-in-out both;
}
html[data-theme-transition="contract"]::view-transition-old(root){
  z-index:1;animation:theme-reveal .62s ease-in-out reverse both;
}
@keyframes theme-reveal{
  from{clip-path:circle(0px at var(--theme-origin))}
  to{clip-path:circle(var(--theme-radius) at var(--theme-origin))}
}

.app{
  width:100%;height:100vh;height:100dvh;
  position:relative;display:grid;
  grid-template-rows:minmax(0,1fr);
  grid-template-columns:var(--sidebar-w) var(--notes-w) minmax(0,1fr);
  transition:grid-template-columns var(--dur-panel) var(--ease-panel);
}
.quick-actions{
  position:absolute;inset:0 8px auto auto;z-index:100;height:34px;
  display:flex;align-items:center;gap:4px;
}
.view-actions{display:flex;align-items:center;gap:inherit}
.quick-actions .icon-btn{width:30px;height:28px;color:var(--text2)}
.quick-actions .icon-btn svg{width:16px;height:16px}
.quick-actions .icon-btn[aria-expanded="true"]{background:var(--hover);color:var(--accentText)}
.quick-actions #newNoteBtn{color:var(--accentText)}
html[data-theme="dark"] .note-bar{background:var(--toolbar)}
#mobileBack,.sidebar-scrim{display:none}
.app.sidebar-collapsed{
  grid-template-columns:var(--sidebar-collapsed) var(--notes-w) minmax(0,1fr);
}
.app.focus{
  grid-template-columns:0 0 minmax(0,1fr);
}
.app.immersive{
  --immersive-actions-bottom:max(12px,env(safe-area-inset-bottom));
  grid-template-columns:0 0 minmax(0,1fr);
  transition:none;
}
.app.immersive .sidebar,.app.immersive .notes-pane{visibility:hidden}
.app.immersive .quick-actions{
  inset:auto 12px var(--immersive-actions-bottom) auto;
  height:auto;padding:3px;gap:3px;border:1px solid var(--line);
  border-radius:10px;background:var(--raised);
}
.app.immersive .note-bar{display:none}
.app.immersive .view-actions{position:fixed;top:8px;right:12px}
.app.immersive #immersiveBtn{color:var(--accentText)}
.app.immersive .find-bar{margin-right:58px}
.app.immersive .editor-scroll{padding-right:58px}
.app.immersive .document{width:100%;padding-top:32px}
.app.immersive .formatbar{
  position:absolute;top:50%;right:9px;transform:translateY(-50%);z-index:100;
  width:42px;height:auto;max-height:max(42px,calc(100% - 92px - 2 * var(--immersive-actions-bottom)));
  flex-direction:column;flex:none;gap:3px;padding:5px 3px;
  border:1px solid var(--line2);border-radius:14px;background:var(--raised);
  overflow-x:hidden;overflow-y:auto;scrollbar-width:none;box-shadow:var(--shadow);
}
.app.immersive .formatbar .tool-group{display:contents}
.app.immersive .formatbar .tool-group.toolbar-extra{display:none}
.app.immersive .formatbar .tool-group.insert-tools{display:contents}
.app.immersive .formatbar .insert-tools .tool-btn:not([data-block="todo"]){display:none}
.app.immersive .formatbar .tool-sep{width:20px;height:1px;margin:2px 0}
.app.immersive .formatbar .toolbar-extra{display:none}
.app.immersive .formatbar :is(.tool-btn,#blockStyle,#formatMoreBtn){
  width:33px;min-width:33px;justify-content:center;padding-inline:0;
}
.app.immersive .formatbar #blockStyleLabel,
.app.immersive .formatbar #blockStyle .tool-caret,
.app.immersive .formatbar #insertBtn .tool-text{display:none}
.app.immersive .formatbar #blockStyle::before{content:"H";font-weight:650}
.app.immersive .formatbar :is(.underline,.strike){display:flex}
.app.immersive .formatbar .hl-caret{display:none}
.app.focus .sidebar,.app.focus .notes-pane{border-right-color:transparent}
/* conteudo fixo na largura final: nada reflui durante a animacao */
.notes-head,.notes-list{min-width:var(--notes-w)}
/* voltando: o conteudo aparece depois que o painel ja abriu */
.sidebar-inner,.notes-head,.notes-list{
  transition:opacity var(--dur-fade) ease var(--dur-fade),
             transform var(--dur-panel) var(--ease-panel);
}
/* saindo: some junto com o painel, sem espera */
.app.focus .sidebar-inner,
.app.focus .notes-head,
.app.focus .notes-list{
  opacity:0;transform:translateX(-16px);
  transition:opacity var(--dur-fade) ease,
             transform var(--dur-panel) var(--ease-panel);
}
.sidebar,.notes-pane{transition:border-right-color var(--dur-fade) ease}

/* LEFT */
.sidebar{
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--sidebar);
  border-right:1px solid var(--line);
}
.sidebar-inner{
  width:var(--sidebar-w);
  height:100%;
  display:flex;
  flex-direction:column;
  padding-top:16px;
}
.icon-btn{
  width:34px;height:34px;
  border:0;border-radius:8px;
  display:grid;place-items:center;
  background:transparent;
  cursor:pointer;
  transition:background .14s ease,transform .14s ease;
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor}
.collapse-btn{width:30px;height:30px;color:var(--text2);margin-right:2px}
.collapse-btn svg{width:16px;height:16px}

.nav-stack{padding:0 8px 6px}
.nav-row{
  width:100%;
  min-height:38px;
  display:flex;align-items:center;gap:9px;
  padding:0 9px;
  border:0;border-radius:8px;
  background:transparent;
  cursor:pointer;text-align:left;
}
.nav-row:hover{background:var(--hover)}
.nav-row.active{background:var(--selected);color:var(--accentText)}
.nav-icon{width:20px;height:20px;display:grid;place-items:center;flex:0 0 auto;color:var(--accentText)}
.nav-icon svg{width:17px;height:17px}
.nav-label{white-space:nowrap;font-size:13px;font-weight:650}
.nav-count{margin-left:auto;color:var(--text3);font-size:11px}
.nav-label,.nav-count,.folder-label,.folder-actions,.folder-tree{
  transition:opacity var(--dur-fade) ease var(--dur-fade);
}
.sidebar-collapsed .nav-label,.sidebar-collapsed .nav-count,
.sidebar-collapsed .folder-label,.sidebar-collapsed .folder-actions,
.sidebar-collapsed .folder-tree{
  transition:opacity var(--dur-fade) ease;
}
.sidebar-collapsed .nav-label,.sidebar-collapsed .nav-count{opacity:0;pointer-events:none}

.sidebar-divider{height:1px;background:var(--line);margin:8px 13px}
.folder-head{
  height:34px;
  padding:0 10px 0 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.folder-label{
  font-size:11px;font-weight:650;color:var(--text2);
  text-transform:uppercase;letter-spacing:.05em;
}
.folder-actions{display:flex}
.folder-actions .icon-btn{width:28px;height:28px}
.folder-actions svg{width:15px;height:15px}
.sidebar-collapsed .folder-head{visibility:hidden}

.folder-tree{
  flex:1;min-height:0;overflow:auto;
  padding:0 8px 14px;
}
.sidebar-collapsed .folder-tree{visibility:hidden}
.folder-row{
  height:36px;
  display:flex;align-items:center;gap:7px;
  padding-right:7px;
  border-radius:8px;
  cursor:pointer;
  user-select:none;
}
.folder-row:hover{background:var(--hover)}
.folder-row.active{background:var(--selected);color:var(--accentText)}
html[data-theme="dark"] :is(.nav-row,.folder-row).active{background:var(--sidebar2);color:var(--text)}
.folder-row.drop-target{background:var(--selected);box-shadow:inset 0 0 0 1px var(--accentText)}
.twisty{
  width:15px;height:15px;border:0;padding:0;background:transparent;
  color:var(--text3);display:grid;place-items:center;cursor:pointer;
}
.twisty svg{width:11px;height:11px;transition:transform .16s}
.twisty[hidden]{display:grid;visibility:hidden}
.folder-row.open .twisty svg{transform:rotate(90deg)}
.folder-icon{color:var(--accentText);display:grid;place-items:center}
.folder-icon svg{width:17px;height:17px;stroke:currentColor}
.folder-name{
  font-size:13px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:0;border:0;background:none;text-align:left;cursor:pointer;
}
.folder-count{font-size:11px;color:var(--text3)}
.row-more{
  width:26px;height:26px;color:var(--text2);
  opacity:0;position:absolute;right:5px;top:50%;transform:translateY(-50%);
}
.row-more:active{transform:translateY(-50%)}
.row-more svg{width:16px;height:16px;stroke:none}
.folder-row{position:relative;padding-right:10px}
.folder-row:hover .folder-count,.folder-row:focus-within .folder-count{visibility:hidden}
.folder-row:hover .row-more,.folder-row:focus-within .row-more,.note-card:hover .row-more,.note-card.active .row-more,.row-more:focus-visible,.note-card:focus-within .row-more{opacity:1}

.sidebar-bottom{
  min-height:52px;
  border-top:1px solid var(--line);
  display:flex;align-items:center;flex-wrap:wrap;
  width:var(--sidebar-w);
  padding:8px;
  gap:2px;
  overflow:hidden;
  transition:width var(--dur-panel) var(--ease-panel);
}
.sidebar-collapsed .sidebar-bottom{width:var(--sidebar-collapsed)}

/* NOTES */
.notes-pane{
  min-width:0;min-height:0;
  overflow:hidden;
  background:var(--notes);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.notes-head{
  padding:17px 14px 12px;
  border-bottom:1px solid var(--line);
}
.notes-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.notes-heading{min-width:0;flex:1}
.notes-title{
  font-size:23px;font-weight:720;letter-spacing:-.045em;margin:0;
  min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.notes-count{font-size:12px;color:var(--text2);margin-top:3px}
#sortBtn{color:var(--text2);margin-right:-1px}
.search-wrap{
  margin-top:13px;height:35px;border-radius:8px;
  background:var(--sidebar2);border:1px solid transparent;
  display:flex;align-items:center;gap:7px;
  padding:0 10px;color:var(--text3);
}
.search-wrap:focus-within{border-color:var(--accentText)}
.search-wrap svg{width:15px;height:15px;flex:0 0 auto}
.search-wrap input{
  width:100%;border:0;outline:0;background:transparent;color:var(--text);
  font-size:13px;min-width:0;
}
.search-wrap input::placeholder{color:var(--text3)}
.notes-list{flex:1;min-height:0;overflow:auto;padding:9px}
.note-section{
  margin:10px 7px 6px;display:flex;align-items:center;gap:6px;
  color:var(--text2);font-size:11px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
}
.note-section:not(:first-child){margin-top:17px}
.note-section svg{width:14px;height:14px;color:var(--accentText)}
.note-card{
  position:relative;
  min-height:74px;
  border:1px solid transparent;border-radius:10px;
  padding:10px 32px 10px 11px;
  cursor:pointer;
}
.note-card:hover{background:var(--hover)}
.note-card.active{background:var(--selected);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.note-card + .note-card::before{
  content:"";position:absolute;left:11px;right:11px;top:-1px;height:1px;background:var(--line)
}
.note-card.active + .note-card::before,.note-card.active::before,.note-card:hover::before{opacity:0}
.note-card-title{
  display:block;max-width:100%;padding:0;border:0;background:none;cursor:pointer;
  font-size:14px;font-weight:690;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.note-meta{
  margin-top:3px;display:flex;gap:6px;
  color:var(--text2);font-size:12px;min-width:0;
}
.note-date{flex:0 0 auto;color:var(--text3)}
.note-meta span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-preview{margin-top:4px;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-list{
  padding:48px 24px;text-align:center;color:var(--text3);
  font-size:12.5px;line-height:1.5;
}

/* WORKSPACE */
.workspace{
  min-width:0;min-height:0;
  display:flex;flex-direction:column;
  background:var(--editor);
  position:relative;
}
.note-bar{
  min-height:34px;display:flex;align-items:center;gap:5px;padding:0 calc(var(--quick-actions-w) + 8px) 0 10px;
  border-bottom:1px solid var(--line);background:var(--editor);
}
.note-location{
  display:flex;align-items:center;gap:7px;margin-right:auto;min-width:0;
  color:var(--text2);font-size:12.5px;font-weight:600;
}
.note-location svg{width:16px;height:16px;flex:none;color:var(--accentText)}
.note-location span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-bar .tool-btn{color:var(--text2)}
.note-bar #panelsBtn{margin-right:3px}
.formatbar{
  height:var(--toolbar-h);
  flex:0 0 var(--toolbar-h);
  display:flex;align-items:center;gap:2px;
  padding:2px 10px;
  border-bottom:1px solid var(--line);
  background:var(--toolbar);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  overflow-x:auto;overflow-y:hidden;
}
.tool-group{display:flex;align-items:center;gap:1px;flex:0 0 auto}
html[data-theme="dark"] .formatbar .tool-group{background:var(--sidebar2);border-radius:8px}
html[data-theme="dark"] :is(.collapse-btn,.note-bar .tool-btn,.formatbar .tool-btn){color:#fff}
.tool-sep{width:1px;height:15px;background:var(--line);margin:0 3px;flex:0 0 auto}
.tool-btn{
  min-width:32px;height:34px;
  border:0;border-radius:7px;
  padding:0 7px;
  background:transparent;
  display:flex;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;flex:0 0 auto;
}
.tool-btn:hover{background:var(--hover)}
.tool-btn[disabled]{opacity:.3;pointer-events:none}
.tool-btn svg{width:18px;height:18px}
:is(.note-bar,.formatbar) .tool-btn{min-width:30px;height:28px}
:is(.note-bar,.formatbar) .tool-btn svg{width:16px;height:16px}
.tool-btn.bold{font-weight:800;font-size:17px}
.tool-btn.italic{font-family:Georgia,serif;font-size:18px;font-style:italic;font-weight:700}
.tool-btn.underline{text-decoration:underline;font-size:16px;font-weight:650}
.tool-btn.strike{text-decoration:line-through;font-size:16px;font-weight:650}
.tool-select{
  height:34px;border:0;outline:0;border-radius:7px;
  background:transparent;color:var(--text);
  padding:0 25px 0 9px;
  cursor:pointer;
}
.tool-select:hover{background-color:var(--hover)}
#blockStyle{
  width:94px;justify-content:space-between;padding-inline:9px 6px;
  background:var(--raised);font-size:13px;color:var(--text);
}
#blockStyle:hover,#blockStyle[aria-expanded="true"]{background:var(--sidebar2)}
#blockStyleLabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-style-menu{min-width:158px}
.tool-wide{gap:5px;padding:0 10px}
.tool-text{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.tool-caret{width:12px!important;height:12px!important;opacity:.6}
.format-menu{min-width:236px;padding:8px}
.format-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:34px;padding:0 4px;font-size:12.5px;
}
.format-row .tool-select{width:126px;background:var(--bg);border:1px solid var(--line)}
.format-row option{background:var(--raised);color:var(--text)}
.format-row .tool-group{gap:4px}
.format-row input[type=color]{
  width:44px;height:26px;padding:0;cursor:pointer;
  border:1px solid var(--line2);border-radius:7px;background:transparent;
}

.color-wrap{position:relative;width:34px;height:34px;flex:0 0 auto}
.color-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer}
.color-icon{font-size:17px;font-weight:750;position:relative}
.color-icon::after{
  content:"";position:absolute;left:-2px;right:-2px;bottom:-5px;height:3px;border-radius:2px;background:var(--accent)
}
.hl-btn{position:relative}
.hl-btn::after{
  content:"";position:absolute;left:7px;right:7px;bottom:5px;height:3px;border-radius:2px;background:var(--hl)
}
.hl-caret{min-width:17px;padding:0;color:var(--text3)}
.formatbar .hl-caret{min-width:17px}
.formatbar .hl-caret svg{width:11px;height:11px}
.hl-menu{min-width:186px}
.hl-section{
  padding:2px 6px 5px;font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.05em;
}
.hl-styles{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 4px 4px}
.hl-style{
  display:flex;align-items:center;gap:7px;
  border:1px solid transparent;border-radius:8px;
  padding:5px 7px;background:transparent;cursor:pointer;text-align:left;
  font-size:11.5px;color:var(--text);
}
.hl-style:hover{background:var(--hover)}
.hl-style.active{border-color:var(--accentText)}
.hl-demo{
  flex:0 0 auto;font-size:11px;font-weight:650;line-height:1.1;
  color:var(--text);pointer-events:none;
}

.find-bar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;
  border-bottom:1px solid var(--line);
  background:var(--toolbar);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
}
.find-bar svg{width:15px;height:15px;flex:0 0 auto;color:var(--text3)}
.find-bar input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13px;
}
.find-bar input::placeholder{color:var(--text3)}
.find-count{
  flex:0 0 auto;font-size:11px;color:var(--text3);
  font-variant-numeric:tabular-nums;padding:0 4px;white-space:nowrap;
}
.find-bar .icon-btn{width:28px;height:28px}
.find-bar .icon-btn svg{width:14px;height:14px}
.editor-scroll{flex:1;min-height:0;overflow:auto}
@media screen{
  .editor-scroll[data-paper]{
    --paper-ink:color-mix(in srgb,var(--text3) 23%,transparent);
    background-attachment:local;
  }
  .editor-scroll[data-paper="ruled"]{
    background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--paper-ink) 0);
    background-size:100% 27px;
  }
  .editor-scroll[data-paper="grid"]{
    background-image:linear-gradient(to bottom,var(--paper-ink) 1px,transparent 1px),
      linear-gradient(to right,var(--paper-ink) 1px,transparent 1px);
    background-size:23px 23px;
  }
  .editor-scroll[data-paper="dots"]{
    background-image:radial-gradient(circle,var(--paper-ink) 1px,transparent 1.4px);
    background-size:21px 21px;
  }
}
.document{
  width:min(766px,100%);
  margin:0;
  padding:32px 0 130px;
  text-align:left;
}
.doc-head{padding:0 calc(var(--doc-pad) + var(--handle-w) + var(--content-pad)) 20px}
.doc-title{
  width:100%;border:0;outline:0;background:transparent;color:var(--heading-text);
  font-size:clamp(30px,3vw,42px);
  line-height:1.13;font-weight:740;letter-spacing:-.045em;
  padding:0;
}
.doc-title::placeholder{color:color-mix(in srgb,var(--text3) 60%,transparent)}
.workspace.no-note .document,.workspace.no-note .formatbar,#moreBtn[hidden]{display:none}
.editor-empty{
  height:100%;min-height:230px;display:grid;align-content:center;justify-items:center;
  gap:11px;padding:24px;color:var(--text2);text-align:center;
}
.editor-empty svg{width:37px;height:37px;color:var(--accentText)}
.editor-empty strong{color:var(--text);font-size:17px}
.editor-empty span{font-size:13px}
.block-editor{padding:0 var(--doc-pad);min-height:420px}
.block-row{
  position:relative;
  display:grid;
  grid-template-columns:var(--handle-w) minmax(0,1fr);
  min-height:32px;
  border-radius:6px;
  margin-left:calc(var(--indent,0) * 26px);
  transition:margin-left .16s var(--ease);
}
.block-handle{
  width:calc(var(--handle-w) - 2px);height:30px;border:0;border-radius:6px;background:transparent;
  display:grid;place-items:center;color:var(--text3);
  opacity:0;cursor:grab;
  transition:opacity .14s,background .14s;
}
.block-row:hover .block-handle,.block-handle:focus-visible{opacity:1}
.block-handle:hover{background:var(--hover)}
.block-handle:active{cursor:grabbing}
.block-handle svg{width:15px;height:15px}
.block-main{min-width:0;position:relative}
.block-content{
  min-height:30px;
  outline:0;
  padding:2px var(--content-pad);
  border-radius:4px;
  font-size:16.5px;
  line-height:1.65;
  letter-spacing:-.008em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.block-content:empty::before{
  content:attr(data-placeholder);
  color:color-mix(in srgb,var(--text3) 58%,transparent);
  pointer-events:none;
}
.block-row[data-type="h1"] .block-content{
  font-size:31px;font-weight:730;letter-spacing:-.035em;line-height:1.24;
  padding-top:10px;padding-bottom:5px;
}
.block-row[data-type="h2"] .block-content{
  font-size:24px;font-weight:710;letter-spacing:-.026em;line-height:1.3;
  padding-top:8px;padding-bottom:4px;
}
.block-row[data-type="h3"] .block-content{
  font-size:19px;font-weight:690;letter-spacing:-.017em;line-height:1.38;
  padding-top:6px;padding-bottom:3px;
}
.block-row[data-type="quote"] .block-main{
  border-left:3px solid var(--line2);margin:4px 0;
}
.block-row[data-type="quote"] .block-content{
  padding-left:14px;font-style:italic;color:color-mix(in srgb,var(--text) 88%,var(--text2))
}
.block-row[data-type="code"] .block-content{
  font-family:var(--mono);font-size:13px;line-height:1.55;
  background:var(--code);border:1px solid var(--line);
  border-radius:9px;padding:12px 14px;margin:5px 0;tab-size:2;
}
.block-row[data-type="bullet"] .block-main,
.block-row[data-type="numbered"] .block-main,
.block-row[data-type="todo"] .block-main{
  display:grid;grid-template-columns:25px minmax(0,1fr);align-items:start;
}
.block-marker{
  display:none;color:var(--text);
  user-select:none;text-align:center;padding-top:7px;font-size:14px;
}
.block-row[data-type="bullet"] .block-marker,
.block-row[data-type="numbered"] .block-marker,
.block-row[data-type="todo"] .block-marker{display:block}
.block-row[data-type="bullet"] .block-marker::before{content:"•";font-size:18px}
.block-row[data-type="numbered"] .block-marker::before{content:attr(data-num) ".";font-size:13px}
.todo-box{
  display:none;width:16px;height:16px;margin:5px 0 0 4px;appearance:none;
  border:1px solid color-mix(in srgb,var(--text2) 58%,var(--line2));
  border-radius:50%;vertical-align:top;background:var(--editor);cursor:pointer;
}
.block-row[data-type="todo"] .todo-box{display:block}
.todo-box:checked{background:var(--accent);border-color:transparent}
.todo-box:checked::before{
  content:"";display:block;width:6px;height:3px;margin:4px auto 0;
  border:solid #262017;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg);
}
.block-row[data-type="todo"] .block-marker::before{content:none}
.block-row[data-type="todo"].checked .block-content{text-decoration:line-through;color:var(--text2)}
/* destaque (callout) */
.block-row[data-type="callout"] .block-main{
  display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;
  background:var(--code);border:1px solid var(--line);
  border-radius:10px;padding:5px 10px 5px 3px;margin:5px 0;
}
.callout-icon::before{content:attr(data-icon)}
.callout-icon{
  display:none;width:28px;height:28px;margin-top:3px;
  border:0;border-radius:7px;background:transparent;
  font-size:16px;line-height:1;cursor:pointer;
}
.block-row[data-type="callout"] .callout-icon{display:block}
.callout-icon:hover{background:var(--hover)}

/* sanfona (toggle) */
.block-row[data-type="toggle"] .block-main{
  display:grid;grid-template-columns:22px minmax(0,1fr);align-items:start;
}
.toggle-arrow{
  display:none;width:20px;height:28px;margin-top:2px;padding:0;
  border:0;background:transparent;color:var(--text3);cursor:pointer;
}
.block-row[data-type="toggle"] .toggle-arrow{display:grid;place-items:center}
.toggle-arrow:hover{color:var(--text)}
.toggle-arrow svg{width:11px;height:11px;transition:transform .16s var(--ease)}
.block-row[data-type="toggle"]:not(.collapsed) .toggle-arrow svg{transform:rotate(90deg)}
.block-row[data-type="toggle"] .block-content{font-weight:600}
.block-row.oculto{display:none}

.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:2px}
.icon-grid button{
  width:32px;height:32px;border:0;border-radius:7px;background:transparent;
  font-size:16px;line-height:1;cursor:pointer;
}
.icon-grid button:hover{background:var(--hover)}

.block-row[data-type="divider"]{align-items:center;min-height:30px}
.block-row[data-type="divider"] .block-content{
  min-height:1px;height:1px;padding:0;margin:14px 10px;background:var(--line);pointer-events:none
}
.block-row[data-type="divider"] .block-content::before{content:none}
.block-row.dragging{opacity:.35}
.block-row.drop-before::before,.block-row.drop-after::after{
  content:"";position:absolute;left:var(--handle-w);right:0;height:2px;border-radius:2px;
  background:var(--accentText);pointer-events:none;z-index:1;
}
.block-row.drop-before::before{top:-2px}
.block-row.drop-after::after{bottom:-2px}
.block-content table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.block-content th,.block-content td{border:1px solid var(--line2);padding:8px 9px;min-width:90px;text-align:left}
.block-content th{background:var(--code);font-weight:650}
.block-row[data-type="table"] .block-content{
  overflow:auto;padding:21px 26px 25px max(var(--content-pad),calc(24px - var(--handle-w)));
}
.block-row[data-type="table"] table{margin:0}
.block-row[data-type="table"] :is(th,td){
  min-width:76px;height:34px;line-height:1.45;vertical-align:top;
}
.table-tools{
  position:fixed;inset:0;z-index:1200;pointer-events:none;
}
.table-tools button{
  position:absolute;display:grid;place-items:center;width:22px;height:22px;padding:0;
  border:1px solid var(--line2);border-radius:6px;background:var(--raised);color:var(--text2);
  pointer-events:auto;cursor:pointer;touch-action:none;
}
.table-tools button[hidden]{display:none}
.table-tools button:hover,.table-tools button:focus-visible{
  background:var(--sidebar2);color:var(--accentText);
}
.table-tools svg{width:13px;height:13px}
.table-tools [data-table-tool="row"],.table-tools [data-table-tool="column"]{cursor:grab}
.table-tools [data-table-tool="corner"]{cursor:nwse-resize}
.table-tools [data-table-tool="width"]{
  width:9px;border:0;border-radius:4px;background:transparent;cursor:col-resize;
}
.table-tools [data-table-tool="width"]:hover,.table-tools [data-table-tool="width"]:focus-visible{
  background:var(--accent);
}
.table-guide{
  position:absolute;background:var(--accent);border-radius:2px;
}
.table-dimension{
  position:absolute;padding:3px 6px;border:1px solid var(--line2);border-radius:6px;
  background:var(--raised);color:var(--text);font:600 11px var(--font);white-space:nowrap;
}
.table-menu-heading{padding:5px 9px;color:var(--text2);font-size:11px;font-weight:650}
.table-menu .menu-item:disabled{opacity:.45;cursor:default}
.block-content img{max-width:100%;border-radius:9px;display:block;margin:9px 0}
.block-content video,.block-content iframe.embed{
  display:block;width:100%;max-width:100%;
  border:0;border-radius:9px;margin:9px 0;background:#000;
}
.block-content iframe.embed{aspect-ratio:16/9;height:auto}
/* capa clicavel: o YouTube bloqueia embed com origem null (arquivo local),
   entao mostramos a miniatura e so trocamos pelo player quando da. */
.video-card{
  position:relative;display:block;
  width:100%;max-width:100%;aspect-ratio:16/9;
  margin:4px 0;border-radius:9px;overflow:hidden;
  background:#000;cursor:pointer;user-select:none;
}
.video-card img{
  width:100%;height:100%;object-fit:cover;
  display:block;margin:0;border-radius:0;
}
.video-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:44px;border-radius:12px;
  background:rgba(0,0,0,.72);display:grid;place-items:center;
  transition:background .16s ease,transform .16s ease;
}
.video-play::before{
  content:"";border-style:solid;border-width:9px 0 9px 15px;
  border-color:transparent transparent transparent #fff;margin-left:3px;
}
.video-card:hover .video-play{background:#ff0000;transform:translate(-50%,-50%) scale(1.06)}
.video-card::after{
  content:attr(data-label);
  position:absolute;right:8px;bottom:8px;
  padding:2px 7px;border-radius:5px;
  background:rgba(0,0,0,.66);color:#fff;
  font-size:10.5px;letter-spacing:.02em;
}
/* bloco de midia: sem recuo interno, a midia manda no espacamento */
.block-row[data-type="media"] .block-content{padding:2px 0;min-height:24px}
.block-row[data-type="media"] .block-content img,
.block-row[data-type="media"] .block-content video,
.block-row[data-type="media"] .block-content iframe.embed{margin:4px 0}
.block-content img,.block-content video,.block-content iframe.embed{
  -webkit-user-drag:none;user-select:none;
}

.block-row.block-selected .block-content{background:var(--selected);border-radius:6px}
.block-row.block-selected .block-handle{opacity:1}
.block-row.text-selected .block-content{background:var(--selected)}
.block-editor.text-selection .block-content::selection{background:transparent}
::highlight(editor-selection){background-color:var(--text-selection);color:var(--text)}

/* moldura de redimensionamento (fora do conteudo editavel, para nao sujar o HTML) */
.media-resizer{
  position:fixed;z-index:1250;display:none;
  border:1.5px solid var(--accentText);border-radius:9px;
  pointer-events:none;
}
.media-resizer.show{display:block}
.mr-handle{
  position:absolute;width:13px;height:13px;
  background:var(--editor);border:1.5px solid var(--accentText);border-radius:4px;
  pointer-events:auto;touch-action:none;
}
.mr-handle:hover{background:var(--accentText)}
.mr-e{right:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
.mr-se{right:-7px;bottom:-7px;cursor:nwse-resize}
.mr-sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.mr-reset{
  position:absolute;right:-9px;top:-9px;
  width:20px;height:20px;padding:0;
  border:1px solid var(--line2);border-radius:6px;
  background:var(--editor);color:var(--text2);
  display:grid;place-items:center;cursor:pointer;pointer-events:auto;
}
.mr-reset:hover{color:var(--text);background:var(--hover)}
.mr-reset svg{width:12px;height:12px}
.mr-size{
  position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);
  padding:2px 8px;border-radius:999px;
  background:var(--text);color:var(--editor);
  font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
  opacity:0;transition:opacity .12s ease;
}
.media-resizer.dragging .mr-size{opacity:1}
.block-content a{color:var(--link);text-decoration:underline;text-underline-offset:.14em}
.block-content code{font-family:var(--mono);background:var(--code);border-radius:5px;padding:2px 5px;font-size:.9em}
.block-content mark,.hl-demo{
  --c:var(--hl);
  color:inherit;background:var(--c);
  border-radius:3px;padding:.08em .18em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* traco de marcador: bordas tortas e pontas que desbotam */
.block-content mark[data-hl-style="irregular"],.hl-demo[data-hl-style="irregular"]{
  background:linear-gradient(104deg,transparent .4%,var(--c) 2.6%,var(--c) 96%,transparent 98.5%);
  border-radius:.5em .18em .45em .14em;
  padding:.12em .3em;
}
/* rabiscado: tracos por cima de uma lavagem leve */
.block-content mark[data-hl-style="scribble"],.hl-demo[data-hl-style="scribble"]{
  background-image:
    repeating-linear-gradient(112deg,var(--c) 0 4px,transparent 4px 11px),
    repeating-linear-gradient(64deg,color-mix(in srgb,var(--c) 70%,transparent) 0 3px,transparent 3px 12px),
    linear-gradient(color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 16%,transparent));
  border-radius:.28em;
  padding:.1em .26em;
}
/* sketch: contorno desenhado a mao ao redor do texto. A cor vai embutida no
   SVG (mask-image mascararia o texto junto), entao quem repinta e o applyTheme. */
.block-content mark[data-hl-style="sketch"],.hl-demo[data-hl-style="sketch"]{
  background:var(--hl-sk) no-repeat center/100% 100%;
  border-radius:0;padding:.16em .42em;
}


/* SLASH */
.slash-menu{
  position:fixed;z-index:1100;
  width:304px;max-height:390px;overflow:auto;
  display:none;padding:7px;
  border:1px solid var(--line);
  border-radius:12px;
  background:color-mix(in srgb,var(--raised) 95%,transparent);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:var(--shadow);
}
.slash-menu.show{display:block;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.slash-caption{
  padding:6px 8px;color:var(--text3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em
}
.slash-item{
  width:100%;min-height:49px;border:0;border-radius:8px;background:transparent;
  display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;
  padding:6px 8px;text-align:left;cursor:pointer
}
.slash-item:hover,.slash-item.selected{background:var(--hover)}
.slash-icon{
  width:32px;height:32px;border:1px solid var(--line);border-radius:7px;
  display:grid;place-items:center;background:var(--editor);font-size:13px;font-weight:700
}
.slash-name{font-size:12.5px;font-weight:650}
.slash-desc{font-size:10.5px;color:var(--text3);margin-top:2px}

/* MENUS / MODALS */
.popover{
  position:fixed;z-index:1200;display:none;
  min-width:215px;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow:auto;padding:6px;
  border:1px solid var(--line);border-radius:11px;
  background:color-mix(in srgb,var(--raised) 96%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.popover.show{display:block;animation:pop .13s var(--ease)}
.menu-item{
  width:100%;height:34px;border:0;border-radius:7px;background:transparent;
  display:flex;align-items:center;gap:8px;padding:0 9px;
  cursor:pointer;text-align:left;font-size:12.5px;
}
.menu-item:hover{background:var(--hover)}
.menu-item:disabled{cursor:default;opacity:.45;background:transparent}
.menu-item.danger{color:var(--danger)}
.menu-item svg{width:15px;height:15px}
.insert-menu .menu-item svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.7;color:var(--accentText)}
.note-actions-menu .menu-item > svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.7}
.menu-sep{height:1px;background:var(--line);margin:5px 3px}
.menu-item[aria-pressed="true"]{background:var(--selected);color:var(--accentText);font-weight:650}
.template-menu{width:min(326px,calc(100vw - 16px));max-height:calc(100dvh - 66px);padding:7px}
.template-menu.catalog-open{
  width:min(384px,calc(100vw - 16px));max-height:min(630px,calc(100dvh - 66px));
}
html[data-theme="dark"] .template-menu{border-radius:16px}
.template-catalog-head{
  position:sticky;top:-7px;z-index:1;display:flex;align-items:center;gap:8px;
  margin-bottom:4px;padding:2px 3px 7px;border-bottom:1px solid var(--line);
  background:var(--raised);font-size:14px;
}
.template-catalog-head .icon-btn{width:29px;height:29px;color:var(--text2)}
.template-option{
  width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) 16px;align-items:center;gap:10px;
  border:0;border-radius:8px;background:none;padding:9px 8px;text-align:left;cursor:pointer;
}
.template-option:hover,.template-option:focus-visible{background:var(--hover)}
.template-option .template-icon{
  width:36px;height:36px;display:grid;place-items:center;border-radius:8px;
  background:var(--selected);color:var(--accentText);
}
.template-option svg{width:19px;height:19px}
.template-option > svg{width:15px;height:15px;color:var(--text2)}
.template-option strong,.template-option small{display:block}
.template-option strong{font-size:13px}
.template-option small{color:var(--text2);font-size:11.5px;line-height:1.35;margin-top:3px}

.modal-backdrop{
  position:fixed;inset:0;z-index:1500;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.18);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(390px,calc(100vw - 30px));
  border:1px solid var(--line);border-radius:16px;
  background:var(--raised);box-shadow:var(--shadow);
  padding:18px;
}
.modal h3{margin:0 0 5px;font-size:17px;letter-spacing:-.02em}
.modal p{margin:0 0 14px;font-size:12.5px;line-height:1.45;color:var(--text2)}
.modal input{
  width:100%;height:38px;border:1px solid var(--line2);border-radius:9px;
  padding:0 10px;outline:0;background:var(--bg);color:var(--text)
}
.modal input:focus{border-color:var(--accentText);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}
.btn{
  height:34px;border:1px solid var(--line);border-radius:9px;
  padding:0 13px;background:var(--editor);cursor:pointer
}
.btn.primary{background:var(--accent);border-color:transparent;color:#1d1d1f;font-weight:650}
.btn.danger{background:var(--danger);border-color:transparent;color:white}

.settings-modal{
  width:min(470px,calc(100vw - 30px));padding:16px 18px 14px;
  max-height:calc(100dvh - 40px);overflow:auto;
}
.settings-head{
  position:sticky;top:0;z-index:1;background:var(--raised);
  display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;
}
.settings-head h3{margin:0}
.settings-section{
  margin:14px 0 8px;font-size:10.5px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.05em;
}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.theme-card{
  border:1px solid var(--line);border-radius:10px;
  padding:7px 6px 6px;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;align-items:stretch;
  font-size:10.5px;color:var(--text2);
  transition:border-color .14s ease,background .14s ease;
}
.theme-card:hover{background:var(--hover)}
.theme-card.active{border-color:var(--accentText);color:var(--text)}
.theme-swatch{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.theme-swatch i{flex:1}
.theme-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:40px}
.settings-row .tool-select{min-width:132px;background-color:var(--bg);border:1px solid var(--line)}
.settings-label{display:flex;flex-direction:column;font-size:12.5px;color:var(--text)}
.settings-label em{font-style:normal;font-size:10.5px;color:var(--text3);margin-top:2px}
.settings-control{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.settings-control input[type=range]{width:150px;accent-color:var(--accentText);cursor:pointer}
.settings-value{
  font-size:11.5px;color:var(--text2);min-width:44px;text-align:right;
  font-variant-numeric:tabular-nums;
}
.settings-actions{display:flex;justify-content:flex-end;margin-top:12px}

.toast{
  position:fixed;z-index:2000;left:50%;bottom:22px;
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  padding:9px 13px;border-radius:999px;
  background:var(--text);color:var(--editor);
  box-shadow:var(--shadow);font-size:11.5px;
  transition:opacity .18s,transform .18s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.tooltip{
  position:fixed;z-index:3000;opacity:0;pointer-events:none;
  padding:5px 7px;border-radius:6px;background:var(--text);color:var(--editor);
  font-size:10.5px;transition:opacity .1s;
}
.tooltip.show{opacity:.95}

.bubble-bar{
  position:fixed;z-index:1300;
  display:none;align-items:center;gap:2px;
  padding:4px;
  border:1px solid var(--line);border-radius:11px;
  background:color-mix(in srgb,var(--raised) 96%,transparent);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:var(--shadow);
}
.bubble-bar.show{display:flex;animation:pop .12s var(--ease)}
.bubble-bar .tool-btn{min-width:32px;height:32px;border-radius:8px}
.bubble-sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:0 0 auto}

.hidden{display:none!important}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;border:0;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;
}
/* impressao / PDF: so a nota, sem interface */
@media print{
  @page{margin:18mm 16mm}
  html,body{height:auto;overflow:visible;background:#fff}
  .quick-actions,.sidebar,.notes-pane,.note-bar,.formatbar,.find-bar,.bubble-bar,.media-resizer,
  .popover,.toast,.tooltip,.modal-backdrop,.slash-menu,.block-handle,.editor-empty,.table-tools{display:none!important}
  .app{display:block;width:auto;height:auto}
  .workspace{display:block;background:#fff}
  .editor-scroll{overflow:visible;height:auto}
  .app.immersive .editor-scroll{padding-right:0}
  .document{width:100%;max-width:100%;margin:0;padding:0}
  .doc-head{padding:0 0 12px}
  .doc-title{font-size:26pt;color:#000}
  .block-editor{padding:0;min-height:0}
  .block-row{grid-template-columns:0 minmax(0,1fr);margin-left:calc(var(--indent,0) * 18px)}
  .block-content{color:#000;font-size:11.5pt;line-height:1.5}
  .block-row[data-type="table"] .block-content{overflow:visible;padding:2px 0}
  .block-row[data-type="table"] table{width:100%!important;table-layout:auto!important}
  .block-row[data-type="table"] :is(th,td){min-width:0;border-color:#ccc}
  .block-content a{color:#0645ad;text-decoration:underline}
  .block-row[data-type="code"] .block-content{background:#f4f4f4;border:1px solid #ddd}
  .block-content iframe{display:none}
  .block-row,.block-content{page-break-inside:avoid;break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){
  .app,.sidebar,.notes-pane,.sidebar-inner,.notes-head,.notes-list,.sidebar-bottom,
  .nav-label,.nav-count,.folder-label,.folder-actions,.folder-tree{
    transition-duration:0s;
  }
  .app.focus .sidebar-inner,.app.focus .notes-head,.app.focus .notes-list{transform:none}
}
@media screen and (max-width:1250px){
  .formatbar .toolbar-extra{display:none}
}
@media screen and (max-width:1050px){
  :root{--sidebar-w:192px;--notes-w:254px}
}
@media screen and (max-width:800px){
  :root{--notes-w:100%}
  .app,.app.sidebar-collapsed,.app.focus{grid-template-columns:minmax(0,1fr)}
  .app.immersive{grid-template-columns:minmax(0,1fr)}
  .app.immersive .document{padding-top:20px}
  .app:not(.mobile-editor){--quick-actions-w:102px}
  .app:not(.mobile-editor) :is(#immersiveBtn,#moreBtn){display:none}
  .app:not(.mobile-editor) .quick-actions{top:16px}
  .collapse-btn{width:29px;margin-right:0}
  .sidebar{
    position:fixed;z-index:105;inset:0 auto 0 0;width:min(274px,82vw);
    visibility:hidden;transform:translateX(-100%);
    transition:transform var(--dur-panel) var(--ease-panel),visibility var(--dur-panel);
  }
  .app.drawer-open .sidebar{visibility:visible;transform:none;box-shadow:var(--shadow);border-right-color:var(--line)}
  .app .sidebar-inner,.app.focus .sidebar-inner{width:100%;opacity:1;transform:none}
  .sidebar-collapsed .nav-label,.sidebar-collapsed .nav-count,
  .sidebar-collapsed .folder-label,.sidebar-collapsed .folder-actions,.sidebar-collapsed .folder-tree{opacity:1;pointer-events:auto}
  .sidebar-collapsed .folder-head,.sidebar-collapsed .folder-tree{visibility:inherit}
  .sidebar-bottom,.sidebar-collapsed .sidebar-bottom{width:100%}
  .app.drawer-open .sidebar-scrim{
    display:block;position:fixed;inset:0;z-index:101;border:0;background:rgba(22,17,9,.26);
  }
  .app.focus .notes-head,.app.focus .notes-list{opacity:1;transform:none}
  .app:not(.mobile-editor) .workspace,.app.mobile-editor .notes-pane{display:none}
  .notes-pane{border-right:0}
  .notes-head{padding:16px 14px 12px}
  .notes-title-row{padding-right:var(--quick-actions-w);gap:5px}
  .notes-title{font-size:21px}
  #mobileBack{display:inline-flex}
  #panelsBtn{display:none}
  .note-bar{padding-left:8px;gap:3px}
  .formatbar{padding-inline:7px;gap:1px}
  .formatbar .tool-sep{margin-inline:2px}
  .formatbar .tool-btn{min-width:29px;padding-inline:5px}
  .formatbar .hl-caret{min-width:15px;padding:0}
  .formatbar #blockStyle{width:83px;padding-left:6px;font-size:13px}
  .formatbar .tool-wide{padding-inline:6px}
  .formatbar #insertBtn .tool-text{display:none}
  .formatbar .underline,.formatbar .strike{display:none}
  .document{padding-top:20px}
  .block-row{margin-left:calc(var(--indent,0) * 17px)}
  .doc-head,.block-editor{--doc-pad:min(10px,max(0px,calc(var(--text-inset) - var(--handle-w) - var(--content-pad))))}
}
@media screen and (max-width:360px){
  .formatbar .tool-sep{display:none}
  .formatbar .tool-btn{min-width:27px;padding-inline:4px}
  .formatbar .hl-caret{min-width:15px;padding:0}
  .formatbar #blockStyle{width:76px}
}
@media screen and (hover:none){
  .row-more{opacity:1}
  .folder-count{margin-right:24px}
  .folder-row:hover .folder-count,.folder-row:focus-within .folder-count{visibility:visible}
}
</style>
</head>
<body>
<div class="app focus" id="app">
  <button class="sidebar-scrim" id="sidebarScrim" aria-label="Fechar pastas" tabindex="-1"></button>
  <aside class="sidebar" id="sidebar" aria-label="Pastas">
    <div class="sidebar-inner">

      <div class="nav-stack">
        <button class="nav-row active" id="allNotesRow">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          </span>
          <span class="nav-label">Todas as notas</span>
          <span class="nav-count" id="allCount">0</span>
        </button>
      </div>

      <div class="sidebar-divider"></div>

      <div class="folder-head">
        <span class="folder-label">Pastas</span>
        <div class="folder-actions">
          <button class="icon-btn" id="newFolderBtn" data-tip="Nova pasta">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M3.5 6.5h6l2 2h9v10h-17z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
          </button>
        </div>
      </div>
      <div class="folder-tree" id="folderTree"></div>

      <div class="sidebar-bottom">
        <button class="icon-btn" id="importQuickBtn" data-tip="Importar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 19h16"/></svg>

function htmlToPlain(html=""){
  const template=document.createElement("template");
  template.innerHTML=html;
  return template.content.textContent||"";
}

function markdownInlineToHTML(src=""){
  let s=esc(src);
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/~~([^~]+)~~/g,'<s>$1</s>');
  /* a classe hl-<cor> ainda aparece em .md exportado antes de o marca-texto virar cor unica */
  s=s.replace(/&lt;mark class=&quot;(?:hl-\w+\s*)?(?:hls-(\w+))?&quot;&gt;([\s\S]*?)&lt;\/mark&gt;/g,
    (_m,est,txt)=>`<mark data-hl-style="${est||"regular"}">${txt}</mark>`);
  s=s.replace(/&lt;mark&gt;([\s\S]*?)&lt;\/mark&gt;/g,'<mark data-hl-style="regular">$1</mark>');
  s=s.replace(/&lt;video src=&quot;([\s\S]*?)&quot;(?:\s+width=&quot;(\d+)&quot;)?[\s\S]*?&gt;(?:\s*&lt;\/video&gt;)?/g,
    (_m,src,w)=>`<video src="${src}"${w?` style="width:${w}px"`:""} controls preload="metadata"></video>`);
  s=s.replace(/&lt;iframe src=&quot;([\s\S]*?)&quot;(?:\s+width=&quot;(\d+)&quot;)?[\s\S]*?&gt;(?:\s*&lt;\/iframe&gt;)?/g,
    (_m,src,w)=>videoHTML(src,w?`${w}px`:""));
  s=s.replace(/&lt;img src=&quot;([\s\S]*?)&quot;(?:\s+alt=&quot;([\s\S]*?)&quot;)?(?:\s+width=&quot;(\d+)&quot;)?[\s\S]*?&gt;/g,
    (_m,src,alt,w)=>`<img src="${src}" alt="${alt||"imagem"}"${w?` style="width:${w}px"`:""}>`);
  s=s.replace(/==([^=]+)==/g,'<mark data-hl-style="regular">$1</mark>');
  s=s.replace(/(^|[^\*])\*([^*]+)\*/g,'$1<em>$2</em>');
  return s;
}

const indentOf=(espacos="")=>Math.max(0,Math.min(6,Math.floor(espacos.replace(/\t/g,"  ").length/2)));
/* linha que so tem midia vira bloco de midia, nao paragrafo */
function apenasMidia(html=""){
  const d=document.createElement("div");d.innerHTML=html;
  return !(d.textContent||"").trim() && !!d.querySelector("img,video,iframe,.video-card");
}
function embedHTML(url=""){
  const u=String(url).trim();
  const yt=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  const vm=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  const src=yt?`https://www.youtube.com/embed/${yt[1]}`:vm?`https://player.vimeo.com/video/${vm[1]}`:u;
  return videoHTML(src);
}
function markdownToNote(markdown,fileTitle="Nota importada"){
  const lines=markdown.replace(/\r/g,"").split("\n");
  let title=fileTitle, start=0;
  for(let i=0;i<lines.length;i++){
    if(lines[i].trim()){
      const m=lines[i].match(/^#\s+(.+)$/);
      if(m){title=m[1].trim();start=i+1}
      break;
    }
  }
  const blocks=[], code=[];
  let inCode=false, sanfonaNivel=0;
  for(let i=start;i<lines.length;i++){
    const line=lines[i];
    if(/^```/.test(line)){
      if(!inCode){inCode=true;code.length=0}
      else{blocks.push(blankBlock("code",esc(code.join("\n"))));inCode=false}
      continue;
    }
    if(inCode){code.push(line);continue}

    if(/^\|.+\|$/.test(line) && i+1<lines.length && /^\|(?:\s*:?-+:?\s*\|)+$/.test(lines[i+1])){
      const rows=[];
      const parse=v=>v.trim().slice(1,-1).split(/(?<!\\)\|/).map(c=>
        c.trim().replace(/\\\|/g,"|").split(/<br\s*\/?>/i).map(markdownInlineToHTML).join("<br>"));
      rows.push(parse(line));
      i+=2;
      while(i<lines.length && /^\|.+\|$/.test(lines[i])){rows.push(parse(lines[i]));i++}
      i--;
      const head=rows[0]||[], body=rows.slice(1);
      const table=`<table><thead><tr>${head.map(c=>`<th scope="col">${c}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      blocks.push(blankBlock("table",table));continue;
    }

    let m;
    if(/^\s*&lt;\/details&gt;\s*$/.test(esc(line))||/^\s*<\/details>\s*$/.test(line)){
      if(sanfonaNivel>0)sanfonaNivel--;
      continue;
    }
    if((m=line.match(/^\s*<details><summary>([\s\S]*?)<\/summary>\s*$/))){
      blocks.push(blankBlock("toggle",markdownInlineToHTML(m[1]),sanfonaNivel));
      sanfonaNivel=Math.min(6,sanfonaNivel+1);
      continue;
    }
    if((m=line.match(/^>\s*(\p{Extended_Pictographic}\uFE0F?)\s+(.*)$/u))){
      const bloco=blankBlock("callout",markdownInlineToHTML(m[2]),sanfonaNivel);
      bloco.icon=m[1];
      blocks.push(bloco);
      continue;
    }
    if((m=line.match(/^###\s+(.+)$/))) blocks.push(blankBlock("h3",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^##\s+(.+)$/))) blocks.push(blankBlock("h2",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^#\s+(.+)$/))) blocks.push(blankBlock("h1",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^>\s?(.*)$/))) blocks.push(blankBlock("quote",markdownInlineToHTML(m[1])));
    else if((m=line.match(/^(\s*)[-*]\s+\[([ xX])\]\s?(.*)$/))) blocks.push({...blankBlock("todo",markdownInlineToHTML(m[3]),indentOf(m[1])),checked:m[2].toLowerCase()==="x"});
    else if((m=line.match(/^(\s*)[-*+]\s+(.+)$/))) blocks.push(blankBlock("bullet",markdownInlineToHTML(m[2]),indentOf(m[1])));
    else if((m=line.match(/^(\s*)\d+\.\s+(.+)$/))) blocks.push(blankBlock("numbered",markdownInlineToHTML(m[2]),indentOf(m[1])));
    else if(/^(---|\*\*\*)\s*$/.test(line)) blocks.push(blankBlock("divider",""));
    else if((m=line.match(/^\s*\[V\u00eddeo\]\((\S+)\)\s*$/))) blocks.push(blankBlock("media",embedHTML(m[1])));
    else if(line.trim()===""){
      if(blocks.length && !(blocks.at(-1).type==="p" && !htmlToPlain(blocks.at(-1).html).trim())) blocks.push(blankBlock("p","",sanfonaNivel));
    }else{
      const html=markdownInlineToHTML(line);
      blocks.push(blankBlock(apenasMidia(html)?"media":"p",html,sanfonaNivel));
    }
  }
  if(inCode) blocks.push(blankBlock("code",esc(code.join("\n"))));
  while(blocks.length>1 && blocks.at(-1).type==="p" && !htmlToPlain(blocks.at(-1).html).trim()) blocks.pop();
  return {title,blocks:blocks.length?blocks:[blankBlock()]};
}

function migrateOld(old){
  const migrated={
    version:3,
    selectedFolderId:old.selectedFolderId||"all",
    selectedNoteId:old.selectedNoteId||null,
    sort:old.sort||"updated",
    sidebarCollapsed:true,
    openFolders:[],
    folders:Array.isArray(old.folders)?old.folders:[],
    notes:[]
  };
  migrated.notes=(old.notes||[]).map(n=>{
    const parsed=markdownToNote(n.content||"", "Nova nota");
    return {
      id:n.id||uid(),folderId:n.folderId,title:parsed.title,
      createdAt:n.createdAt||now(),updatedAt:n.updatedAt||now(),pinned:!!n.pinned,
      blocks:parsed.blocks
    };
  });
  return migrated;
}

function loadState(){
  try{
    const current=storageGet(STORAGE_KEY);
    if(current){
      const x=JSON.parse(current);
      if(Array.isArray(x.notes)&&Array.isArray(x.folders)) return x;
    }
    const old=storageGet(OLD_STORAGE_KEY);
    if(old){
      const x=JSON.parse(old);
      if(Array.isArray(x.notes)&&Array.isArray(x.folders)){
        const migrated=migrateOld(x);
        storageSet(STORAGE_KEY,JSON.stringify(migrated));
        return migrated;
      }
    }
  }catch{}
  return demoState();
}

let state=loadState();

state.sort ||= "updated";

function selectedNote(){return state.notes.find(n=>n.id===state.selectedNoteId)||null}
function childrenOf(pid){return state.folders.filter(f=>f.parentId===pid)}
function descendants(id){
  const out=[id];
  const walk=pid=>childrenOf(pid).forEach(f=>{out.push(f.id);walk(f.id)});
  walk(id);return out;
}
function folderName(id){return id==="all"?"Todas as notas":state.folders.find(f=>f.id===id)?.name||"Notas"}
function folderCount(id){const ids=new Set(descendants(id));return state.notes.filter(n=>ids.has(n.folderId)).length}
function notePlain(n){return (n.blocks||[]).map(b=>htmlToPlain(b.html||"")).join(" ").replace(/\s+/g," ").trim()}
const titleOrder = new Intl.Collator("pt-BR",{sensitivity:"base",numeric:true});
const searchKey = text => text.toLocaleLowerCase("pt-BR").normalize("NFD").replace(/\p{M}/gu,"");
const noteCount = count => `${count} ${count===1?"nota":"notas"}`;
function formatDate(iso){
  const d=new Date(iso),t=new Date();
  if(Number.isNaN(d.valueOf()))return "";
  if(d.toDateString()===t.toDateString())return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const options={day:"numeric",month:"short"};
  if(d.getFullYear()!==t.getFullYear())options.year="numeric";
  return d.toLocaleDateString("pt-BR",options);
}
function sanitizeName(s="nota"){return (s||"nota").replace(/[\\/:*?"<>|]+/g,"-").trim().slice(0,90)||"nota"}

function visibleNotes(){
  const q=searchKey(searchInput.value.trim());
  let list=state.notes.slice();
  if(state.selectedFolderId!=="all"){
    const ids=new Set(descendants(state.selectedFolderId));
    list=list.filter(n=>ids.has(n.folderId));
  }
  if(q) list=list.filter(n=>searchKey(`${n.title} ${notePlain(n)}`).includes(q));
  list.sort((a,b)=>{
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    if(state.sort==="title")return titleOrder.compare(a.title,b.title);
    if(state.sort==="created")return new Date(b.createdAt)-new Date(a.createdAt);
    return new Date(b.updatedAt)-new Date(a.updatedAt);
  });
  return list;
}

let avisouArmazenamento=false;
/* storageSet cai para memoria quando estoura a cota; sem checar o retorno
   o app dizia "Salvo" e o conteudo sumia no recarregamento. */
function persistState(notify=false){
  let ok=false;
  try{ ok=storageSet(STORAGE_KEY,JSON.stringify(state)) }catch{ ok=false }
  if(ok){
    avisouArmazenamento=false;
    setSaveState("saved");
    if(notify)toast("Salvo no navegador");
    return true;
  }
  setSaveState("error");
  if(notify||!avisouArmazenamento){
    avisouArmazenamento=true;
    toast("Sem espaço no navegador — exporte o projeto para não perder");
  }
  return false;
}
function setSaveState(estado){
  if(!saveStateEl)return;
  saveStateEl.dataset.state=estado;
  saveStateEl.textContent=estado==="saving"?"Salvando…":estado==="error"?"Não salvo":"Salvo";
}
function saveState(immediate=false,notify=false){
  const commit=()=>{
    syncActiveNoteFromDOM();
    persistState(notify);
    if(previewDirty){previewDirty=false;renderNotes()}
  };
  clearTimeout(saveTimer);
  if(immediate)commit();
  else{setSaveState("saving");saveTimer=setTimeout(commit,180)}
}

/* Historico proprio: o execCommand('undo') do navegador tem pilha por bloco
   contenteditable, entao trocar de bloco perdia o desfazer do anterior. */
function histCaret(){
  const rows=$$(".block-row",blockEditor);
  const row=currentRow();
  const i=row?rows.indexOf(row):0;
  return i<0?0:i;
}
function histSnap(note){
  return {
    title:note.title||"",
    blocks:JSON.parse(JSON.stringify(note.blocks||[])),
    caret:histCaret()
  };
}
function histReset(){
  const note=selectedNote();
  clearTimeout(hist.timer);
  hist.id=note?note.id:null;
  hist.stack=note?[histSnap(note)]:[];
  hist.i=note?0:-1;
  histSync();
}
function histSync(){
  const u=$('[data-action="undo"]'), r=$('[data-action="redo"]');
  if(u)u.disabled=hist.i<=0;
  if(r)r.disabled=hist.i<0||hist.i>=hist.stack.length-1;
}
function histPush(immediate=false){
  if(hist.lock)return;
  clearTimeout(hist.timer);
  const run=()=>{
    const note=selectedNote();if(!note)return;
    if(hist.id!==note.id){histReset();return}
    syncActiveNoteFromDOM();
    const snap=histSnap(note);
    const atual=hist.stack[hist.i];
    if(atual&&atual.title===snap.title&&JSON.stringify(atual.blocks)===JSON.stringify(snap.blocks))return;
    hist.stack=hist.stack.slice(0,hist.i+1);
    hist.stack.push(snap);
    if(hist.stack.length>120)hist.stack.shift();
    hist.i=hist.stack.length-1;
    histSync();
  };
  if(immediate)run();else hist.timer=setTimeout(run,600);
}
function histApply(dir){
  const note=selectedNote();if(!note)return;
  if(hist.id!==note.id){histReset();return}
  clearTimeout(hist.timer);
  /* o que esta na tela e mais novo que o topo da pilha: registra antes de voltar */
  if(dir<0)histPush(true);
  const alvo=hist.i+dir;
  if(alvo<0||alvo>=hist.stack.length){histSync();return}
  hist.i=alvo;
  const snap=hist.stack[alvo];
  const editingTitle=document.activeElement===docTitle;
  hist.lock=true;
  note.title=snap.title;
  note.blocks=JSON.parse(JSON.stringify(snap.blocks));
  note.updatedAt=now();
  renderEditor();renderNotes();
  const rows=$$(".block-row",blockEditor);
  const row=rows[Math.min(rows.length-1,Math.max(0,snap.caret||0))];
  if(editingTitle)docTitle.focus({preventScroll:true});
  else if(row)focusBlock(row,true);
  hist.lock=false;
  histSync();
  persistState();
}

function touchNote(){
  const note=selectedNote();if(!note)return;
  note.updatedAt=now();
  previewDirty=true;
  histPush();
  saveState();
}

function renderNotes(){
  listTitle.textContent=folderName(state.selectedFolderId);

  const searching=!!searchInput.value.trim();
  $("#notesCount").textContent=searching?`${list.length} ${list.length===1?"resultado":"resultados"}`:noteCount(list.length);
  if(!list.length){
    notesList.innerHTML=searching?`<div class="empty-list">Nenhuma nota corresponde à busca.</div>`:
      `<div class="empty-list">Esta lista está vazia.<br>Crie uma nota ou escolha um modelo.</div>`;
    return;
  }
  const focused=document.activeElement?.closest(".note-card");
  const focusId=focused?.dataset.noteId;
  const focusMore=document.activeElement?.hasAttribute("data-note-options");
  const cards=notes=>notes.map(n=>{
    const active=n.id===state.selectedNoteId;
    const title=esc(n.title||"Sem título");
    const date=state.sort==="created"?n.createdAt:n.updatedAt;
    const folder=state.selectedFolderId!==n.folderId?`<span>·</span><span>${esc(folderName(n.folderId))}</span>`:"";
    return `<div class="note-card ${active?"active":""}" data-note-id="${esc(n.id)}" draggable="true">

/* numeracao das listas: calculada no JS para respeitar niveis e reinicios */
/* Sanfona: recolhe os blocos seguintes com indentacao maior que a do toggle. */
function applyToggles(){
  let ocultarAcimaDe=null;
  $$(".block-row",blockEditor).forEach(row=>{
    const ind=Number(row.dataset.indent)||0;
    if(ocultarAcimaDe!==null){
      if(ind>ocultarAcimaDe){row.classList.add("oculto");return}
      ocultarAcimaDe=null;
    }
    row.classList.remove("oculto");
    if(row.dataset.type==="toggle"&&row.classList.contains("collapsed"))ocultarAcimaDe=ind;
  });
}
function renumberLists(){
  const counters=[];
  $$(".block-row",blockEditor).forEach(row=>{
    if(row.dataset.type!=="numbered"){counters.length=0;return}
    const lvl=Math.max(0,Math.min(6,Number(row.dataset.indent)||0));
    counters[lvl]=(counters[lvl]||0)+1;
    counters.length=lvl+1;
    $(".block-marker",row)?.setAttribute("data-num",counters[lvl]);
  });
}
function setIndent(row,delta){
  const cur=Number(row.dataset.indent)||0;
  const next=Math.max(0,Math.min(6,cur+delta));
  if(next===cur)return false;
  histPush(true);
  row.dataset.indent=next;
  row.style.setProperty("--indent",next);
  renumberLists();applyToggles();touchNote();
  return true;
}

/* Em arquivo local o iframe do YouTube/Vimeo nunca renderiza (erro 153):
   troca por capa clicavel. Servido por http o iframe fica como esta. */
function normalizarVideos(){
  if(location.protocol!=="file:")return;
  $$("iframe.embed",blockEditor).forEach(f=>{
    const src=f.getAttribute("src")||"";
    if(!/youtube\.com\/embed\/|player\.vimeo\.com\/video\//.test(src))return;
    const d=document.createElement("div");
    d.innerHTML=videoHTML(src,f.style.width||"");
    const novo=d.firstElementChild;
    if(novo)f.replaceWith(novo);
  });
}

function currentRow(){

/* --- navegacao vertical entre blocos -------------------------------
   Cada bloco e um contenteditable separado, entao a seta do navegador
   parava na borda. Aqui detectamos primeira/ultima linha visual e
   pulamos para o bloco vizinho mantendo a coluna. */
function caretRect(){
  const sel=getSelection();
  if(!sel||!sel.rangeCount)return null;
  const r=sel.getRangeAt(0).cloneRange();
  r.collapse(true);
  let rect=r.getBoundingClientRect();
  if(rect&&(rect.height||rect.width))return rect;
  const no=r.startContainer,off=r.startOffset;
  if(no&&no.nodeType===3){
    if(off>0){
      const q=document.createRange();q.setStart(no,off-1);q.setEnd(no,off);
      const b=q.getBoundingClientRect();if(b.height)return b;
    }
    if(off<no.length){
      const q=document.createRange();q.setStart(no,off);q.setEnd(no,off+1);
      const b=q.getBoundingClientRect();if(b.height)return b;
    }
  }
  return null;
}
function pontoParaRange(x,y){
  if(document.caretRangeFromPoint)return document.caretRangeFromPoint(x,y);
  if(document.caretPositionFromPoint){
    const pos=document.caretPositionFromPoint(x,y);
    if(!pos)return null;
    const r=document.createRange();r.setStart(pos.offsetNode,pos.offset);r.collapse(true);return r;
  }
  return null;
}
function colocarCaretNaLinha(c,onde,x){
  const r=c.getBoundingClientRect();
  const lh=parseFloat(getComputedStyle(c).lineHeight)||22;
  const y=onde==="fim"?r.bottom-Math.min(lh,r.height)/2:r.top+Math.min(lh,r.height)/2;
  const px=Math.min(Math.max(x,r.left+1),Math.max(r.left+1,r.right-1));
  let range=pontoParaRange(px,y);
  if(!range||!c.contains(range.startContainer)){
    range=document.createRange();range.selectNodeContents(c);range.collapse(onde!=="fim");
  }
  c.focus();
  const sel=getSelection();sel.removeAllRanges();sel.addRange(range);
  savedRange=range.cloneRange();
}
function irParaBlocoVizinho(row,dir,x){
  let alvo=dir<0?row.previousElementSibling:row.nextElementSibling;
  while(alvo){
    const c=$(".block-content",alvo);
    if(c&&c.contentEditable!=="false"){
      colocarCaretNaLinha(c,dir<0?"fim":"inicio",x);
      return true;
    }
    alvo=dir<0?alvo.previousElementSibling:alvo.nextElementSibling;
  }
  if(dir<0&&!docTitle.disabled){
    docTitle.focus();
    const n=docTitle.value.length;docTitle.setSelectionRange(n,n);
    return true;
  }
  return false;
}
function moverEntreBlocos(row,c,dir){
  const cr=c.getBoundingClientRect();
  const lh=parseFloat(getComputedStyle(c).lineHeight)||22;
  const rect=caretRect();
  const x=rect?rect.left:cr.left+2;
  const naBorda=!rect
    ? true
    : dir<0 ? (rect.top-cr.top)<lh*0.6 : (cr.bottom-rect.bottom)<lh*0.6;
  if(!naBorda)return false;
  return irParaBlocoVizinho(row,dir,x);
}

function focusBlock(row,end=true){
  if(!row)return;
  if(row.dataset.type==="table"){focusTableCell($("td,th",row),false);return}
  const c=$(".block-content",row);if(!c||c.contentEditable==="false")return;
  c.focus();
  const r=document.createRange();r.selectNodeContents(c);r.collapse(!end);
  const s=getSelection();s.removeAllRanges();s.addRange(r);savedRange=r.cloneRange();
}
function setBlockType(row,type,clear=false){

  c.dataset.placeholder=placeholder(type);

  renumberLists();applyToggles();

function insertAfter(row,type="p",html="",indent=0,{record=true,focusEnd=true,align}={}){
  if(record)histPush(true);
  const b=blankBlock(type,html,indent);
  if(align)b.align=align;
  row.insertAdjacentHTML("afterend",blockHTML(b));
  const next=row.nextElementSibling;renumberLists();applyToggles();touchNote();
  if(type!=="divider")focusBlock(next,focusEnd);
  return next;
}

function handleEditorEnter(row,content){
  const continues=["bullet","numbered","todo","quote"];
  const type=row.dataset.type;
  const level=Number(row.dataset.indent)||0;
  if(type==="code"){insertNewlineAtCaret();touchNote();return}
  if(!content.textContent.trim()&&continues.includes(type)){
    if(level>0)setIndent(row,-1);
    else setBlockType(row,"p",true);
    return;
  }
  if(type==="toggle"){
    row.classList.remove("collapsed");applyToggles();
    insertAfter(row,"p","",Math.min(6,level+1));
    return;
  }
  histPush(true);
  const selection=getSelection();
  const range=selection?.rangeCount?selection.getRangeAt(0):null;
  const rest=document.createElement("div");
  if(range&&content.contains(range.startContainer)&&content.contains(range.endContainer)){
    const tail=intervaloDoBloco(content);
    tail.setStart(range.endContainer,range.endOffset);
    rest.append(tail.extractContents());
    if(!range.collapsed)range.deleteContents();
  }
  insertAfter(row,continues.includes(type)?type:"p",rest.innerHTML,level,
    {record:false,focusEnd:false,align:validBlockAlignment(content.style.textAlign)});
}

/* Tabelas simples mantêm o HTML original das notas e dos arquivos Markdown. */
const tableTools=$("#tableTools"),tableMenu=$("#tableMenu");
const tableGuide=$("#tableGuide"),tableDimension=$("#tableDimension");
const tableButtons=new Map($$("[data-table-tool]",tableTools).map(button=>[button.dataset.tableTool,button]));
let activeTableCell=null,tableGesture=null,skipTableClick=false;

function tableCellAt(node){
  const element=node?.nodeType===Node.ELEMENT_NODE?node:node?.parentElement;
  const cell=element?.closest("td,th");
  const block=cell?.closest('.block-row[data-type="table"]');
  return block&&blockEditor.contains(block)?cell:null;
}
function selectedTableCell(){
  const selection=getSelection();
  return tableCellAt(selection?.anchorNode);
}
function tableGrid(table){
  const rows=Array.from(table.rows);
  const columns=Math.max(0,...rows.map(row=>row.cells.length));
  const simple=!!columns&&!table.tFoot&&(table.tHead?.rows.length??0)<=1&&
    rows.every(row=>Array.from(row.cells).every(cell=>cell.colSpan===1&&cell.rowSpan===1));
  return {rows,columns,simple};
}
function tableHeaders(table){
  const first=table.rows[0];
  const cells=Array.from(first.cells);
  return {
    row:first.parentElement===table.tHead||(!!cells.length&&cells.every(cell=>cell.tagName==="TH"&&cell.scope!=="row")),
    column:table.hasAttribute("data-header-column")||cells[0]?.scope==="row"
  };
}
function applyTableHeaders(table,headers){
  const rows=Array.from(table.rows);
  const body=table.tBodies[0]||table.createTBody();
  const rest=headers.row?rows.slice(1):rows;
  if(headers.row){
    const head=table.tHead||table.createTHead();
    if(rows[0].parentElement!==head)head.append(rows[0]);
  }
  if(rest.some(row=>row.parentElement!==body))body.append(...rest);
  if(!headers.row)table.deleteTHead();
  table.toggleAttribute("data-header-column",headers.column);
  rows.forEach((row,r)=>Array.from(row.cells).forEach((original,c)=>{
    const scope=headers.row&&r===0?"col":headers.column&&c===0?"row":"";
    let cell=original;
    if((cell.tagName==="TH")!==!!scope){
      cell=document.createElement(scope?"th":"td");
      for(const {name,value} of original.attributes)cell.setAttribute(name,value);
      cell.append(...original.childNodes);original.replaceWith(cell);
    }
    if(scope)cell.scope=scope;
    else cell.removeAttribute("scope");
  }));
}
function tableWidths(table){
  const group=table.querySelector(":scope > colgroup[data-table-widths]");
  return group?Array.from(group.children,col=>parseInt(col.style.width,10)):null;
}
function setTableWidths(table,widths){
  let group=table.querySelector(":scope > colgroup[data-table-widths]");
  if(!widths){
    group?.remove();
    table.style.removeProperty("width");table.style.removeProperty("table-layout");
    return;
  }
  if(!group){
    group=document.createElement("colgroup");group.dataset.tableWidths="";
    table.insertBefore(group,table.querySelector(":scope > thead, :scope > tbody"));
  }
  const cols=widths.map(width=>{
    const col=document.createElement("col");col.style.width=width+"px";return col;
  });
  group.replaceChildren(...cols);
  table.style.width=widths.reduce((total,width)=>total+width,0)+"px";
  table.style.tableLayout="fixed";
}
function focusTableCell(cell,end=false){
  if(!cell)return;
  const content=cell.closest(".block-content");
  content.focus();
  const range=intervaloDoBloco(cell);
  range.collapse(!end);restaurarCaret(content,range);
  cell.scrollIntoView({block:"nearest",inline:"nearest"});
  showTableTools(cell);
}
function editTable(table,change,focusRow,focusColumn){
  const grid=tableGrid(table);
  if(!grid.simple){toast("Use uma tabela sem células mescladas para alterar linhas e colunas.");return}
  const headers=tableHeaders(table);
  histPush(true);
  for(const row of grid.rows){
    while(row.cells.length<grid.columns)row.insertCell();
  }
  change(headers);
  applyTableHeaders(table,headers);
  const row=table.rows[Math.min(focusRow,table.rows.length-1)];
  focusTableCell(row.cells[Math.min(focusColumn,row.cells.length-1)]);
  touchNote();histPush(true);
}
function moveTableEntry(node,target,after){
  if(after)target.after(node);
  else target.before(node);
}
function mutateTableAxis(table,axis,operation,index,target=index){
  const rows=Array.from(table.rows);
  if(axis==="row"){
    const row=rows[index];
    if(operation==="insert"){
      const added=table.insertRow(index);
      for(let n=0;n<rows[0].cells.length;n++)added.insertCell();
    }
    if(operation==="remove")row.remove();
    if(operation==="duplicate")row.after(row.cloneNode(true));
    if(operation==="move")moveTableEntry(row,rows[target],target>index);
    if(operation==="clear")Array.from(row.cells).forEach(cell=>cell.replaceChildren());
    return;
  }
  for(const row of rows){
    const cell=row.cells[index];
    if(operation==="insert")row.insertCell(index);
    if(operation==="remove")cell.remove();
    if(operation==="duplicate")cell.after(cell.cloneNode(true));
    if(operation==="move")moveTableEntry(cell,row.cells[target],target>index);
    if(operation==="clear")cell.replaceChildren();
  }
  const widths=tableWidths(table);
  if(!widths||operation==="clear")return;
  if(operation==="insert")widths.splice(index,0,widths[index]??widths.at(-1));
  if(operation==="remove")widths.splice(index,1);
  if(operation==="duplicate")widths.splice(index+1,0,widths[index]);
  if(operation==="move")widths.splice(target,0,...widths.splice(index,1));
  setTableWidths(table,widths);
}
function tableAction(cell,axis,operation,offset=0){
  const table=cell.closest("table");
  const {rows,columns}=tableGrid(table);
  const row=cell.parentElement.rowIndex,column=cell.cellIndex;
  if(operation==="clear-cell"){
    histPush(true);cell.replaceChildren();focusTableCell(cell);touchNote();histPush(true);return;
  }
  const index=axis==="row"?row:column;
  const count=axis==="row"?rows.length:columns;
  const at=operation==="append"?count:operation==="insert"?index+offset:index;
  const next=operation==="move"?index+offset:(operation==="duplicate"?index+1:at);
  if(operation==="remove"&&count===1)return;
  if(operation==="move"&&(next<0||next>=count||next===index))return;
  editTable(table,headers=>{
    if(operation==="header")headers[axis]=!headers[axis];
    else if(operation==="fit")setTableWidths(table,null);
    else mutateTableAxis(table,axis,operation==="append"?"insert":operation,at,next);
  },axis==="row"?next:row,axis==="column"?next:column);
}

function placeTableTool(name,x,y,bounds){
  const button=tableButtons.get(name);
  button.hidden=y<bounds.top||y+22>bounds.bottom||x<0||x+22>innerWidth;
  button.style.left=x+"px";button.style.top=y+"px";

function placeTableTools(){
  if(!activeTableCell?.isConnected||!tableCellAt(activeTableCell)){hideTableTools();return}
  const table=activeTableCell.closest("table");
  if(!table.getClientRects().length){hideTableTools();return}
  const cell=activeTableCell.getBoundingClientRect(),rect=table.getBoundingClientRect();
  const content=table.closest(".block-content").getBoundingClientRect();
  const bounds=$("#editorScroll").getBoundingClientRect();
  if(rect.bottom<bounds.top||rect.top>bounds.bottom){tableTools.classList.add("hidden");return}
  tableTools.classList.remove("hidden");
  const left=Math.max(rect.left,content.left+6,bounds.left+6);
  const right=Math.min(rect.right,content.right-25,bounds.right-25);
  const columnVisible=cell.right>left&&cell.left<right;
  const column=Math.max(left,Math.min(right-22,(cell.left+cell.right)/2-11));
  const midRow=Math.max(bounds.top,Math.min(bounds.bottom-22,(rect.top+rect.bottom)/2-11));
  placeTableTool("row",Math.max(bounds.left,left-23),(cell.top+cell.bottom)/2-11,bounds);
  placeTableTool("column",column,rect.top-23,bounds);
  placeTableTool("add-row",(left+right)/2-11,rect.bottom+3,bounds);
  placeTableTool("add-column",right+2,midRow,bounds);
  placeTableTool("corner",right+2,rect.bottom+3,bounds);
  placeTableTool("width",cell.right-4,rect.top-3,bounds);
  if(!columnVisible)tableButtons.get("column").hidden=true;
  if(!columnVisible||cell.right>right+2)tableButtons.get("width").hidden=true;
}

function openTableMenu(cell,scope,x,y,anchor=null){
  const table=cell.closest("table");
  const {rows,columns,simple}=tableGrid(table);
  const headers=tableHeaders(table);
  const item=(label,axis,operation,offset=0,disabled=false,danger=false)=>
    `<button type="button" class="menu-item${danger?" danger":""}" data-table-action="${axis}:${operation}:${offset}" ${disabled?"disabled":""}>${label}</button>`;
  const section=(axis,index,count)=>{
    const isRow=axis==="row",name=isRow?"linha":"coluna";
    return `<div class="table-menu-heading">${isRow?"Linha":"Coluna"} ${index+1}</div>`+
      item(isRow?"Inserir acima":"Inserir à esquerda",axis,"insert",0,!simple)+
      item(isRow?"Inserir abaixo":"Inserir à direita",axis,"insert",1,!simple)+
      item(`Duplicar ${name}`,axis,"duplicate",0,!simple)+
      item(isRow?"Mover para cima":"Mover para a esquerda",axis,"move",-1,!simple||index===0)+
      item(isRow?"Mover para baixo":"Mover para a direita",axis,"move",1,!simple||index===count-1)+
      item(`Limpar ${name}`,axis,"clear",0,!simple)+
      item(`Remover ${name}`,axis,"remove",0,!simple||count===1,true);
  };
  const options=[];
  if(scope!=="column")options.push(section("row",cell.parentElement.rowIndex,rows.length));
  if(scope!=="row")options.push(section("column",cell.cellIndex,columns));
  options.push(item(headers.row?"Desativar cabeçalho de linha":"Ativar cabeçalho de linha","row","header",0,!simple)+
    item(headers.column?"Desativar cabeçalho de coluna":"Ativar cabeçalho de coluna","column","header",0,!simple)+
    item("Ajustar à largura da nota","column","fit",0,!simple)+item("Limpar célula","cell","clear-cell"));
  tableMenu.innerHTML=options.join('<div class="menu-sep"></div>');
  showTableTools(cell);hideMenus("table");popoverAnchor=anchor;
  for(const tool of ["row","column"])tableButtons.get(tool).setAttribute("aria-expanded","false");
  if(anchor)anchor.setAttribute("aria-expanded","true");
  positionMenu(tableMenu,x,y);
  $("button:not(:disabled)",tableMenu)?.focus({preventScroll:true});
}

tableTools.addEventListener("pointerdown",e=>{
